idade de informação.", "Pode trazer temas de curiosidade e de aprendizagem crítica.", "Pode levantar a questão de quando a vigilância deixa de proteger."], "pensar": ["Estou a examinar isto para compreender ou para não ter de entrar?", "O que é que eu defenderia, se tivesse de defender alguma coisa?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Page of Swords", "pt": "Valete de Espadas", "arcano": "menor", "num": 11, "naipe": "Espadas", "img": "Swords11.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A lithe, active figure holds a sword upright in both hands, while in the act of swift walking. He is passing over rugged land, and about his way the clouds are collocated wildly. He is alert and lithe, looking this way and that, as if an expected enemy might appear at any moment."]}, {"t": "Significados", "f": "Waite", "p": ["Authority, overseeing, secret service, vigilance, spying, examination, and the qualities thereto belonging."]}, {"t": "Invertida", "f": "Waite", "p": ["More evil side of these qualities; what is unforeseen, unprepared state; sickness is also intimated."]}, {"t": "Resumo", "f": "Waite", "p": ["An indiscreet person will pry into the Querent's secrets. Reversed: Astonishing news. Fen.— Followed by Ace and King, imprisonment; for girl or wife, treason on the part of friends. Reversed: Victory and consequent fortune for a soldier in war."]}], "busca": "page of swords valete de espadas a lithe, active figure holds a sword upright in both hands, while in the act of swift walking. he is passing over rugged land, and about his way the clouds are collocated wildly. he is alert and lithe, looking this way and that, as if an expected enemy might appear at any moment. authority, overseeing, secret service, vigilance, spying, examination, and the qualities thereto belonging. more evil side of these qualities; what is unforeseen, unprepared state; sickness is also intimated. an indiscreet person will pry into the querent's secrets. reversed: astonishing news. fen.— followed by ace and king, imprisonment; for girl or wife, treason on the part of friends. reversed: victory and consequent fortune for a soldier in war. vigilância curiosidade observação cautela aprendizagem crítica uma figura jovem, espada erguida, atenta ao que se aproxima. waite associa-o a autoridade, supervisão, vigilância e exame. é o intelecto no início: alerta, questionador, ainda sem a experiência que ensina quando não é preciso estar de guarda. o pensamento crítico começa frequentemente como defesa. detectar falhas dá segurança e distância, e é mais fácil do que arriscar uma posição própria. a sombra é a vigilância permanente: alguém que examina tudo e não se compromete com nada, transformando a lucidez num lugar seguro de onde nada pode ser exigido. pode assinalar atenção, observação ou necessidade de informação. pode trazer temas de curiosidade e de aprendizagem crítica. pode levantar a questão de quando a vigilância deixa de proteger. estou a examinar isto para compreender ou para não ter de entrar? o que é que eu defenderia, se tivesse de defender alguma coisa? a. e. waite; estrutura tradicional dos naipes."}, {"id": "knight-of-swords", "guia": {"palavras": ["ímpeto mental", "confronto", "pressa", "argumento", "determinação"], "essencia": "Carga a toda a velocidade, espada erguida. Waite fala de perícia, bravura e capacidade, mas também de inimizade, ira e destruição. É o pensamento em movimento máximo — eficaz e sem travagem, com o valor e o perigo a virem exactamente da mesma qualidade.", "psicologia_sombra": "Avançar em linha recta resolve depressa e destrói com a mesma rapidez. Quem argumenta bem raramente tem oportunidade de descobrir que estava errado, porque ganha antes de chegar lá. A sombra desta carta é a inteligência usada como cavalo de carga: convicção que confunde velocidade com razão, e que deixa atrás de si mais estragos do que resultados.", "leitura": ["Pode representar acção decidida, confronto directo ou pressa.", "Pode trazer temas de argumentação e de convicção intensa.", "Pode levantar a questão do que fica no caminho."], "pensar": ["Estou com pressa de resolver, ou com pressa de ter razão?", "O que é que eu não estou a ouvir por estar a avançar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Knight of Swords", "pt": "Cavaleiro de Espadas", "arcano": "menor", "num": 12, "naipe": "Espadas", "img": "Swords12.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He is riding in full course, as if scattering his enemies. In the design he is really a prototypical hero of romantic chivalry. He might almost be Galahad, whose sword is swift and sure because he is clean of heart."]}, {"t": "Significados", "f": "Waite", "p": ["Skill, bravery, capacity, defence, address, enmity, wrath, war, destruction, opposition, resistance, ruin. There is therefore a sense in which the card signifies death, but it carries this meaning only in its proximity to other cards of fatality."]}, {"t": "Invertida", "f": "Waite", "p": ["Imprudence, incapacity, extravagance."]}, {"t": "Resumo", "f": "Waite", "p": ["A soldier, man of arms, satellite, stipendiary; heroic action predicted for soldier. Reversed: Dispute with an imbecile person; for a woman, struggle with a rival, who will be conquered."]}], "busca": "knight of swords cavaleiro de espadas he is riding in full course, as if scattering his enemies. in the design he is really a prototypical hero of romantic chivalry. he might almost be galahad, whose sword is swift and sure because he is clean of heart. skill, bravery, capacity, defence, address, enmity, wrath, war, destruction, opposition, resistance, ruin. there is therefore a sense in which the card signifies death, but it carries this meaning only in its proximity to other cards of fatality. imprudence, incapacity, extravagance. a soldier, man of arms, satellite, stipendiary; heroic action predicted for soldier. reversed: dispute with an imbecile person; for a woman, struggle with a rival, who will be conquered. ímpeto mental confronto pressa argumento determinação carga a toda a velocidade, espada erguida. waite fala de perícia, bravura e capacidade, mas também de inimizade, ira e destruição. é o pensamento em movimento máximo — eficaz e sem travagem, com o valor e o perigo a virem exactamente da mesma qualidade. avançar em linha recta resolve depressa e destrói com a mesma rapidez. quem argumenta bem raramente tem oportunidade de descobrir que estava errado, porque ganha antes de chegar lá. a sombra desta carta é a inteligência usada como cavalo de carga: convicção que confunde velocidade com razão, e que deixa atrás de si mais estragos do que resultados. pode representar acção decidida, confronto directo ou pressa. pode trazer temas de argumentação e de convicção intensa. pode levantar a questão do que fica no caminho. estou com pressa de resolver, ou com pressa de ter razão? o que é que eu não estou a ouvir por estar a avançar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "queen-of-swords", "guia": {"palavras": ["lucidez", "franqueza", "experiência", "discernimento", "distância"], "essencia": "Uma figura sentada, mão estendida, espada a direito. Waite associa-a a viuvez, tristeza, ausência e privação — uma lucidez que veio de ter perdido alguma coisa. É a inteligência das Espadas temperada por experiência que custou.", "psicologia_sombra": "Ver claramente porque já se passou por aquilo é uma forma de sabedoria com um preço embutido. A mesma experiência que dá discernimento pode instalar uma distância que se torna difícil de atravessar em qualquer direcção. A sombra é a lucidez como armadura: franqueza que dispensa a ternura, e a convicção de que compreender uma situação é suficiente para não ter de a viver.", "leitura": ["Pode representar clareza adquirida por experiência difícil.", "Pode trazer temas de franqueza, discernimento e distância.", "Pode levantar a questão do que a lucidez está a substituir."], "pensar": ["Esta clareza toda está a proteger-me de quê?", "Consigo compreender alguma coisa e continuar a deixá-la tocar-me?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Queen of Swords", "pt": "Rainha de Espadas", "arcano": "menor", "num": 13, "naipe": "Espadas", "img": "Swords13.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Her right hand raises the weapon vertically and the hilt rests on an arm of her royal chair the left hand is extended, the arm raised her countenance is severe but chastened; it suggests familiarity with sorrow. It does not represent mercy, and, her sword notwithstanding, she is scarcely a symbol of power."]}, {"t": "Significados", "f": "Waite", "p": ["Widowhood, female sadness and embarrassment, absence, sterility, mourning, privation, separation."]}, {"t": "Invertida", "f": "Waite", "p": ["Malice, bigotry, artifice, prudery, bale, deceit."]}, {"t": "Resumo", "f": "Waite", "p": ["A widow. Reversed: A bad woman, with ill-will towards the Querent."]}], "busca": "queen of swords rainha de espadas her right hand raises the weapon vertically and the hilt rests on an arm of her royal chair the left hand is extended, the arm raised her countenance is severe but chastened; it suggests familiarity with sorrow. it does not represent mercy, and, her sword notwithstanding, she is scarcely a symbol of power. widowhood, female sadness and embarrassment, absence, sterility, mourning, privation, separation. malice, bigotry, artifice, prudery, bale, deceit. a widow. reversed: a bad woman, with ill-will towards the querent. lucidez franqueza experiência discernimento distância uma figura sentada, mão estendida, espada a direito. waite associa-a a viuvez, tristeza, ausência e privação — uma lucidez que veio de ter perdido alguma coisa. é a inteligência das espadas temperada por experiência que custou. ver claramente porque já se passou por aquilo é uma forma de sabedoria com um preço embutido. a mesma experiência que dá discernimento pode instalar uma distância que se torna difícil de atravessar em qualquer direcção. a sombra é a lucidez como armadura: franqueza que dispensa a ternura, e a convicção de que compreender uma situação é suficiente para não ter de a viver. pode representar clareza adquirida por experiência difícil. pode trazer temas de franqueza, discernimento e distância. pode levantar a questão do que a lucidez está a substituir. esta clareza toda está a proteger-me de quê? consigo compreender alguma coisa e continuar a deixá-la tocar-me? a. e. waite; estrutura tradicional dos naipes."}, {"id": "king-of-swords", "guia": {"palavras": ["juízo", "autoridade intelectual", "rigor", "princípio", "imparcialidade"], "essencia": "Sentado a julgar, com a espada desembainhada. Waite fala de poder, comando, inteligência militante, lei e juízo. É o princípio das Espadas na sua forma mais estruturada: decidir segundo critério, e responder por isso.", "psicologia_sombra": "Decidir por princípio protege da arbitrariedade e pode servir para não ter de sentir nada. Alguém que resolve tudo pela regra dispensa-se de considerar o caso concreto, e a imparcialidade torna-se um lugar sem custo pessoal. A sombra desta carta é o rigor sem compaixão — a correcção usada como forma de manter as pessoas à distância, com a autoridade a servir de argumento em vez de a fundamentar.", "leitura": ["Pode representar juízo, autoridade ou decisão fundamentada.", "Pode trazer temas de rigor, princípio e imparcialidade.", "Pode levantar a questão de se a regra está a servir ou a substituir."], "pensar": ["Estou a aplicar um princípio ou a esconder-me atrás dele?", "Este juízo considera o caso, ou só a categoria?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "King of Swords", "pt": "Rei de Espadas", "arcano": "menor", "num": 14, "naipe": "Espadas", "img": "Swords14.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He sits in judgment, holding the unsheathed sign of his suit. He recalls, of course, the conventional Symbol of justice in the Trumps Major, and he may represent this virtue, but he is rather the power of life and death, in virtue of his office."]}, {"t": "Significados", "f": "Waite", "p": ["Whatsoever arises out of the idea of judgment and all its connexions-power, command, authority, militant intelligence, law, offices of the crown, and so forth."]}, {"t": "Invertida", "f": "Waite", "p": ["Cruelty, perversity, barbarity, perfidy, evil intention."]}, {"t": "Resumo", "f": "Waite", "p": ["A lawyer, senator, doctor. Reversed: A bad man; also a caution to put an end to a ruinous lawsuit."]}], "busca": "king of swords rei de espadas he sits in judgment, holding the unsheathed sign of his suit. he recalls, of course, the conventional symbol of justice in the trumps major, and he may represent this virtue, but he is rather the power of life and death, in virtue of his office. whatsoever arises out of the idea of judgment and all its connexions-power, command, authority, militant intelligence, law, offices of the crown, and so forth. cruelty, perversity, barbarity, perfidy, evil intention. a lawyer, senator, doctor. reversed: a bad man; also a caution to put an end to a ruinous lawsuit. juízo autoridade intelectual rigor princípio imparcialidade sentado a julgar, com a espada desembainhada. waite fala de poder, comando, inteligência militante, lei e juízo. é o princípio das espadas na sua forma mais estruturada: decidir segundo critério, e responder por isso. decidir por princípio protege da arbitrariedade e pode servir para não ter de sentir nada. alguém que resolve tudo pela regra dispensa-se de considerar o caso concreto, e a imparcialidade torna-se um lugar sem custo pessoal. a sombra desta carta é o rigor sem compaixão — a correcção usada como forma de manter as pessoas à distância, com a autoridade a servir de argumento em vez de a fundamentar. pode representar juízo, autoridade ou decisão fundamentada. pode trazer temas de rigor, princípio e imparcialidade. pode levantar a questão de se a regra está a servir ou a substituir. estou a aplicar um princípio ou a esconder-me atrás dele? este juízo considera o caso, ou só a categoria? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ace-of-pentacles", "guia": {"palavras": ["oportunidade concreta", "começo material", "semente", "recurso", "potencial"], "essencia": "Uma mão que oferece uma moeda sobre um jardim. Waite fala de contentamento perfeito, felicidade e ouro. É o princípio da terra: uma possibilidade que existe no mundo material e que, ao contrário dos outros Ases, tem desde já forma e peso.", "psicologia_sombra": "Uma oportunidade concreta obriga a decidir de maneira que uma vontade difusa não obriga. Por isso é frequentemente adiada — enquanto não se pega nela, continua intacta e não pode ser estragada. A sombra desta carta é o potencial guardado: a semente que não se planta para não arriscar descobrir que o solo não servia, ou que a pessoa não sabia cultivá-la.", "leitura": ["Pode assinalar uma oportunidade material, prática ou profissional.", "Pode trazer temas de recursos disponíveis e ainda não usados.", "Pode levantar a questão do que impede de começar."], "pensar": ["O que é que já tenho nas mãos e não estou a usar?", "O que temo descobrir se pegar mesmo nisto?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ace of Pentacles", "pt": "Ás de Ouros", "arcano": "menor", "num": 1, "naipe": "Ouros", "img": "Pentacles01.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A hand— issuing, as usual, from a cloud— holds up a pentacle."]}, {"t": "Significados", "f": "Waite", "p": ["Perfect contentment, felicity, ecstasy; also speedy intelligence; gold."]}, {"t": "Invertida", "f": "Waite", "p": ["The evil side of wealth, bad intelligence; also great riches. In any case it shews prosperity, comfortable material conditions, but whether these are of advantage to the possessor will depend on whether the card is reversed or not.", "3.3 The Greater Arcana and their Divinatory Meanings"]}, {"t": "Resumo", "f": "Waite", "p": ["The most favourable of all cards. Reversed. A share in the finding of treasure. It will be observed (1) that these adclitamenta have little connexion with the pictorial designs of the cards to which they refer, as these correspond with the more important speculative values; (2) and further that the additional meanings are very often in disagreement with those previously given. All meanings are largely independent of one another and all are reduced, accentuated or subject to modification and sometimes almost reversal by their place in a sequence. There is scarcely any canon of criticism in matters of this kind. I suppose that in proportion as any system descends from generalities to details it becomes naturally the more precarious; and in the records of professional fortune-telling, it offers more of the dregs and lees of the subject. At the same time, divinations based on intuition and second sight are of little practical value unless they come down from the region of universals to that of particulars; but in proportion as this gift is present in a particular case, the specific meanings recorded by past cartomancists will be disregarded in favour of the personal appreciation of card values. This has been intimated already. It seems necessary to add the following speculative readings. 3.5 The Recurrence of Cards in Dealing"]}], "busca": "ace of pentacles ás de ouros a hand— issuing, as usual, from a cloud— holds up a pentacle. perfect contentment, felicity, ecstasy; also speedy intelligence; gold. the evil side of wealth, bad intelligence; also great riches. in any case it shews prosperity, comfortable material conditions, but whether these are of advantage to the possessor will depend on whether the card is reversed or not. 3.3 the greater arcana and their divinatory meanings the most favourable of all cards. reversed. a share in the finding of treasure. it will be observed (1) that these adclitamenta have little connexion with the pictorial designs of the cards to which they refer, as these correspond with the more important speculative values; (2) and further that the additional meanings are very often in disagreement with those previously given. all meanings are largely independent of one another and all are reduced, accentuated or subject to modification and sometimes almost reversal by their place in a sequence. there is scarcely any canon of criticism in matters of this kind. i suppose that in proportion as any system descends from generalities to details it becomes naturally the more precarious; and in the records of professional fortune-telling, it offers more of the dregs and lees of the subject. at the same time, divinations based on intuition and second sight are of little practical value unless they come down from the region of universals to that of particulars; but in proportion as this gift is present in a particular case, the specific meanings recorded by past cartomancists will be disregarded in favour of the personal appreciation of card values. this has been intimated already. it seems necessary to add the following speculative readings. 3.5 the recurrence of cards in dealing oportunidade concreta começo material semente recurso potencial uma mão que oferece uma moeda sobre um jardim. waite fala de contentamento perfeito, felicidade e ouro. é o princípio da terra: uma possibilidade que existe no mundo material e que, ao contrário dos outros ases, tem desde já forma e peso. uma oportunidade concreta obriga a decidir de maneira que uma vontade difusa não obriga. por isso é frequentemente adiada — enquanto não se pega nela, continua intacta e não pode ser estragada. a sombra desta carta é o potencial guardado: a semente que não se planta para não arriscar descobrir que o solo não servia, ou que a pessoa não sabia cultivá-la. pode assinalar uma oportunidade material, prática ou profissional. pode trazer temas de recursos disponíveis e ainda não usados. pode levantar a questão do que impede de começar. o que é que já tenho nas mãos e não estou a usar? o que temo descobrir se pegar mesmo nisto? a. e. waite; estrutura tradicional dos naipes."}, {"id": "two-of-pentacles", "guia": {"palavras": ["adaptação", "gestão", "equilíbrio precário", "malabarismo", "flexibilidade"], "essencia": "Uma figura que faz malabarismo com duas moedas ligadas por uma fita, sobre um mar agitado. Waite fala de alegria e recreação, mas também de obstáculos, agitação e dificuldade. Gere-se mais do que uma coisa ao mesmo tempo, e funciona — enquanto o movimento não parar.", "psicologia_sombra": "A capacidade de manter várias frentes a andar é uma competência genuína e um risco. Quem se torna bom nisso raramente é obrigado a escolher, e vai adiando indefinidamente decisões que exigiriam largar alguma coisa. A sombra é o malabarismo como estilo de vida: a agitação constante que dá sensação de capacidade e evita a pergunta sobre o que interessa mesmo.", "leitura": ["Pode representar gestão simultânea de várias exigências.", "Pode trazer temas de adaptação, flexibilidade e instabilidade.", "Pode levantar a questão do que aconteceria se algo tivesse de cair."], "pensar": ["O que é que eu estou a manter no ar só para não ter de escolher?", "Isto é equilíbrio ou é agitação?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Two of Pentacles", "pt": "Dois de Ouros", "arcano": "menor", "num": 2, "naipe": "Ouros", "img": "Pentacles02.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A young man, in the act of dancing, has a pentacle in either hand, and they are joined by that endless cord which is like the number 8 reversed."]}, {"t": "Significados", "f": "Waite", "p": ["On the one hand it is represented as a card of gaiety, recreation and its connexions, which is the subject of the design; but it is read also as news and messages in writing, as obstacles, agitation, trouble, embroilment."]}, {"t": "Invertida", "f": "Waite", "p": ["Enforced gaiety, simulated enjoyment, literal sense, handwriting, composition, letters of exchange."]}, {"t": "Resumo", "f": "Waite", "p": ["Troubles are more imaginary than real. Reversed. Bad omen, ignorance, injustice."]}], "busca": "two of pentacles dois de ouros a young man, in the act of dancing, has a pentacle in either hand, and they are joined by that endless cord which is like the number 8 reversed. on the one hand it is represented as a card of gaiety, recreation and its connexions, which is the subject of the design; but it is read also as news and messages in writing, as obstacles, agitation, trouble, embroilment. enforced gaiety, simulated enjoyment, literal sense, handwriting, composition, letters of exchange. troubles are more imaginary than real. reversed. bad omen, ignorance, injustice. adaptação gestão equilíbrio precário malabarismo flexibilidade uma figura que faz malabarismo com duas moedas ligadas por uma fita, sobre um mar agitado. waite fala de alegria e recreação, mas também de obstáculos, agitação e dificuldade. gere-se mais do que uma coisa ao mesmo tempo, e funciona — enquanto o movimento não parar. a capacidade de manter várias frentes a andar é uma competência genuína e um risco. quem se torna bom nisso raramente é obrigado a escolher, e vai adiando indefinidamente decisões que exigiriam largar alguma coisa. a sombra é o malabarismo como estilo de vida: a agitação constante que dá sensação de capacidade e evita a pergunta sobre o que interessa mesmo. pode representar gestão simultânea de várias exigências. pode trazer temas de adaptação, flexibilidade e instabilidade. pode levantar a questão do que aconteceria se algo tivesse de cair. o que é que eu estou a manter no ar só para não ter de escolher? isto é equilíbrio ou é agitação? a. e. waite; estrutura tradicional dos naipes."}, {"id": "three-of-pentacles", "guia": {"palavras": ["ofício", "competência", "colaboração", "obra", "reconhecimento técnico"], "essencia": "Um artífice a trabalhar numa igreja, com duas figuras a observarem os planos. Waite fala de ofício, trabalho especializado, renome e glória. É a carta da competência reconhecida — o momento em que o que alguém sabe fazer encontra um lugar onde é preciso.", "psicologia_sombra": "Ser bom em alguma coisa organiza a identidade de forma muito eficaz, e por isso mesmo é arriscado. Quando o valor próprio assenta inteiramente na competência, qualquer erro deixa de ser um erro e passa a ser uma ameaça. A sombra desta carta é o ofício como única forma de existir: alguém que só se sente legítimo enquanto produz, e para quem parar é perder-se.", "leitura": ["Pode assinalar trabalho qualificado, colaboração ou reconhecimento.", "Pode trazer temas de aprendizagem aplicada e de contributo próprio.", "Pode levantar a questão do que a pessoa é para lá do que faz."], "pensar": ["Quem sou eu nos dias em que não produzo nada?", "Este trabalho está a construir alguma coisa, ou a provar alguma coisa?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Three of Pentacles", "pt": "Três de Ouros", "arcano": "menor", "num": 3, "naipe": "Ouros", "img": "Pentacles03.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A sculptor at his work in a monastery. Compare the design which illustrates the Eight of Pentacles. The apprentice or amateur therein has received his reward and is now at work in earnest."]}, {"t": "Significados", "f": "Waite", "p": ["Metier, trade, skilled labour; usually, however, regarded as a card of nobility, aristocracy, renown, glory."]}, {"t": "Invertida", "f": "Waite", "p": ["Mediocrity, in work and otherwise, puerility, pettiness, weakness."]}, {"t": "Resumo", "f": "Waite", "p": ["If for a man, celebrity for his eldest son. Reversed. Depends on neighbouring cards."]}], "busca": "three of pentacles três de ouros a sculptor at his work in a monastery. compare the design which illustrates the eight of pentacles. the apprentice or amateur therein has received his reward and is now at work in earnest. metier, trade, skilled labour; usually, however, regarded as a card of nobility, aristocracy, renown, glory. mediocrity, in work and otherwise, puerility, pettiness, weakness. if for a man, celebrity for his eldest son. reversed. depends on neighbouring cards. ofício competência colaboração obra reconhecimento técnico um artífice a trabalhar numa igreja, com duas figuras a observarem os planos. waite fala de ofício, trabalho especializado, renome e glória. é a carta da competência reconhecida — o momento em que o que alguém sabe fazer encontra um lugar onde é preciso. ser bom em alguma coisa organiza a identidade de forma muito eficaz, e por isso mesmo é arriscado. quando o valor próprio assenta inteiramente na competência, qualquer erro deixa de ser um erro e passa a ser uma ameaça. a sombra desta carta é o ofício como única forma de existir: alguém que só se sente legítimo enquanto produz, e para quem parar é perder-se. pode assinalar trabalho qualificado, colaboração ou reconhecimento. pode trazer temas de aprendizagem aplicada e de contributo próprio. pode levantar a questão do que a pessoa é para lá do que faz. quem sou eu nos dias em que não produzo nada? este trabalho está a construir alguma coisa, ou a provar alguma coisa? a. e. waite; estrutura tradicional dos naipes."}, {"id": "four-of-pentacles", "guia": {"palavras": ["retenção", "segurança", "controlo", "medo de perder", "acumulação"], "essencia": "Uma figura que segura uma moeda contra o peito, com uma na cabeça e duas sob os pés. Waite fala da segurança das posses e de agarrar aquilo que se tem. Nada está a ser perdido — e também nada está a circular.", "psicologia_sombra": "A necessidade de segurar tem quase sempre uma história por trás, e é raro que quem segura com força não tenha perdido algo antes. O problema não é a prudência, é o ponto em que ela deixa de responder à realidade actual. A sombra desta carta é o controlo que se estende para além do dinheiro — a pessoas, informação, afectos — e que acaba por tornar precário exactamente aquilo que pretendia proteger.", "leitura": ["Pode representar prudência, poupança ou necessidade de segurança.", "Pode trazer temas de controlo e de dificuldade em soltar.", "Pode levantar a questão do que o aperto está a custar."], "pensar": ["O que é que eu estou a segurar com mais força do que a situação exige?", "Que perda antiga é que isto ainda está a tentar evitar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Four of Pentacles", "pt": "Quatro de Ouros", "arcano": "menor", "num": 4, "naipe": "Ouros", "img": "Pentacles04.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A crowned figure, having a pentacle over his crown, clasps another with hands and arms; two pentacles are under his feet. He holds to that which he has."]}, {"t": "Significados", "f": "Waite", "p": ["The surety of possessions, cleaving to that which one has, gift, legacy, inheritance."]}, {"t": "Invertida", "f": "Waite", "p": ["Suspense, delay, opposition."]}, {"t": "Resumo", "f": "Waite", "p": ["For a bachelor, pleasant news from a lady. Reversed. Observation, hindrances."]}], "busca": "four of pentacles quatro de ouros a crowned figure, having a pentacle over his crown, clasps another with hands and arms; two pentacles are under his feet. he holds to that which he has. the surety of possessions, cleaving to that which one has, gift, legacy, inheritance. suspense, delay, opposition. for a bachelor, pleasant news from a lady. reversed. observation, hindrances. retenção segurança controlo medo de perder acumulação uma figura que segura uma moeda contra o peito, com uma na cabeça e duas sob os pés. waite fala da segurança das posses e de agarrar aquilo que se tem. nada está a ser perdido — e também nada está a circular. a necessidade de segurar tem quase sempre uma história por trás, e é raro que quem segura com força não tenha perdido algo antes. o problema não é a prudência, é o ponto em que ela deixa de responder à realidade actual. a sombra desta carta é o controlo que se estende para além do dinheiro — a pessoas, informação, afectos — e que acaba por tornar precário exactamente aquilo que pretendia proteger. pode representar prudência, poupança ou necessidade de segurança. pode trazer temas de controlo e de dificuldade em soltar. pode levantar a questão do que o aperto está a custar. o que é que eu estou a segurar com mais força do que a situação exige? que perda antiga é que isto ainda está a tentar evitar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "five-of-pentacles", "guia": {"palavras": ["falta", "exclusão", "desamparo", "dificuldade material", "invisibilidade"], "essencia": "Duas figuras na neve passam diante de um vitral iluminado. Waite fala de dificuldade material e destituição, mas também de amor e afinidade. A dureza é real; o pormenor decisivo é a janela iluminada por que passam sem olhar.", "psicologia_sombra": "A privação material vem quase sempre acompanhada de uma segunda experiência, mais silenciosa: a de estar fora, e de deixar de contar com a possibilidade de ajuda. Ao fim de algum tempo, deixa-se de procurar. A sombra desta carta não é a falta — é o orgulho ou a resignação que impedem de bater à porta, e que transformam uma situação difícil numa situação isolada.", "leitura": ["Pode assinalar dificuldade material, exclusão ou sensação de desamparo.", "Pode trazer temas de ajuda existente e não pedida.", "Pode levantar a questão do que impede de pedir."], "pensar": ["Que porta é que eu não estou a ver, ou não estou disposto a bater?", "O que me custaria mais: continuar assim ou pedir?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Five of Pentacles", "pt": "Cinco de Ouros", "arcano": "menor", "num": 5, "naipe": "Ouros", "img": "Pentacles05.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Two mendicants in a snow-storm pass a lighted casement."]}, {"t": "Significados", "f": "Waite", "p": ["The card foretells material trouble above all, whether in the form illustrated— that is, destitution— or otherwise. For some cartomancists, it is a card of love and lovers-wife, husband, friend, mistress; also concordance, affinities. These alternatives cannot be harmonized."]}, {"t": "Invertida", "f": "Waite", "p": ["Disorder, chaos, ruin, discord, profligacy."]}, {"t": "Resumo", "f": "Waite", "p": ["Conquest of fortune by reason. Reversed. Troubles in love."]}], "busca": "five of pentacles cinco de ouros two mendicants in a snow-storm pass a lighted casement. the card foretells material trouble above all, whether in the form illustrated— that is, destitution— or otherwise. for some cartomancists, it is a card of love and lovers-wife, husband, friend, mistress; also concordance, affinities. these alternatives cannot be harmonized. disorder, chaos, ruin, discord, profligacy. conquest of fortune by reason. reversed. troubles in love. falta exclusão desamparo dificuldade material invisibilidade duas figuras na neve passam diante de um vitral iluminado. waite fala de dificuldade material e destituição, mas também de amor e afinidade. a dureza é real; o pormenor decisivo é a janela iluminada por que passam sem olhar. a privação material vem quase sempre acompanhada de uma segunda experiência, mais silenciosa: a de estar fora, e de deixar de contar com a possibilidade de ajuda. ao fim de algum tempo, deixa-se de procurar. a sombra desta carta não é a falta — é o orgulho ou a resignação que impedem de bater à porta, e que transformam uma situação difícil numa situação isolada. pode assinalar dificuldade material, exclusão ou sensação de desamparo. pode trazer temas de ajuda existente e não pedida. pode levantar a questão do que impede de pedir. que porta é que eu não estou a ver, ou não estou disposto a bater? o que me custaria mais: continuar assim ou pedir? a. e. waite; estrutura tradicional dos naipes."}, {"id": "six-of-pentacles", "guia": {"palavras": ["troca", "generosidade", "dar e receber", "desequilíbrio de poder", "balança"], "essencia": "Um mercador pesa moedas numa balança e distribui-as a dois mendigos. Waite fala de presentes, gratificação e atenção. A generosidade é real e a estrutura também: alguém tem a balança na mão e alguém está de joelhos.", "psicologia_sombra": "Dar cria vínculo e cria dívida, e as duas coisas raramente vêm separadas. Quem dá conserva a posição, e a gratidão que recebe consolida-a. A sombra desta carta é a generosidade que precisa da desigualdade para continuar a existir — ajuda que se retira quando o outro deixa de precisar, porque o que estava em jogo não era a necessidade dele.", "leitura": ["Pode representar generosidade, apoio ou uma troca material.", "Pode trazer temas de equilíbrio entre dar e receber.", "Pode levantar a questão de quem segura a balança."], "pensar": ["Nesta relação, quem tem a balança na mão?", "Se o outro deixasse de precisar de mim, o que ficaria?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Six of Pentacles", "pt": "Seis de Ouros", "arcano": "menor", "num": 6, "naipe": "Ouros", "img": "Pentacles06.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A person in the guise of a merchant weighs money in a pair of scales and distributes it to the needy and distressed. It is a testimony to his own success in life, as well as to his goodness of heart."]}, {"t": "Significados", "f": "Waite", "p": ["Presents, gifts, gratification another account says attention, vigilance now is the accepted time, present prosperity, etc."]}, {"t": "Invertida", "f": "Waite", "p": ["Desire, cupidity, envy, jealousy, illusion."]}, {"t": "Resumo", "f": "Waite", "p": ["The present must not be relied on. Reversed. A check on the Querent's ambition."]}],  arranca a planta para ver a raiz — e o seu contrário exacto, a persistência que continua a regar durante anos aquilo que já mostrou que não pega.", "leitura": ["Pode assinalar um momento de avaliação de algo em curso.", "Pode trazer temas de paciência, investimento e retorno.", "Pode levantar a questão de se é altura de esperar ou de mudar."], "pensar": ["Se eu estivesse a começar hoje, voltava a escolher isto?", "Estou a ser paciente ou estou a ser teimoso?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Seven of Pentacles", "pt": "Sete de Ouros", "arcano": "menor", "num": 7, "naipe": "Ouros", "img": "Pentacles07.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A young man, leaning on his staff, looks intently at seven pentacles attached to a clump of greenery on his right; one would say that these were his treasures and that his heart was there."]}, {"t": "Significados", "f": "Waite", "p": ["These are exceedingly contradictory; in the main, it is a card of money, business, barter; but one reading gives altercation, quarrels— and another innocence, ingenuity, purgation."]}, {"t": "Invertida", "f": "Waite", "p": ["Cause for anxiety regarding money which it may be proposed to lend."]}, {"t": "Resumo", "f": "Waite", "p": ["Improved position for a lady's future husband. Reversed. Impatience, apprehension, suspicion."]}], "busca": "seven of pentacles sete de ouros a young man, leaning on his staff, looks intently at seven pentacles attached to a clump of greenery on his right; one would say that these were his treasures and that his heart was there. these are exceedingly contradictory; in the main, it is a card of money, business, barter; but one reading gives altercation, quarrels— and another innocence, ingenuity, purgation. cause for anxiety regarding money which it may be proposed to lend. improved position for a lady's future husband. reversed. impatience, apprehension, suspicion. espera avaliação paciência investimento dúvida uma figura apoiada na enxada, a olhar para o que plantou. waite fala de dinheiro, negócio e permuta, mas também de altercação e de purgação. o trabalho está feito, o crescimento é lento, e instalou-se a dúvida sobre se valeu a pena. avaliar a meio é necessário e traiçoeiro. cedo demais, não há informação suficiente; tarde demais, já se investiu o bastante para não se conseguir julgar com isenção. a sombra é a impaciência que arranca a planta para ver a raiz — e o seu contrário exacto, a persistência que continua a regar durante anos aquilo que já mostrou que não pega. pode assinalar um momento de avaliação de algo em curso. pode trazer temas de paciência, investimento e retorno. pode levantar a questão de se é altura de esperar ou de mudar. se eu estivesse a começar hoje, voltava a escolher isto? estou a ser paciente ou estou a ser teimoso? a. e. waite; estrutura tradicional dos naipes."}, {"id": "eight-of-pentacles", "guia": {"palavras": ["aprendizagem", "ofício", "repetição", "aplicação", "disciplina"], "essencia": "Um artesão a talhar moedas, uma a uma, com as concluídas expostas ao lado. Waite fala de trabalho, emprego, encomenda e perícia. É a carta da repetição — a competência construída por acumulação de horas, sem atalho possível.", "psicologia_sombra": "A repetição é o mecanismo por que quase tudo se aprende e é também um excelente esconderijo. Enquanto se está a treinar, não se está exposto ao julgamento; o trabalho pode ser prolongado indefinidamente em nome do aperfeiçoamento. A sombra desta carta é o refúgio na tarefa: perfeccionismo que adia a entrega, ou a aplicação mecânica que continua muito depois de o sentido se ter perdido.", "leitura": ["Pode assinalar aprendizagem, prática ou trabalho continuado.", "Pode trazer temas de disciplina e de construção lenta.", "Pode levantar a questão de se a repetição ainda ensina."], "pensar": ["Isto ainda me está a ensinar alguma coisa?", "Estou a aperfeiçoar, ou a adiar mostrar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Eight of Pentacles", "pt": "Oito de Ouros", "arcano": "menor", "num": 8, "naipe": "Ouros", "img": "Pentacles08.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["An artist in stone at his work, which he exhibits in the form of trophies."]}, {"t": "Significados", "f": "Waite", "p": ["Work, employment, commission, craftsmanship, skill in craft and business, perhaps in the preparatory stage."]}, {"t": "Invertida", "f": "Waite", "p": ["Voided ambition, vanity, cupidity, exaction, usury. It may also signify the possession of skill, in the sense of the ingenious mind turned to cunning and intrigue."]}, {"t": "Resumo", "f": "Waite", "p": ["A young man in business who has relations with the Querent; a dark girl. Reversed. The Querent will be compromised in a matter of money-lending."]}], "busca": "eight of pentacles oito de ouros an artist in stone at his work, which he exhibits in the form of trophies. work, employment, commission, craftsmanship, skill in craft and business, perhaps in the preparatory stage. voided ambition, vanity, cupidity, exaction, usury. it may also signify the possession of skill, in the sense of the ingenious mind turned to cunning and intrigue. a young man in business who has relations with the querent; a dark girl. reversed. the querent will be compromised in a matter of money-lending. aprendizagem ofício repetição aplicação disciplina um artesão a talhar moedas, uma a uma, com as concluídas expostas ao lado. waite fala de trabalho, emprego, encomenda e perícia. é a carta da repetição — a competência construída por acumulação de horas, sem atalho possível. a repetição é o mecanismo por que quase tudo se aprende e é também um excelente esconderijo. enquanto se está a treinar, não se está exposto ao julgamento; o trabalho pode ser prolongado indefinidamente em nome do aperfeiçoamento. a sombra desta carta é o refúgio na tarefa: perfeccionismo que adia a entrega, ou a aplicação mecânica que continua muito depois de o sentido se ter perdido. pode assinalar aprendizagem, prática ou trabalho continuado. pode trazer temas de disciplina e de construção lenta. pode levantar a questão de se a repetição ainda ensina. isto ainda me está a ensinar alguma coisa? estou a aperfeiçoar, ou a adiar mostrar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "nine-of-pentacles", "guia": {"palavras": ["autonomia", "conforto conquistado", "independência", "refinamento", "solidão"], "essencia": "Uma figura sozinha num jardim, com uma ave na mão. Waite fala de prudência, segurança, êxito e discernimento. O que se tem foi construído e é próprio — e a carta mostra-o num contexto de solidão que não é apresentado como falta, mas está lá.", "psicologia_sombra": "A independência conquistada é uma posição sólida e uma que se defende com unhas e dentes, sobretudo por quem já dependeu e não gostou. A autossuficiência protege da vulnerabilidade e, com o tempo, também da companhia. A sombra desta carta é a autonomia que se tornou incapacidade de precisar de alguém — quando aceitar ajuda passa a parecer uma ameaça a tudo o que se construiu.", "leitura": ["Pode representar independência, conforto próprio ou êxito pessoal.", "Pode trazer temas de autossuficiência e do seu preço.", "Pode levantar a questão do lugar dos outros no que foi construído."], "pensar": ["A minha independência ainda é liberdade, ou já é defesa?", "Quando foi a última vez que deixei alguém ajudar-me?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Nine of Pentacles", "pt": "Nove de Ouros", "arcano": "menor", "num": 9, "naipe": "Ouros", "img": "Pentacles09.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A woman, with a bird upon her wrist, stands amidst a great abundance of grapevines in the garden of a manorial house. It is a wide domain, suggesting plenty in all things. Possibly it is her own possession and testifies to material well-being."]}, {"t": "Significados", "f": "Waite", "p": ["Prudence, safety, success, accomplishment, certitude, discernment."]}, {"t": "Invertida", "f": "Waite", "p": ["Roguery, deception, voided project, bad faith."]}, {"t": "Resumo", "f": "Waite", "p": ["Prompt fulfilment of what is presaged by neighbouring cards. Reversed.N ain hopes."]}], "busca": "nine of pentacles nove de ouros a woman, with a bird upon her wrist, stands amidst a great abundance of grapevines in the garden of a manorial house. it is a wide domain, suggesting plenty in all things. possibly it is her own possession and testifies to material well-being. prudence, safety, success, accomplishment, certitude, discernment. roguery, deception, voided project, bad faith. prompt fulfilment of what is presaged by neighbouring cards. reversed.n ain hopes. autonomia conforto conquistado independência refinamento solidão uma figura sozinha num jardim, com uma ave na mão. waite fala de prudência, segurança, êxito e discernimento. o que se tem foi construído e é próprio — e a carta mostra-o num contexto de solidão que não é apresentado como falta, mas está lá. a independência conquistada é uma posição sólida e uma que se defende com unhas e dentes, sobretudo por quem já dependeu e não gostou. a autossuficiência protege da vulnerabilidade e, com o tempo, também da companhia. a sombra desta carta é a autonomia que se tornou incapacidade de precisar de alguém — quando aceitar ajuda passa a parecer uma ameaça a tudo o que se construiu. pode representar independência, conforto próprio ou êxito pessoal. pode trazer temas de autossuficiência e do seu preço. pode levantar a questão do lugar dos outros no que foi construído. a minha independência ainda é liberdade, ou já é defesa? quando foi a última vez que deixei alguém ajudar-me? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ten-of-pentacles", "guia": {"palavras": ["património", "família", "legado", "estabilidade", "continuidade"], "essencia": "Três gerações sob um arco, com <script>
const CARTAS = JSON.parse(document.getElementById('dados').textContent);
const app = document.getElementById('app');
const busca = document.getElementById('busca');
const FILTROS = ['Tudo', 'Maiores', 'Paus', 'Copas', 'Espadas', 'Ouros'];
let filtro = 'Tudo';

const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function realcar(txt, termo) {
  const e = esc(txt);
  if (!termo) return e;
  return e.replace(new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
                   '<mark>$1</mark>');
}

document.getElementById('filtros').innerHTML = FILTROS.map(f =>
  `<button data-f="${f}" aria-pressed="${f === filtro}">${f}</button>`).join('');
document.getElementById('filtros').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('#filtros button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.f === filtro));
  if (!location.hash.startsWith('#/c/')) render();
};

function correspondem() {
  const t = busca.value.trim().toLowerCase();
  return CARTAS.filter(c => {
    const okF = filtro === 'Tudo' || (filtro === 'Maiores' && c.arcano === 'maior')
                || c.naipe === filtro;
    return okF && (!t || c.busca.includes(t));
  });
}

function grelha() {
  const lista = correspondem();
  if (!lista.length) { app.innerHTML = '<p class="vazio">Nada encontrado.</p>'; return; }
  let html = '<div class="grelha">', grupo = null;
  for (const c of lista) {
    const g = c.arcano === 'maior' ? 'Arcanos Maiores' : c.naipe;
    if (g !== grupo) { grupo = g; html += `<h2 class="secao-titulo">${g}</h2>`; }
    html += `<a class="carta" href="#/c/${c.id}">
      <img src="cards-png/${c.img}" alt="${esc(c.pt)}" loading="lazy">
      <b>${esc(c.pt)}</b><span>${esc(c.nome)}</span></a>`;
  }
  app.innerHTML = html + '</div>';
}

function lista(arr, termo, cls) {
  return `<ul class="${cls || ''}">` +
         arr.map(x => `<li>${realcar(x, termo)}</li>`).join('') + '</ul>';
}

function guiaHTML(c, termo) {
  const g = c.guia || {};
  if (!g.essencia && !g.palavras) return '';
  let h = '';
  if (g.palavras && g.palavras.length)
    h += `<div class="chips">` + g.palavras.map(p =>
      `<button data-termo="${esc(p)}">${esc(p)}</button>`).join('') + `</div>`;
  h += '<div class="guia">';
  const bloco = (titulo, corpo) => corpo
    ? `<section class="bloco"><h3>${titulo}</h3>${corpo}</section>` : '';
  h += bloco('Essência', g.essencia ? `<p>${realcar(g.essencia, termo)}</p>` : '');
  h += bloco('Simbolismo', g.simbolismo ? lista(g.simbolismo, termo) : '');
  h += bloco('Psicologia', g.psicologia ? `<p>${realcar(g.psicologia, termo)}</p>` : '');
  h += bloco('Psicologia e sombra',
             g.psicologia_sombra ? `<p>${realcar(g.psicologia_sombra, termo)}</p>` : '');
  h += bloco('Sombra', g.sombra ? lista(g.sombra, termo) : '');
  h += bloco('Na leitura', g.leitura ? lista(g.leitura, termo) : '');
  h += bloco('Para pensar', g.pensar ? lista(g.pensar, termo, 'pensar') : '');
  if (g.nota) h += `<p class="fontes-linha">${esc(g.nota)}</p>`;
  if (g.fontes) h += `<p class="fontes-linha">${esc(g.fontes)}</p>`;
  return h + '</div>';
}

function ficha(id) {
  const i = CARTAS.findIndex(c => c.id === id);
  if (i < 0) return grelha();
  const c = CARTAS[i];
  const ant = CARTAS[(i - 1 + CARTAS.length) % CARTAS.length];
  const seg = CARTAS[(i + 1) % CARTAS.length];
  const termo = busca.value.trim();
  const meta = c.arcano === 'maior'
    ? `Arcano Maior · ${c.num}` : `${c.naipe} · Arcano Menor`;

  app.innerHTML = `<div class="ficha">
    <div><img src="cards-png/${c.img}" alt="${esc(c.pt)}"></div>
    <div>
      <h2>${esc(c.pt)}</h2>
      <p class="en">${esc(c.nome)}</p>
      <p class="meta">${meta}</p>
      ${guiaHTML(c, termo)}
      ${c.secoes.length ? `<details class="originais"${c.guia.essencia ? '' : ' open'}>
        <summary>Fontes originais (${c.secoes.length})</summary>
        ${c.secoes.map(s => `<section class="bloco">
          <h3>${esc(s.t)}</h3><p class="fonte">${esc(s.f)}</p>
          ${s.p.map(p => `<p>${realcar(p, termo)}</p>`).join('')}
        </section>`).join('')}</details>` : ''}
      <nav class="nav">
        <a href="#/c/${ant.id}">← ${esc(ant.pt)}</a>
        <a href="#">Índice</a>
        <a href="#/c/${seg.id}">${esc(seg.pt)} →</a>
      </nav>
    </div></div>`;
  scrollTo(0, 0);
}

function render() {
  const m = location.hash.match(/^#\/c\/(.+)$/);
  m ? ficha(m[1]) : grelha();
}

busca.oninput = () => { if (location.hash.startsWith('#/c/')) location.hash = ''; else grelha(); };
app.addEventListener('click', e => {
  const b = e.target.closest('.chips button'); if (!b) return;
  busca.value = b.dataset.termo; filtro = 'Tudo';
  document.querySelectorAll('#filtros button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.f === 'Tudo'));
  location.hash = ''; grelha();
});
addEventListener('hashchange', render);
addEventListener('keydown', e => {
  if (document.activeElement === busca) { if (e.key === 'Escape') busca.blur(); return; }
  if (e.key === '/') { e.preventDefault(); busca.focus(); return; }
  const m = location.hash.match(/^#\/c\/(.+)$/); if (!m) return;
  const i = CARTAS.findIndex(c => c.id === m[1]);
  if (e.key === 'ArrowLeft') location.hash = '#/c/' + CARTAS[(i - 1 + CARTAS.length) % CARTAS.length].id;
  if (e.key === 'ArrowRight') location.hash = '#/c/' + CARTAS[(i + 1) % CARTAS.length].id;
  if (e.key === 'Escape') location.hash = '';
});
render();
</script>
