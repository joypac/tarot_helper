 by the glorious sun of earth, to the light of the world to come, which goes before aspiration and is typified by the heart of a child. But the last allusion is again the key to a different form or aspect of the symbolism. The sun is that of consciousness in the spirit - the direct as the antithesis of the reflected light. The characteristic type of humanity has become a little child therein— a child in the sense of simplicity and innocence in the sense of wisdom. In that simplicity, he bears the seal of Nature and of Art; in that innocence, he signifies the restored world. When the self-knowing spirit has dawned in the consciousness above the natural mind, that mind in its renewal leads forth the animal nature in a state of perfect conformity."]}, {"t": "Resumo", "f": "Waite", "p": ["Material happiness, fortunate marriage, contentment. Reversed: The same in a lesser sense."]}], "busca": "the sun o sol the naked child mounted on a white horse and displaying a red standard has been mentioned already as the better symbolism connected with this card. it is the destiny of the supernatural east and the great and holy light which goes before the endless procession of humanity, coming out from the walled garden of the sensitive life and passing on the journey home. the card signifies, therefore, the transit from the manifest light of this world, represented by the glorious sun of earth, to the light of the world to come, which goes before aspiration and is typified by the heart of a child. but the last allusion is again the key to a different form or aspect of the symbolism. the sun is that of consciousness in the spirit - the direct as the antithesis of the reflected light. the characteristic type of humanity has become a little child therein— a child in the sense of simplicity and innocence in the sense of wisdom. in that simplicity, he bears the seal of nature and of art; in that innocence, he signifies the restored world. when the self-knowing spirit has dawned in the consciousness above the natural mind, that mind in its renewal leads forth the animal nature in a state of perfect conformity. material happiness, fortunate marriage, contentment. reversed: the same in a lesser sense. alegria vitalidade clareza autenticidade simplicidade celebração uma criança nua, montada num cavalo branco, avança sob um sol radiante numa auréola de girassóis. waite descreve-a como \"a transição da luz manifesta deste mundo... para a luz do mundo que há-de vir, tipificada pelo coração de uma criança\" — não regresso à infância literal, mas recuperação de uma simplicidade que waite chama \"inocência no sentido da sabedoria\". a nudez da criança, depois da nudez vulnerável da estrela e da opacidade da lua, marca agora simplicidade sem nada a esconder nem a temer. o cavalo branco, sem sela nem rédeas, sugere vitalidade conduzida sem necessidade de controlo forçado. os girassóis voltados para o sol simbolizam crescimento orientado naturalmente para aquilo que nutre. o estandarte vermelho na mão da criança (waite-smith) sugere que esta alegria não é passiva, mas activamente afirmada. nichols cita longamente o ensaio de jung sobre o arquétipo da criança, ligando-o à necessidade — defendida também por von franz — de \"perder tempo\" para desenvolver aquilo que em nós ficou menos exercitado. é a primeira carta em que os opostos masculino e feminino, presentes desde o início do baralho, interagem directamente em corpos humanos, sem figura mediadora. louis avisa, contudo, que esta \"consciência solar\" tem uma sombra específica: o complexo do puer aeternus de jung — viver de forma provisória, sempre a adiar compromisso e responsabilidade em nome de uma leveza que se recusa a crescer. a busca de alegria pode tornar-se positividade forçada — negar dificuldades reais em nome de parecer bem. a simplicidade pode deslizar para evitamento de responsabilidade, recusando o peso que a vida adulta exige. a vitalidade pode confundir-se com impulsividade sem consideração pelas consequências. sombra dourada: equilibrar felicidade e sucesso interiores com a aceitação do fracasso e da dificuldade, sem perder autenticidade. pode assinalar um período de clareza e vitalidade genuínas, depois de uma fase mais confusa. pode convidar a examinar se uma certa positividade é autêntica ou uma máscara sobre algo mais difícil. pode apontar para a recuperação de uma simplicidade ou espontaneidade perdidas. esta alegria que sinto ou procuro, é real, ou é uma forma de não olhar para algo mais difícil? o que faria hoje se não tivesse medo de parecer demasiado simples, demasiado feliz, ou demasiado sério? a. e. waite; sallie nichols; mariana louis."}, {"id": "the-last-judgment", "guia": {"palavras": ["renascimento", "chamada", "avaliação", "redenção", "despertar", "responsabilidade"], "essencia": "Um anjo toca uma trombeta sobre figuras que se erguem de túmulos abertos, braços erguidos em êxtase. Waite chama-lhe simbolismo \"essencialmente invariável\" em todos os baralhos, e pergunta directamente: \"o que é isto, dentro de nós, que faz soar uma trombeta, e tudo o que é inferior na nossa natureza se ergue em resposta — quase num momento, quase num piscar de olhos?\" Chama-lhe, por isso, \"uma carta de vida eterna\", próxima em significado da Temperança.", "simbolismo": ["O anjo com a bandeira da cruz, tocando a trombeta, ecoa directamente a iconografia cristã da ressurreição — mas Waite insiste que a leitura literal é só a mais superficial disponível.", "As figuras a erguerem-se de túmulos, de costas voltadas para o observador ou em êxtase, sugerem uma resposta involuntária a uma chamada, não um acto de vontade.", "As montanhas nevadas ao fundo (Waite-Smith) sugerem o fim de um período de estagnação ou \"inverno\" pessoal.", "Em Crowley, a carta chama-se \"O Éon\" e liga-se à passagem entre eras simbólicas — mudança de escala colectiva, não apenas individual."], "psicologia": "Nichols constrói aqui um extenso caso autobiográfico: o seu próprio esgotamento como conferencista, e a resolução que encontrou ao validar, finalmente, aquilo que já sentia ser verdade sobre si mesma. Introduz a ideia de que a redenção traz nova responsabilidade, não apenas alívio: a palavra alemã erlösen significa \"libertar de uma fixação\", não \"liberdade de todas as preocupações\". Louis restaura deliberadamente a imagética tradicional do \"Dia do Juízo\" contra a suavização contemporânea, citando Edinger: \"é o nosso ego que está a ser julgado, e é o Self quem é o juiz.\"", "sombra": ["O medo de errar pode tornar-se paralisante, impedindo qualquer resposta a uma chamada genuína.", "A procura de validação externa pode substituir a confiança na própria avaliação.", "A culpa pode ser usada para se punir indefinidamente em vez de reparar e seguir em frente.", "Sombra dourada: tratar os erros como aprendizagem, valorizando a responsabilização e a reparação mais do que a perfeição."], "leitura": ["Pode assinalar o momento de responder a uma chamada, interna ou externa, há muito adiada.", "Pode convidar a rever, com honestidade, uma fase da vida antes de a deixar definitivamente para trás.", "Pode apontar para uma validação — de si mesmo ou de outros — que estava a ser procurada no lugar errado."], "pensar": ["Que chamada tenho vindo a adiar responder, mesmo já a ouvindo com clareza?", "Estou a avaliar-me com os meus próprios critérios, ou apenas com os de quem espero que me valide?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis."}, "nome": "The Last Judgment", "pt": "O Julgamento", "arcano": "maior", "num": 20, "naipe": null, "img": "20-Judgement.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["I have said that this symbol is essentially invariable in all Tarot sets, or at least the variations do not alter its character. The great angel is here encompassed by clouds, but he blows his bannered trumpet, and the cross as usual is displayed on the banner. The dead are rising from their tombs— a woman on the right, a man on the left hand, and between them their child, whose back is turned. But in this card there are more than three who are restored, and it has been thought worth while to make this variation as illustrating the insufficiency of current explanations. It should be noted that all the figures are as one in the wonder, adoration and ecstacy expressed by their attitudes. It is the card which registers the accomplishment of the great work of transformation in answer to the summons of the Supernal— which summons is heard and answered from within. Herein is the intimation of a significance which cannot well be carried further in the present place. What is that within us which does sound a trumpet and all that is lower in our nature rises in response— almost in a moment, almost in the twinkling of an eye? Let the card continue to depict, for those who can see no further, the Last judgment and the resurrection in the natural body; but let those who have inward eyes look and discover therewith. They will understand that it has been called truly in the past a card of eternal life, and for this reason it may be compared with that which passes under the name of Temperance."]}, {"t": "Resumo", "f": "Waite", "p": ["Change of position, renewal, outcome. Another account specifies total loss though lawsuit. Reversed: Weakness, pusillanimity, simplicity; also deliberation, decision, sentence."]}], "busca": "the last judgment o julgamento i have said that this symbol is essentially invariable in all tarot sets, or at least the variations do not alter its character. the great angel is here encompassed by clouds, but he blows his bannered trumpet, and the cross as usual is displayed on the banner. the dead are rising from their tombs— a woman on the right, a man on the left hand, and between them their child, whose back is turned. but in this card there are more than three who are restored, and it has been thought worth while to make this variation as illustrating the insufficiency of current explanations. it should be noted that all the figures are as one in the wonder, adoration and ecstacy expressed by their attitudes. it is the card which registers the accomplishment of the great work of transformation in answer to the summons of the supernal— which summons is heard and answered from within. herein is the intimation of a significance which cannot well be carried further in the present place. what is that within us which does sound a trumpet and all that is lower in our nature rises in response— almost in a moment, almost in the twinkling of an eye? let the card continue to depict, for those who can see no further, the last judgment and the resurrection in the natural body; but let those who have inward eyes look and discover therewith. they will understand that it has been called truly in the past a card of eternal life, and for this reason it may be compared with that which passes under the name of temperance. change of position, renewal, outcome. another account specifies total loss though lawsuit. reversed: weakness, pusillanimity, simplicity; also deliberation, decision, sentence. renascimento chamada avaliação redenção despertar responsabilidade um anjo toca uma trombeta sobre figuras que se erguem de túmulos abertos, braços erguidos em êxtase. waite chama-lhe simbolismo \"essencialmente invariável\" em todos os baralhos, e pergunta directamente: \"o que é isto, dentro de nós, que faz soar uma trombeta, e tudo o que é inferior na nossa natureza se ergue em resposta — quase num momento, quase num piscar de olhos?\" chama-lhe, por isso, \"uma carta de vida eterna\", próxima em significado da temperança. o anjo com a bandeira da cruz, tocando a trombeta, ecoa directamente a iconografia cristã da ressurreição — mas waite insiste que a leitura literal é só a mais superficial disponível. as figuras a erguerem-se de túmulos, de costas voltadas para o observador ou em êxtase, sugerem uma resposta involuntária a uma chamada, não um acto de vontade. as montanhas nevadas ao fundo (waite-smith) sugerem o fim de um período de estagnação ou \"inverno\" pessoal. em crowley, a carta chama-se \"o éon\" e liga-se à passagem entre eras simbólicas — mudança de escala colectiva, não apenas individual. nichols constrói aqui um extenso caso autobiográfico: o seu próprio esgotamento como conferencista, e a resolução que encontrou ao validar, finalmente, aquilo que já sentia ser verdade sobre si mesma. introduz a ideia de que a redenção traz nova responsabilidade, não apenas alívio: a palavra alemã erlösen significa \"libertar de uma fixação\", não \"liberdade de todas as preocupações\". louis restaura deliberadamente a imagética tradicional do \"dia do juízo\" contra a suavização contemporânea, citando edinger: \"é o nosso ego que está a ser julgado, e é o self quem é o juiz.\" o medo de errar pode tornar-se paralisante, impedindo qualquer resposta a uma chamada genuína. a procura de validação externa pode substituir a confiança na própria avaliação. a culpa pode ser usada para se punir indefinidamente em vez de reparar e seguir em frente. sombra dourada: tratar os erros como aprendizagem, valorizando a responsabilização e a reparação mais do que a perfeição. pode assinalar o momento de responder a uma chamada, interna ou externa, há muito adiada. pode convidar a rever, com honestidade, uma fase da vida antes de a deixar definitivamente para trás. pode apontar para uma validação — de si mesmo ou de outros — que estava a ser procurada no lugar errado. que chamada tenho vindo a adiar responder, mesmo já a ouvindo com clareza? estou a avaliar-me com os meus próprios critérios, ou apenas com os de quem espero que me valide? a. e. waite; aleister crowley; sallie nichols; mariana louis."}, {"id": "the-world", "guia": {"palavras": ["plenitude", "integração", "conclusão", "realização", "totalidade", "celebração"], "essencia": "Uma figura dançante, envolta apenas por um tecido solto, move-se dentro de uma coroa elíptica de louros, ladeada por quatro criaturas — touro, leão, águia e anjo. Waite descreve-a como \"a perfeição e o fim do Cosmos... o êxtase do universo quando se compreende a si mesmo em Deus\" — mas insiste também que é, ao mesmo tempo, \"uma história do passado\": o instante em que tudo foi declarado bom.", "simbolismo": ["As quatro criaturas nos cantos (associadas aos quatro evangelistas, aos quatro elementos, às quatro funções psicológicas) mostram opostos finalmente harmonizados, não anulados.", "A coroa elíptica de louros, sem princípio nem fim visível, sugere um ciclo completo mais do que uma linha que termina.", "A figura dançante, nem claramente masculina nem feminina, incorpora a síntese de opostos que todo o baralho, desde o Mago e a Sacerdotisa, veio a preparar.", "Em Crowley, a carta chama-se \"O Universo\" e é lida como contraponto exacto do Louco: \"o Louco é o negativo a emergir em manifestação; o Universo é essa manifestação, o seu propósito cumprido, pronta a regressar.\""], "psicologia": "Nichols cita Jung longamente sobre a experiência do Self: \"sabe-se que nunca se pode ser outra coisa senão si mesmo... o self é indestrutível\" — mas insiste, com o próprio Jung, que o Mundo não é ponto de chegada definitivo: \"a redenção completa dos sofrimentos deste mundo é e deve permanecer uma ilusão.\" Louis cita Aniela Jaffé no mesmo sentido: a plenitude \"nunca é plenamente alcançada... apenas uma realização óptima\". A carta representa menos um destino fixo do que a experiência, sempre temporária, de sentir tudo momentaneamente no seu lugar.", "sombra": ["A busca de plenitude pode tornar-se uma meta inatingível, gerando a sensação crónica de \"nunca é suficiente\".", "A celebração de uma conquista pode ser adiada indefinidamente à espera do próximo objectivo.", "A integração pode ser confundida com perfeição, em vez de aceitação de partes ainda em tensão.", "Sombra dourada: procurar a integração de todas as partes complexas e dinâmicas de si, contente com a própria jornada, não apenas com o destino."], "leitura": ["Pode assinalar a conclusão genuína de um ciclo — um projecto, uma fase, uma aprendizagem.", "Pode convidar a reconhecer e celebrar algo já alcançado, em vez de passar directamente ao objectivo seguinte.", "Pode apontar para uma sensação de plenitude que, precisamente por ser rara, vale a pena habitar sem pressa."], "pensar": ["O que já completei e ainda não me permiti reconhecer como completo?", "Consigo sentir-me inteiro agora, ou espero sempre por mais uma peça antes de o permitir?"], "fontes": "A. E. Waite; Aleister Crowley; C. G. Jung; Sallie Nichols; Mariana Louis."}, "nome": "The World", "pt": "O Mundo", "arcano": "maior", "num": 21, "naipe": null, "img": "21-TheWorld.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["As this final message of the Major Trumps is unchanged— and indeed unchangeable— in respect of its design, it has been partly described already regarding its deeper sense. It represents also the perfection and end of the Cosmos, the secret which is within it, the rapture of the universe when it understands itself in God. It is further the state of the soul in the consciousness of Divine Vision, reflected from the self-knowing spirit. But these meanings are without prejudice to that which I have said concerning it on the material side. It has more than one message on the macrocosmic side and is, for example, the state of the restored world when the law of manifestation shall have been carried to the highest degree of natural perfection. But it is perhaps more especially a story of the past, referring to that day when all was declared to be good, when the morning stars sang together and all the Sons of God shouted for joy. One of the worst explanations concerning it is that the figure symbolizes the Magus when he has reached the highest degree of initiation; another account says that it represents the absolute, which is ridiculous. The figure has been said to stand for Truth, which is, however, more properly allocated to the seventeenth card. Lastly, it has been called the Crown of the Magi.", "2.3 Conclusion as to the Greater Keys"]}, {"t": "Resumo", "f": "Waite", "p": ["Assured success, recompense, voyage, route, emigration, flight, change of place. Reversed: Inertia, fixity, stagnation, permanence. It will be seen that, except where there is an irresistible suggestion conveyed by the surface meaning, that which is extracted from the Trumps Major by the divinatory art is at once artificial and arbitrary, as it seems to me, in the highest degree. But of one order are the mysteries of light and of another are those of fantasy. The allocation of a fortune-telling aspect to these cards is the story of a prolonged impertinence. 3.4 Some Additional Meanings of the Lesser Arcana"]}], "busca": "the world o mundo as this final message of the major trumps is unchanged— and indeed unchangeable— in respect of its design, it has been partly described already regarding its deeper sense. it represents also the perfection and end of the cosmos, the secret which is within it, the rapture of the universe when it understands itself in god. it is further the state of the soul in the consciousness of divine vision, reflected from the self-knowing spirit. but these meanings are without prejudice to that which i have said concerning it on the material side. it has more than one message on the macrocosmic side and is, for example, the state of the restored world when the law of manifestation shall have been carried to the highest degree of natural perfection. but it is perhaps more especially a story of the past, referring to that day when all was declared to be good, when the morning stars sang together and all the sons of god shouted for joy. one of the worst explanations concerning it is that the figure symbolizes the magus when he has reached the highest degree of initiation; another account says that it represents the absolute, which is ridiculous. the figure has been said to stand for truth, which is, however, more properly allocated to the seventeenth card. lastly, it has been called the crown of the magi. 2.3 conclusion as to the greater keys assured success, recompense, voyage, route, emigration, flight, change of place. reversed: inertia, fixity, stagnation, permanence. it will be seen that, except where there is an irresistible suggestion conveyed by the surface meaning, that which is extracted from the trumps major by the divinatory art is at once artificial and arbitrary, as it seems to me, in the highest degree. but of one order are the mysteries of light and of another are those of fantasy. the allocation of a fortune-telling aspect to these cards is the story of a prolonged impertinence. 3.4 some additional meanings of the lesser arcana plenitude integração conclusão realização totalidade celebração uma figura dançante, envolta apenas por um tecido solto, move-se dentro de uma coroa elíptica de louros, ladeada por quatro criaturas — touro, leão, águia e anjo. waite descreve-a como \"a perfeição e o fim do cosmos... o êxtase do universo quando se compreende a si mesmo em deus\" — mas insiste também que é, ao mesmo tempo, \"uma história do passado\": o instante em que tudo foi declarado bom. as quatro criaturas nos cantos (associadas aos quatro evangelistas, aos quatro elementos, às quatro funções psicológicas) mostram opostos finalmente harmonizados, não anulados. a coroa elíptica de louros, sem princípio nem fim visível, sugere um ciclo completo mais do que uma linha que termina. a figura dançante, nem claramente masculina nem feminina, incorpora a síntese de opostos que todo o baralho, desde o mago e a sacerdotisa, veio a preparar. em crowley, a carta chama-se \"o universo\" e é lida como contraponto exacto do louco: \"o louco é o negativo a emergir em manifestação; o universo é essa manifestação, o seu propósito cumprido, pronta a regressar.\" nichols cita jung longamente sobre a experiência do self: \"sabe-se que nunca se pode ser outra coisa senão si mesmo... o self é indestrutível\" — mas insiste, com o próprio jung, que o mundo não é ponto de chegada definitivo: \"a redenção completa dos sofrimentos deste mundo é e deve permanecer uma ilusão.\" louis cita aniela jaffé no mesmo sentido: a plenitude \"nunca é plenamente alcançada... apenas uma realização óptima\". a carta representa menos um destino fixo do que a experiência, sempre temporária, de sentir tudo momentaneamente no seu lugar. a busca de plenitude pode tornar-se uma meta inatingível, gerando a sensação crónica de \"nunca é suficiente\". a celebração de uma conquista pode ser adiada indefinidamente à espera do próximo objectivo. a integração pode ser confundida com perfeição, em vez de aceitação de partes ainda em tensão. sombra dourada: procurar a integração de todas as partes complexas e dinâmicas de si, contente com a própria jornada, não apenas com o destino. pode assinalar a conclusão genuína de um ciclo — um projecto, uma fase, uma aprendizagem. pode convidar a reconhecer e celebrar algo já alcançado, em vez de passar directamente ao objectivo seguinte. pode apontar para uma sensação de plenitude que, precisamente por ser rara, vale a pena habitar sem pressa. o que já completei e ainda não me permiti reconhecer como completo? consigo sentir-me inteiro agora, ou espero sempre por mais uma peça antes de o permitir? a. e. waite; aleister crowley; c. g. jung; sallie nichols; mariana louis."}, {"id": "ace-of-wands", "guia": {"palavras": ["início", "impulso", "energia", "iniciativa", "potencial", "ímpeto"], "essencia": "O primeiro movimento do fogo: vontade antes de ter forma ou plano. Waite associa-o a criação, invenção e princípio de empreendimento. É a carta do arranque — não do que já está feito, mas da energia disponível para começar. O que virá depois depende inteiramente do que se fizer com ela.", "psicologia_sombra": "O impulso inicial é fácil de confundir com decisão. Sentir vontade não é ainda ter escolhido, e há quem viva permanentemente nesta carta: muitos começos, poucos seguimentos. A sombra não é a falta de energia, é a energia que nunca chega a encontrar forma — entusiasmo que se gasta a si próprio e deixa a pessoa convencida de que fez alguma coisa.", "leitura": ["Pode assinalar energia disponível para algo que ainda não tem contorno definido.", "Pode levantar a diferença entre querer começar e estar disposto a continuar.", "Pode apontar para um impulso genuíno que ainda não foi testado contra a realidade."], "pensar": ["Que quantidade desta vontade sobreviveria à primeira dificuldade?", "Estou a começar algo, ou a repetir a sensação de começar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ace of Wands", "pt": "Ás de Paus", "arcano": "menor", "num": 1, "naipe": "Paus", "img": "Wands01.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A hand issuing from a cloud grasps a stout wand or club."]}, {"t": "Significados", "f": "Waite", "p": ["Creation, invention, enterprise, the powers which result in these; principle, beginning, source; birth, family, origin, and in a sense the virility which is behind them; the starting point of enterprises; according to another account, money, fortune, inheritance."]}, {"t": "Invertida", "f": "Waite", "p": ["Fall, decadence, ruin, perdition, to perish also a certain clouded joy."]}, {"t": "Resumo", "f": "Waite", "p": ["Inflexible will, unalterable law. Reversed: Unexpected change of position."]}], "busca": "ace of wands ás de paus a hand issuing from a cloud grasps a stout wand or club. creation, invention, enterprise, the powers which result in these; principle, beginning, source; birth, family, origin, and in a sense the virility which is behind them; the starting point of enterprises; according to another account, money, fortune, inheritance. fall, decadence, ruin, perdition, to perish also a certain clouded joy. inflexible will, unalterable law. reversed: unexpected change of position. início impulso energia iniciativa potencial ímpeto o primeiro movimento do fogo: vontade antes de ter forma ou plano. waite associa-o a criação, invenção e princípio de empreendimento. é a carta do arranque — não do que já está feito, mas da energia disponível para começar. o que virá depois depende inteiramente do que se fizer com ela. o impulso inicial é fácil de confundir com decisão. sentir vontade não é ainda ter escolhido, e há quem viva permanentemente nesta carta: muitos começos, poucos seguimentos. a sombra não é a falta de energia, é a energia que nunca chega a encontrar forma — entusiasmo que se gasta a si próprio e deixa a pessoa convencida de que fez alguma coisa. pode assinalar energia disponível para algo que ainda não tem contorno definido. pode levantar a diferença entre querer começar e estar disposto a continuar. pode apontar para um impulso genuíno que ainda não foi testado contra a realidade. que quantidade desta vontade sobreviveria à primeira dificuldade? estou a começar algo, ou a repetir a sensação de começar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "two-of-wands", "guia": {"palavras": ["escolha de rumo", "domínio inicial", "inquietação", "planeamento", "horizonte"], "essencia": "Alguém que já conquistou algo e olha para lá dele. Waite fala de riqueza e magnificência, mas também da tristeza de quem possui o mundo — uma tensão que define a carta. O que se tem deixou de bastar. É o momento entre ter e querer outra coisa, com a escolha ainda por fazer.", "psicologia_sombra": "A insatisfação com o que já se alcançou pode ser lucidez ou pode ser um padrão. Há quem só consiga desejar aquilo que ainda não tem, e para quem qualquer conquista se desvaloriza no momento em que se concretiza. A sombra desta carta é a inquietação como hábito: um horizonte que se afasta sempre à mesma velocidade a que se avança.", "leitura": ["Pode representar o momento de decidir uma direção, com o conforto já garantido.", "Pode trazer a questão do que se perde ao escolher um caminho.", "Pode apontar para insatisfação com algo que, visto de fora, funciona."], "pensar": ["O que é que já tenho e não estou a conseguir ver como suficiente?", "Este desejo de mais vem de onde — de curiosidade ou de incapacidade de parar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Two of Wands", "pt": "Dois de Paus", "arcano": "menor", "num": 2, "naipe": "Paus", "img": "Wands02.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A tall man looks from a battlemented roof over sea and shore; he holds a globe in his right hand, while a staff in his left rests on the battlement; another is fixed in a ring. The Rose and Cross and Lily should be noticed on the left side."]}, {"t": "Significados", "f": "Waite", "p": ["Between the alternative readings there is no marriage possible; on the one hand, riches, fortune, magnificence; on the other, physical suffering, disease, chagrin, sadness, mortification. The design gives one suggestion; here is a lord overlooking his dominion and alternately contemplating a globe; it looks like the malady, the mortification, the sadness of Alexander amidst the grandeur of this world's wealth."]}, {"t": "Invertida", "f": "Waite", "p": ["Surprise, wonder, enchantment, emotion, trouble, fear."]}, {"t": "Resumo", "f": "Waite", "p": ["Favourable in things of pleasure and business, as well as love; also wealth and honour. Reversed: Passion."]}], "busca": "two of wands dois de paus a tall man looks from a battlemented roof over sea and shore; he holds a globe in his right hand, while a staff in his left rests on the battlement; another is fixed in a ring. the rose and cross and lily should be noticed on the left side. between the alternative readings there is no marriage possible; on the one hand, riches, fortune, magnificence; on the other, physical suffering, disease, chagrin, sadness, mortification. the design gives one suggestion; here is a lord overlooking his dominion and alternately contemplating a globe; it looks like the malady, the mortification, the sadness of alexander amidst the grandeur of this world's wealth. surprise, wonder, enchantment, emotion, trouble, fear. favourable in things of pleasure and business, as well as love; also wealth and honour. reversed: passion. escolha de rumo domínio inicial inquietação planeamento horizonte alguém que já conquistou algo e olha para lá dele. waite fala de riqueza e magnificência, mas também da tristeza de quem possui o mundo — uma tensão que define a carta. o que se tem deixou de bastar. é o momento entre ter e querer outra coisa, com a escolha ainda por fazer. a insatisfação com o que já se alcançou pode ser lucidez ou pode ser um padrão. há quem só consiga desejar aquilo que ainda não tem, e para quem qualquer conquista se desvaloriza no momento em que se concretiza. a sombra desta carta é a inquietação como hábito: um horizonte que se afasta sempre à mesma velocidade a que se avança. pode representar o momento de decidir uma direção, com o conforto já garantido. pode trazer a questão do que se perde ao escolher um caminho. pode apontar para insatisfação com algo que, visto de fora, funciona. o que é que já tenho e não estou a conseguir ver como suficiente? este desejo de mais vem de onde — de curiosidade ou de incapacidade de parar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "three-of-wands", "guia": {"palavras": ["expansão", "espera activa", "empreendimento", "alcance", "cooperação"], "essencia": "O que foi lançado está a caminho e ainda não voltou. Waite associa a carta a empreendimento, comércio e descoberta. A figura olha para o mar depois de ter agido — a acção já foi tomada, o resultado ainda não chegou. É a carta do intervalo entre decidir e saber.", "psicologia_sombra": "Esperar por um resultado que não se controla é uma das situações que mais expõe a relação de alguém com a incerteza. Uns ocupam a espera com preparação, outros com vigilância ansiosa que não altera nada. A sombra aqui é a expansão sem base: alargar o alcance mais depressa do que se consegue sustentar, confundindo movimento com progresso.", "leitura": ["Pode marcar o período entre uma decisão tomada e as suas consequências.", "Pode trazer temas de alcance, colaboração ou ampliação de contexto.", "Pode levantar a pergunta do que se faz enquanto se espera."], "pensar": ["O que estou a fazer com o tempo em que não posso fazer nada?", "Aquilo que lancei tinha base suficiente, ou contava com sorte?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Three of Wands", "pt": "Três de Paus", "arcano": "menor", "num": 3, "naipe": "Paus", "img": "Wands03.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A calm, stately personage, with his back turned, looking from a cliffs edge at ships passing over the sea. Three staves are planted in the ground, and he leans slightly on one of them."]}, {"t": "Significados", "f": "Waite", "p": ["He symbolizes established strength, enterprise, effort, trade, commerce, discovery; those are his ships, bearing his merchandise, which are sailing over the sea. The card also signifies able co-operation in business, as if the successful merchant prince were looking from his side towards yours with a view to help you."]}, {"t": "Invertida", "f": "Waite", "p": ["The end of troubles, suspension or cessation of adversity, toil and disappointment."]}, {"t": "Resumo", "f": "Waite", "p": ["Unexpected advancement for a military man. Reversed: Consolation, cure, end of the business."]}], "busca": "three of wands três de paus a calm, stately personage, with his back turned, looking from a cliffs edge at ships passing over the sea. three staves are planted in the ground, and he leans slightly on one of them. he symbolizes established strength, enterprise, effort, trade, commerce, discovery; those are his ships, bearing his merchandise, which are sailing over the sea. the card also signifies able co-operation in business, as if the successful merchant prince were looking from his side towards yours with a view to help you. the end of troubles, suspension or cessation of adversity, toil and disappointment. unexpected advancement for a military man. reversed: consolation, cure, end of the business. expansão espera activa empreendimento alcance cooperação o que foi lançado está a caminho e ainda não voltou. waite associa a carta a empreendimento, comércio e descoberta. a figura olha para o mar depois de ter agido — a acção já foi tomada, o resultado ainda não chegou. é a carta do intervalo entre decidir e saber. esperar por um resultado que não se controla é uma das situações que mais expõe a relação de alguém com a incerteza. uns ocupam a espera com preparação, outros com vigilância ansiosa que não altera nada. a sombra aqui é a expansão sem base: alargar o alcance mais depressa do que se consegue sustentar, confundindo movimento com progresso. pode marcar o período entre uma decisão tomada e as suas consequências. pode trazer temas de alcance, colaboração ou ampliação de contexto. pode levantar a pergunta do que se faz enquanto se espera. o que estou a fazer com o tempo em que não posso fazer nada? aquilo que lancei tinha base suficiente, ou contava com sorte? a. e. waite; estrutura tradicional dos naipes."}, {"id": "four-of-wands", "guia": {"palavras": ["estabilidade", "marco", "celebração", "pertença", "pausa", "casa"], "essencia": "Uma estrutura que se aguenta e um momento de reconhecimento. Waite fala de vida no campo, colheita, repouso e concórdia. É a carta do lugar onde se pode parar — não o fim de tudo, mas um patamar suficientemente firme para se descansar nele sem vigilância.", "psicologia_sombra": "Aceitar um momento bom é mais difícil do que parece. Há quem não consiga habitar a estabilidade sem começar imediatamente a procurar a ameaça seguinte, ou a estragá-la por não confiar nela. A sombra desta carta é a estabilidade transformada em imobilidade: o patamar que era descanso e passa a ser sítio de onde já não se sai.", "leitura": ["Pode assinalar um marco alcançado, ou um período de estabilidade.", "Pode trazer temas de casa, pertença ou comunidade.", "Pode levantar a questão de se a pausa é descanso ou paragem definitiva."], "pensar": ["Consigo estar bem sem procurar o que pode correr mal a seguir?", "Isto é um patamar ou já se tornou um destino?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Four of Wands", "pt": "Quatro de Paus", "arcano": "menor", "num": 4, "naipe": "Paus", "img": "Wands04.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["From the four great staves planted in the foreground there is a great garland suspended; two female figures uplift nosegays; at their side is a bridge over a moat, leading to an old manorial house."]}, {"t": "Significados", "f": "Waite", "p": ["They are for once almost on the surface— country life, haven of refuge, a species of domestic harvest-home, repose, concord, harmony, prosperity, peace, and the perfected work of these."]}, {"t": "Invertida", "f": "Waite", "p": ["The meaning remains unaltered; it is prosperity, increase, felicity, beauty, embellishment."]}, {"t": "Resumo", "f": "Waite", "p": ["Contrarieties. Reversed: Presentiment."]}], "busca": "four of wands quatro de paus from the four great staves planted in the foreground there is a great garland suspended; two female figures uplift nosegays; at their side is a bridge over a moat, leading to an old manorial house. they are for once almost on the surface— country life, haven of refuge, a species of domestic harvest-home, repose, concord, harmony, prosperity, peace, and the perfected work of these. the meaning remains unaltered; it is prosperity, increase, felicity, beauty, embellishment. contrarieties. reversed: presentiment. estabilidade marco celebração pertença pausa casa uma estrutura que se aguenta e um momento de reconhecimento. waite fala de vida no campo, colheita, repouso e concórdia. é a carta do lugar onde se pode parar — não o fim de tudo, mas um patamar suficientemente firme para se descansar nele sem vigilância. aceitar um momento bom é mais difícil do que parece. há quem não consiga habitar a estabilidade sem começar imediatamente a procurar a ameaça seguinte, ou a estragá-la por não confiar nela. a sombra desta carta é a estabilidade transformada em imobilidade: o patamar que era descanso e passa a ser sítio de onde já não se sai. pode assinalar um marco alcançado, ou um período de estabilidade. pode trazer temas de casa, pertença ou comunidade. pode levantar a questão de se a pausa é descanso ou paragem definitiva. consigo estar bem sem procurar o que pode correr mal a seguir? isto é um patamar ou já se tornou um destino? a. e. waite; estrutura tradicional dos naipes."}, {"id": "five-of-wands", "guia": {"palavras": ["atrito", "competição", "dispersão", "ruído", "rivalidade"], "essencia": "Uma confusão de forças sem inimigo claro. Waite descreve-a como guerra imitada, competição, luta por bens. Ao contrário do conflito das Espadas, este atrito é físico e disperso — muita agitação, pouca direcção, e a possibilidade de que ninguém esteja verdadeiramente contra ninguém.", "psicologia_sombra": "Nem todo o conflito tem conteúdo. Parte do atrito humano é energia que não encontrou onde se aplicar e se descarrega no que estiver por perto. A sombra desta carta é a rivalidade como forma de evitar a tarefa: é mais fácil competir do que fazer, e uma discussão pode consumir semanas que o trabalho real exigiria. Também pode esconder o oposto — evitar todo o confronto e chamar-lhe paz.", "leitura": ["Pode representar desacordo sem antagonismo genuíno.", "Pode apontar para energia dispersa em várias frentes.", "Pode trazer temas de competição, comparação ou ruído entre pessoas."], "pensar": ["Este conflito é sobre alguma coisa, ou é sobre a tensão que não sei onde pôr?", "O que é que este atrito me está a poupar de fazer?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Five of Wands", "pt": "Cinco de Paus", "arcano": "menor", "num": 5, "naipe": "Paus", "img": "Wands05.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A posse of youths, who are brandishing staves, as if in sport or strife. It is mimic warfare, and hereto correspond the"]}, {"t": "Significados", "f": "Waite", "p": ["Imitation, as, for example, sham fight, but also the strenuous competition and struggle of the search after riches and fortune. In this sense it connects with the battle of life. Hence some attributions say that it is a card of gold, gain, opulence."]}, {"t": "Invertida", "f": "Waite", "p": ["Litigation, disputes, trickery, contradiction."]}, {"t": "Resumo", "f": "Waite", "p": ["Generally favourable; a happy marriage; also patrimony, legacies, gifts, success in enterprise. Reversed: Return of some relative who has not been seen for long."]}], "busca": "five of wands cinco de paus a posse of youths, who are brandishing staves, as if in sport or strife. it is mimic warfare, and hereto correspond the imitation, as, for example, sham fight, but also the strenuous competition and struggle of the search after riches and fortune. in this sense it connects with the battle of life. hence some attributions say that it is a card of gold, gain, opulence. litigation, disputes, trickery, contradiction. generally favourable; a happy marriage; also patrimony, legacies, gifts, success in enterprise. reversed: return of some relative who has not been seen for long. atrito competição dispersão ruído rivalidade uma confusão de forças sem inimigo claro. waite descreve-a como guerra imitada, competição, luta por bens. ao contrário do conflito das espadas, este atrito é físico e disperso — muita agitação, pouca direcção, e a possibilidade de que ninguém esteja verdadeiramente contra ninguém. nem todo o conflito tem conteúdo. parte do atrito humano é energia que não encontrou onde se aplicar e se descarrega no que estiver por perto. a sombra desta carta é a rivalidade como forma de evitar a tarefa: é mais fácil competir do que fazer, e uma discussão pode consumir semanas que o trabalho real exigiria. também pode esconder o oposto — evitar todo o confronto e chamar-lhe paz. pode representar desacordo sem antagonismo genuíno. pode apontar para energia dispersa em várias frentes. pode trazer temas de competição, comparação ou ruído entre pessoas. este conflito é sobre alguma coisa, ou é sobre a tensão que não sei onde pôr? o que é que este atrito me está a poupar de fazer? a. e. waite; estrutura tradicional dos naipes."}, {"id": "six-of-wands", "guia": {"palavras": ["reconhecimento", "vitória", "boas notícias", "exposição", "mérito"], "essencia": "O regresso de quem conseguiu, e o olhar dos outros sobre isso. Waite associa-a a vitória, boas notícias e expectativa coroada. O elemento decisivo não é o êxito em si mas o facto de ser visto: esta carta trata do que acontece quando o resultado passa a ser público.", "psicologia_sombra": "O reconhecimento externo é agradável e escorregadio. Pode confirmar um trabalho real ou substituí-lo, quando alguém começa a trabalhar para o efeito em vez de para a coisa. A sombra é a dependência do olhar alheio: uma conquista que só conta se alguém a registar, e um valor próprio que fica a depender de quem está a assistir.", "leitura": ["Pode assinalar reconhecimento, resultado favorável ou notícia boa.", "Pode trazer a questão da relação entre mérito e visibilidade.", "Pode levantar temas de exposição pública e do que ela custa."], "pensar": ["Isto valeria o mesmo para mim se ninguém soubesse?", "Estou a fazer, ou estou a ser visto a fazer?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Six of Wands", "pt": "Seis de Paus", "arcano": "menor", "num": 6, "naipe": "Paus", "img": "Wands06.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A laurelled horseman bears one staff adorned with a laurel crown; footmen with staves are at his side."]}, {"t": "Significados", "f": "Waite", "p": ["The card has been so designed that it can cover several significations; on the surface, it is a victor triumphing, but it is also great news, such as might be carried in state by the King's courier; it is expectation crowned with its own desire, the crown of hope, and so forth."]}, {"t": "Invertida", "f": "Waite", "p": ["Apprehension, fear, as of a victorious enemy at the gate; treachery, disloyalty, as of gates being opened to the enemy; also indefinite delay."]}, {"t": "Resumo", "f": "Waite", "p": ["Servants may lose the confidence of their masters; a young lady may be betrayed by a friend. Reversed : Fulfilment of deferred hope."]}], "busca": "six of wands seis de paus a laurelled horseman bears one staff adorned with a laurel crown; footmen with staves are at his side. the card has been so designed that it can cover several significations; on the surface, it is a victor triumphing, but it is also great news, such as might be carried in state by the king's courier; it is expectation crowned with its own desire, the crown of hope, and so forth. apprehension, fear, as of a victorious enemy at the gate; treachery, disloyalty, as of gates being opened to the enemy; also indefinite delay. servants may lose the confidence of their masters; a young lady may be betrayed by a friend. reversed : fulfilment of deferred hope. reconhecimento vitória boas notícias exposição mérito o regresso de quem conseguiu, e o olhar dos outros sobre isso. waite associa-a a vitória, boas notícias e expectativa coroada. o elemento decisivo não é o êxito em si mas o facto de ser visto: esta carta trata do que acontece quando o resultado passa a ser público. o reconhecimento externo é agradável e escorregadio. pode confirmar um trabalho real ou substituí-lo, quando alguém começa a trabalhar para o efeito em vez de para a coisa. a sombra é a dependência do olhar alheio: uma conquista que só conta se alguém a registar, e um valor próprio que fica a depender de quem está a assistir. pode assinalar reconhecimento, resultado favorável ou notícia boa. pode trazer a questão da relação entre mérito e visibilidade. pode levantar temas de exposição pública e do que ela custa. isto valeria o mesmo para mim se ninguém soubesse? estou a fazer, ou estou a ser visto a fazer? a. e. waite; estrutura tradicional dos naipes."}, {"id": "seven-of-wands", "guia": {"palavras": ["defesa de posição", "resistência", "coragem", "desvantagem", "convicção"], "essencia": "Manter terreno contra pressão vinda de baixo. Waite fala de valor, negociação e competição, com sucesso possível. A figura está em posição elevada mas em minoria — a vantagem é do lugar, não do número. É a carta de defender algo em que se acredita quando isso custa.", "psicologia_sombra": "Defender uma posição exige saber por que se defende. Sem isso, a resistência torna-se identidade: há quem se organize inteiramente em torno de estar contra, e para quem ceder em qualquer ponto passa a sentir-se como desaparecer. A sombra é a teimosia disfarçada de princípio, e o custo de manter durante anos uma posição que já não se examina.", "leitura": ["Pode representar a defesa de algo importante sob pressão.", "Pode trazer temas de convicção mantida contra a maioria.", "Pode levantar a pergunta de se a posição ainda merece ser defendida."], "pensar": ["Estou a defender uma convicção ou a defender-me de mudar de ideias?", "Quando foi a última vez que examinei esta posição em vez de a repetir?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Seven of Wands", "pt": "Sete de Paus", "arcano": "menor", "num": 7, "naipe": "Paus", "img": "Wands07.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A young man on a craggy eminence brandishing a staff; six other staves are raised towards him from below."]}, {"t": "Significados", "f": "Waite", "p": ["It is a card of valour, for, on the surface, six are attacking one, who has, however, the vantage position. On the intellectual plane, it signifies discussion, wordy strife; in business— negotiations, war of trade, barter, competition. It is further a card of success, for the combatant is on the top and his enemies may be unable to reach him."]}, {"t": "Invertida", "f": "Waite", "p": ["Perplexity, embarrassments, anxiety. It is also a caution against indecision."]}, {"t": "Resumo", "f": "Waite", "p": ["Fair child; idea, design, resolve, movement. Reversed : Success, if accompanied by the Three of Cups. 57v.-Pleasant memories. Reversed: Inheritance to fall in quickly."]}], "busca": "seven of wands sete de paus a young man on a craggy eminence brandishing a staff; six other staves are raised towards him from below. it is a card of valour, for, on the surface, six are attacking one, who has, however, the vantage position. on the intellectual plane, it signifies discussion, wordy strife; in business— negotiations, war of trade, barter, competition. it is further a card of success, for the combatant is on the top and his enemies may be unable to reach him. perplexity, embarrassments, anxiety. it is also a caution against indecision. fair child; idea, design, resolve, movement. reversed : success, if accompanied by the three of cups. 57v.-pleasant memories. reversed: inheritance to fall in quickly. defesa de posição resistência coragem desvantagem convicção manter terreno contra pressão vinda de baixo. waite fala de valor, negociação e competição, com sucesso possível. a figura está em posição elevada mas em minoria — a vantagem é do lugar, não do número. é a carta de defender algo em que se acredita quando isso custa. defender uma posição exige saber por que se defende. sem isso, a resistência torna-se identidade: há quem se organize inteiramente em torno de estar contra, e para quem ceder em qualquer ponto passa a sentir-se como desaparecer. a sombra é a teimosia disfarçada de princípio, e o custo de manter durante anos uma posição que já não se examina. pode representar a defesa de algo importante sob pressão. pode trazer temas de convicção mantida contra a maioria. pode levantar a pergunta de se a posição ainda merece ser defendida. estou a defender uma convicção ou a defender-me de mudar de ideias? quando foi a última vez que examinei esta posição em vez de a repetir? a. e. waite; estrutura tradicional dos naipes."}, {"id": "eight-of-wands", "guia": {"palavras": ["rapidez", "movimento", "notícias", "aproximação", "aceleração"], "essencia": "Tudo se move ao mesmo tempo e depressa. Waite descreve actividade, celeridade e pressa — as varas já lançadas, prestes a chegar. Não há figuras na carta: é a única situação, entre os Paus, em que o processo avança sozinho e a pessoa é sobretudo destinatária.", "psicologia_sombra": "A velocidade produz uma sensação de eficácia que nem sempre corresponde a alguma coisa. Períodos rápidos podem ser produtivos ou podem ser fuga: há quem só consiga funcionar em urgência, porque a urgência dispensa a pergunta sobre se aquilo interessa. A sombra é a pressa como anestésico — movimento suficiente para não haver espaço para pensar.", "leitura": ["Pode assinalar um período em que os acontecimentos se sucedem depressa.", "Pode trazer temas de comunicação, notícias ou respostas que chegam.", "Pode levantar a questão do que se perde quando não há tempo para considerar."], "pensar": ["Esta pressa é da situação ou é minha?", "O que é que eu teria de sentir se tudo abrandasse?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Eight of Wands", "pt": "Oito de Paus", "arcano": "menor", "num": 8, "naipe": "Paus", "img": "Wands08.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The card represents motion through the immovable-a flight of wands through an open country; but they draw to the term of their course. That which they signify is at hand; it may be even on the threshold. Divincitory Meanings: Activity in undertakings, the path of such activity, swiftness, as that of an express messenger; great haste, great hope, speed towards an end which promises assured felicity; generally, that which is on the move; also the arrows of love."]}, {"t": "Invertida", "f": "Waite", "p": ["Arrows of jealousy, internal dispute, stingings of conscience, quarrels; and domestic disputes for persons who are married."]}, {"t": "Resumo", "f": "Waite", "p": ["Marriage with a fair woman. Reversed: Perfect satisfaction."]}], "busca": "eight of wands oito de paus the card represents motion through the immovable-a flight of wands through an open country; but they draw to the term of their course. that which they signify is at hand; it may be even on the threshold. divincitory meanings: activity in undertakings, the path of such activity, swiftness, as that of an express messenger; great haste, great hope, speed towards an end which promises assured felicity; generally, that which is on the move; also the arrows of love. arrows of jealousy, internal dispute, stingings of conscience, quarrels; and domestic disputes for persons who are married. marriage with a fair woman. reversed: perfect satisfaction. rapidez movimento notícias aproximação aceleração tudo se move ao mesmo tempo e depressa. waite descreve actividade, celeridade e pressa — as varas já lançadas, prestes a chegar. não há figuras na carta: é a única situação, entre os paus, em que o processo avança sozinho e a pessoa é sobretudo destinatária. a velocidade produz uma sensação de eficácia que nem sempre corresponde a alguma coisa. períodos rápidos podem ser produtivos ou podem ser fuga: há quem só consiga funcionar em urgência, porque a urgência dispensa a pergunta sobre se aquilo interessa. a sombra é a pressa como anestésico — movimento suficiente para não haver espaço para pensar. pode assinalar um período em que os acontecimentos se sucedem depressa. pode trazer temas de comunicação, notícias ou respostas que chegam. pode levantar a questão do que se perde quando não há tempo para considerar. esta pressa é da situação ou é minha? o que é que eu teria de sentir se tudo abrandasse? a. e. waite; estrutura tradicional dos naipes."}, {"id": "nine-of-wands", "guia": {"palavras": ["vigilância", "cansaço", "resistência", "desconfiança", "quase-fim"], "essencia": "Alguém que já levou golpes e continua de pé, à espera do próximo. Waite fala de força na oposição, atraso e suspensão. A figura está ferida mas não vencida — e a sua atenção está toda voltada para a ameaça, mesmo que ela já não venha.", "psicologia_sombra": "A vigilância que protegeu alguém no passado tende a manter-se depois de deixar de ser necessária. É um dos padrões mais reconhecíveis em quem passou por períodos difíceis: a defesa continua ligada, agora contra ninguém. A sombra desta carta é a desconfiança generalizada — a experiência real transformada em regra permanente, com o custo de tornar impossível qualquer aproximação.", "leitura": ["Pode representar resistência mantida a custo, perto do fim de algo.", "Pode trazer temas de defesa aprendida e de dificuldade em baixar a guarda.", "Pode levantar a pergunta de se a ameaça ainda existe fora da expectativa."], "pensar": ["Contra o que é que ainda estou de guarda?", "O que aconteceria se eu descansasse e nada corresse mal?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Nine of Wands", "pt": "Nove de Paus", "arcano": "menor", "num": 9, "naipe": "Paus", "img": "Wands09.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The figure leans upon his staff and has an expectant look, as if awaiting an enemy. Behind are eight other staves— erect, in orderly disposition, like a palisade."]}, {"t": "Significados", "f": "Waite", "p": ["The card signifies strength in opposition. If attacked, the person will meet an onslaught boldly; and his build shews, that he may prove a formidable antagonist. With this main significance there are all its possible adjuncts— delay, suspension, adjournment."]}, {"t": "Invertida", "f": "Waite", "p": ["Obstacles, adversity, calamity."]}, {"t": "Resumo", "f": "Waite", "p": ["Of good augury for military men. Reversed: Good business. 3.4 Some Additional Meanings of the Lesser Arcana"]}], "busca": "nine of wands nove de paus the figure leans upon his staff and has an expectant look, as if awaiting an enemy. behind are eight other staves— erect, in orderly disposition, like a palisade. the card signifies strength in opposition. if attacked, the person will meet an onslaught boldly; and his build shews, that he may prove a formidable antagonist. with this main significance there are all its possible adjuncts— delay, suspension, adjournment. obstacles, adversity, calamity. of good augury for military men. reversed: good business. 3.4 some additional meanings of the lesser arcana vigilância cansaço resistência desconfiança quase-fim alguém que já levou golpes e continua de pé, à espera do próximo. waite fala de força na oposição, atraso e suspensão. a figura está ferida mas não vencida — e a sua atenção está toda voltada para a ameaça, mesmo que ela já não venha. a vigilância que protegeu alguém no passado tende a manter-se depois de deixar de ser necessária. é um dos padrões mais reconhecíveis em quem passou por períodos difíceis: a defesa continua ligada, agora contra ninguém. a sombra desta carta é a desconfiança generalizada — a experiência real transformada em regra permanente, com o custo de tornar impossível qualquer aproximação. pode representar resistência mantida a custo, perto do fim de algo. pode trazer temas de defesa aprendida e de dificuldade em baixar a guarda. pode levantar a pergunta de se a ameaça ainda existe fora da expectativa. contra o que é que ainda estou de guarda? o que aconteceria se eu descansasse e nada corresse mal? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ten-of-wands", "guia": {"palavras": ["sobrecarga", "peso", "responsabilidade excessiva", "obstinação", "fim de ciclo"], "essencia": "Carrega-se mais do que é possível carregar, e o destino já está à vista. Waite associa a carta a opressão e a algo que se disfarça. O fardo é real e foi, em grande parte, assumido voluntariamente — o que a torna mais difícil de pousar do que se tivesse sido imposto.", "psicologia_sombra": "Assumir peso a mais pode ser dedicação ou pode ser uma forma de existir. Há quem só se sinta legítimo enquanto está sobrecarregado, e para quem pedir ajuda seria admitir algo intolerável. A sombra não é o esforço, é o esforço como prova de valor — e a incapacidade de distinguir o que é responsabilidade própria do que foi apenas aceite sem discussão.", "leitura": ["Pode assinalar responsabilidade acumulada para além do sustentável.", "Pode trazer temas de dificuldade em delegar ou recusar.", "Pode levantar a questão de quanto do peso é realmente da pessoa."], "pensar": ["Deste peso todo, quanto é que é mesmo meu?", "O que temo que aconteça se eu pousar uma parte?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ten of Wands", "pt": "Dez de Paus", "arcano": "menor", "num": 10, "naipe": "Paus", "img": "Wands10.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A man oppressed by the weight of the ten staves which he is carrying."]}, {"t": "Significados", "f": "Waite", "p": ["A card of many significances, and some of the readings cannot be harmonized. I set aside that which connects it with honour and good faith. The chief meaning is oppression simply, but it is also fortune, gain, any kind of success, and then it is the oppression of these things. It is also a card of false-seeming, disguise, perfidy. The place which the figure is approaching may suffer from the rods that he carries. Success is stultified if the Nine of Swords follows, and if it is a question of a lawsuit, there will be certain loss."]}, {"t": "Invertida", "f": "Waite", "p": ["Contrarieties, difficulties, intrigues, and their analogies."]}, {"t": "Resumo", "f": "Waite", "p": ["For a male Querent, a good marriage and one beyond his expectations. Reversed: Sorrow; also a serious quarrel."]}], "busca": "ten of wands dez de paus a man oppressed by the weight of the ten staves which he is carrying. a card of many significances, and some of the readings cannot be harmonized. i set aside that which connects it with honour and good faith. the chief meaning is oppression simply, but it is also fortune, gain, any kind of success, and then it is the oppression of these things. it is also a card of false-seeming, disguise, perfidy. the place which the figure is approaching may suffer from the rods that he carries. success is stultified if the nine of swords follows, and if it is a question of a lawsuit, there will be certain loss. contrarieties, difficulties, intrigues, and their analogies. for a male querent, a good marriage and one beyond his expectations. reversed: sorrow; also a serious quarrel. sobrecarga peso responsabilidade excessiva obstinação fim de ciclo carrega-se mais do que é possível carregar, e o destino já está à vista. waite associa a carta a opressão e a algo que se disfarça. o fardo é real e foi, em grande parte, assumido voluntariamente — o que a torna mais difícil de pousar do que se tivesse sido imposto. assumir peso a mais pode ser dedicação ou pode ser uma forma de existir. há quem só se sinta legítimo enquanto está sobrecarregado, e para quem pedir ajuda seria admitir algo intolerável. a sombra não é o esforço, é o esforço como prova de valor — e a incapacidade de distinguir o que é responsabilidade própria do que foi apenas aceite sem discussão. pode assinalar responsabilidade acumulada para além do sustentável. pode trazer temas de dificuldade em delegar ou recusar. pode levantar a questão de quanto do peso é realmente da pessoa. deste peso todo, quanto é que é mesmo meu? o que temo que aconteça se eu pousar uma parte? a. e. waite; estrutura tradicional dos naipes."}, {"id": "page-of-wands", "guia": {"palavras": ["notícia", "entusiasmo", "aprendizagem", "ímpeto novo", "inexperiência"], "essencia": "Alguém no início de uma relação com o fogo: vontade sem método. Waite associa a carta a um mensageiro, a notícias e a fidelidade. Os Valetes são o momento em que um princípio ainda está a ser aprendido, com toda a energia e nenhuma das cautelas que a experiência traz.", "psicologia_sombra": "O entusiasmo do principiante tem valor próprio e é irrecuperável depois. Também é frágil: encontra o primeiro obstáculo e não tem com que o interpretar. A sombra é o entusiasmo que se recusa a amadurecer — a pessoa que prefere manter-se sempre na fase inicial, onde tudo ainda é possível, para nunca ter de lidar com a mediania do meio do caminho.", "leitura": ["Pode assinalar o começo de um interesse ou de uma aprendizagem.", "Pode trazer notícias, mensagens ou um impulso ainda por formar.", "Pode levantar temas de inexperiência e do que ela permite ver."], "pensar": ["O que é que eu ainda não sei o suficiente para ter medo de fazer?", "Este entusiasmo tem estrutura por baixo, ou é só arranque?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Page of Wands", "pt": "Valete de Paus", "arcano": "menor", "num": 11, "naipe": "Paus", "img": "Wands11.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["In a scene similar to the former, a young man stands in the act of proclamation. He is unknown but faithful, and his tidings are strange."]}, {"t": "Significados", "f": "Waite", "p": ["Dark young man, faithful, a lover, an envoy, a postman. Beside a man, he will bear favourable testimony concerning him. A dangerous rival, if followed by the Page of Cups. Has the chief qualities of his suit. He may signify family intelligence."]}, {"t": "Invertida", "f": "Waite", "p": ["Anecdotes, announcements, evil news. Also indecision and the instability which accompanies it."]}, {"t": "Resumo", "f": "Waite", "p": ["Good augury; also a young man who is unfortunate in love. Reversed: Obstacles of all kinds."]}], "busca": "page of wands valete de paus in a scene similar to the former, a young man stands in the act of proclamation. he is unknown but faithful, and his tidings are strange. dark young man, faithful, a lover, an envoy, a postman. beside a man, he will bear favourable testimony concerning him. a dangerous rival, if followed by the page of cups. has the chief qualities of his suit. he may signify family intelligence. anecdotes, announcements, evil news. also indecision and the instability which accompanies it. good augury; also a young man who is unfortunate in love. reversed: obstacles of all kinds. notícia entusiasmo aprendizagem ímpeto novo inexperiência alguém no início de uma relação com o fogo: vontade sem método. waite associa a carta a um mensageiro, a notícias e a fidelidade. os valetes são o momento em que um princípio ainda está a ser aprendido, com toda a energia e nenhuma das cautelas que a experiência traz. o entusiasmo do principiante tem valor próprio e é irrecuperável depois. também é frágil: encontra o primeiro obstáculo e não tem com que o interpretar. a sombra é o entusiasmo que se recusa a amadurecer — a pessoa que prefere manter-se sempre na fase inicial, onde tudo ainda é possível, para nunca ter de lidar com a mediania do meio do caminho. pode assinalar o começo de um interesse ou de uma aprendizagem. pode trazer notícias, mensagens ou um impulso ainda por formar. pode levantar temas de inexperiência e do que ela permite ver. o que é que eu ainda não sei o suficiente para ter medo de fazer? este entusiasmo tem estrutura por baixo, ou é só arranque? a. e. waite; estrutura tradicional dos naipes."}, {"id": "knight-of-wands", "guia": {"palavras": ["partida", "ímpeto", "mudança", "precipitação", "deslocação"], "essencia": "Movimento decidido e talvez demasiado rápido. Waite associa-o a partida, ausência, fuga, emigração e mudança de residência. Os Cavaleiros levam o princípio do naipe ao extremo do movimento: aqui, fogo em deslocação, com tudo o que isso tem de eficaz e de irreflectido.", "psicologia_sombra": "Partir resolve algumas coisas e adia outras. A mudança de lugar produz alívio imediato e pode ser confundida com transformação — mas o que se leva na bagagem viaja com a pessoa. A sombra desta carta é a fuga com aparência de coragem: sair sempre antes de a situação exigir alguma coisa mais difícil do que sair.", "leitura": ["Pode assinalar uma partida, mudança ou aceleração.", "Pode trazer temas de impulso que não espera por condições.", "Pode levantar a questão de se o movimento é avanço ou saída."], "pensar": ["Vou em direcção a alguma coisa, ou estou a afastar-me de outra?", "O que é que esta mudança me poupa de enfrentar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Knight of Wands", "pt": "Cavaleiro de Paus", "arcano": "menor", "num": 12, "naipe": "Paus", "img": "Wands12.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He is shewn as if upon a journey, armed with a short wand, and although mailed is not on a warlike errand. He is passing mounds or pyramids. The motion of the horse is a key to the character of its rider, and suggests the precipitate mood, or things connected therewith."]}, {"t": "Significados", "f": "Waite", "p": ["Departure, absence, flight, emigration. A dark young man, friendly. Change of residence."]}, {"t": "Invertida", "f": "Waite", "p": ["Rupture, division, interruption, discord,"]}, {"t": "Resumo", "f": "Waite", "p": ["A visit from a friend, who will bring unexpected money to the Querent. Reversed: Irregularity."]}], "busca": "knight of wands cavaleiro de paus he is shewn as if upon a journey, armed with a short wand, and although mailed is not on a warlike errand. he is passing mounds or pyramids. the motion of the horse is a key to the character of its rider, and suggests the precipitate mood, or things connected therewith. departure, absence, flight, emigration. a dark young man, friendly. change of residence. rupture, division, interruption, discord, a visit from a friend, who will bring unexpected money to the querent. reversed: irregularity. partida ímpeto mudança precipitação deslocação movimento decidido e talvez demasiado rápido. waite associa-o a partida, ausência, fuga, emigração e mudança de residência. os cavaleiros levam o princípio do naipe ao extremo do movimento: aqui, fogo em deslocação, com tudo o que isso tem de eficaz e de irreflectido. partir resolve algumas coisas e adia outras. a mudança de lugar produz alívio imediato e pode ser confundida com transformação — mas o que se leva na bagagem viaja com a pessoa. a sombra desta carta é a fuga com aparência de coragem: sair sempre antes de a situação exigir alguma coisa mais difícil do que sair. pode assinalar uma partida, mudança ou aceleração. pode trazer temas de impulso que não espera por condições. pode levantar a questão de se o movimento é avanço ou saída. vou em direcção a alguma coisa, ou estou a afastar-me de outra? o que é que esta mudança me poupa de enfrentar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "queen-of-wands", "guia": {"palavras": ["confiança", "calor", "autoridade natural", "magnetismo", "franqueza"], "essencia": "Segurança que não precisa de se impor. Waite descreve-a como amistosa, honrada e afectuosa, com o leão no trono e o girassol na mão. Nas figuras de corte, a Rainha representa o princípio do naipe vivido por dentro: fogo que aquece e atrai, em vez de fogo que avança.", "psicologia_sombra": "A presença que atrai os outros tem um efeito que nem sempre é escolhido. Quem ocupa naturalmente o centro de uma sala pode ter dificuldade em perceber o espaço que isso ocupa aos restantes. A sombra é o calor que exige público — generosidade genuína que, ao longo do tempo, passa a precisar de ser reconhecida para se manter.", "leitura": ["Pode representar confiança serena, ou alguém com essa qualidade.", "Pode trazer temas de calor humano, franqueza e presença.", "Pode levantar a questão de quanto da presença é para si e quanto é para os outros."], "pensar": ["A minha confiança sustenta-se sozinha ou precisa de resposta?", "Que espaço é que a minha presença ocupa a quem está ao lado?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Queen of Wands", "pt": "Rainha de Paus", "arcano": "menor", "num": 13, "naipe": "Paus", "img": "Wands13.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The Wands throughout this suit are always in leaf, as it is a suit of life and animation. Emotionally and otherwise, the Queen's personality corresponds to that of the King, but is more magnetic."]}, {"t": "Significados", "f": "Waite", "p": ["A dark woman, countrywoman, friendly, chaste, loving, honourable. If the card beside her signifies a man, she is well disposed towards him; if a woman, she is interested in the Querent. Also, love of money, or a certain success in business."]}, {"t": "Invertida", "f": "Waite", "p": ["Good, economical, obliging, serviceable. Signifies also— but in certain positions and in the neighbourhood of other cards tending in such directions— opposition, jealousy, even deceit and infidelity."]}, {"t": "Resumo", "f": "Waite", "p": ["Sometimes denotes a woman of equivocal character. Reversed: A rich marriage for a man and a distinguished one for a woman."]}], "busca": "queen of wands rainha de paus the wands throughout this suit are always in leaf, as it is a suit of life and animation. emotionally and otherwise, the queen's personality corresponds to that of the king, but is more magnetic. a dark woman, countrywoman, friendly, chaste, loving, honourable. if the card beside her signifies a man, she is well disposed towards him; if a woman, she is interested in the querent. also, love of money, or a certain success in business. good, economical, obliging, serviceable. signifies also— but in certain positions and in the neighbourhood of other cards tending in such directions— opposition, jealousy, even deceit and infidelity. sometimes denotes a woman of equivocal character. reversed: a rich marriage for a man and a distinguished one for a woman. confiança calor autoridade natural magnetismo franqueza segurança que não precisa de se impor. waite descreve-a como amistosa, honrada e afectuosa, com o leão no trono e o girassol na mão. nas figuras de corte, a rainha representa o princípio do naipe vivido por dentro: fogo que aquece e atrai, em vez de fogo que avança. a presença que atrai os outros tem um efeito que nem sempre é escolhido. quem ocupa naturalmente o centro de uma sala pode ter dificuldade em perceber o espaço que isso ocupa aos restantes. a sombra é o calor que exige público — generosidade genuína que, ao longo do tempo, passa a precisar de ser reconhecida para se manter. pode representar confiança serena, ou alguém com essa qualidade. pode trazer temas de calor humano, franqueza e presença. pode levantar a questão de quanto da presença é para si e quanto é para os outros. a minha confiança sustenta-se sozinha ou precisa de resposta? que espaço é que a minha presença ocupa a quem está ao lado? a. e. waite; estrutura tradicional dos naipes."}, {"id": "king-of-wands", "guia": {"palavras": ["liderança", "visão", "honestidade", "empreendimento", "responsabilidade"], "essencia": "O fogo aplicado ao mundo e responsabilizado por ele. Waite descreve-o como honesto e consciencioso, com a salamandra e o leão no trono. O Rei é o princípio do naipe voltado para fora: alguém que abre caminho e responde pelas consequências de o ter aberto.", "psicologia_sombra": "Liderar exige uma confiança que é difícil de calibrar. A mesma certeza que permite decidir por outros impede de os ouvir, e é raro que quem decide muito mantenha a capacidade de reconhecer quando se enganou. A sombra é a visão que deixou de admitir correcção — autoridade que, de tanto funcionar, se tornou impermeável.", "leitura": ["Pode representar liderança, iniciativa ou alguém com autoridade natural.", "Pode trazer temas de responsabilidade assumida publicamente.", "Pode levantar a questão de se a convicção ainda escuta."], "pensar": ["Quando foi a última vez que mudei de posição por causa do que alguém me disse?", "Esta autoridade foi conquistada, ou apenas ocupada?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "King of Wands", "pt": "Rei de Paus", "arcano": "menor", "num": 14, "naipe": "Paus", "img": "Wands14.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The physical and emotional nature to which this card is attributed is dark, ardent, lithe, animated, impassioned, noble. The King uplifts a flowering wand, and wears, like his three correspondences in the remaining suits, what is called a cap of maintenance beneath his crown. He connects with the symbol of the lion, which is emblazoned on the back of his throne."]}, {"t": "Significados", "f": "Waite", "p": ["Dark man, friendly, countryman, generally married, honest and conscientious. The card always signifies honesty, and may mean news concerning an unexpected heritage to fall in before very long."]}, {"t": "Invertida", "f": "Waite", "p": ["Good, but severe; austere, yet tolerant."]}, {"t": "Resumo", "f": "Waite", "p": ["Beware of ill-will on the part of a man of position, and of hypocrisy pretending to help. Reversed: Loss."]}], "busca": "king of wands rei de paus the physical and emotional nature to which this card is attributed is dark, ardent, lithe, animated, impassioned, noble. the king uplifts a flowering wand, and wears, like his three correspondences in the remaining suits, what is called a cap of maintenance beneath his crown. he connects with the symbol of the lion, which is emblazoned on the back of his throne. dark man, friendly, countryman, generally married, honest and conscientious. the card always signifies honesty, and may mean news concerning an unexpected heritage to fall in before very long. good, but severe; austere, yet tolerant. beware of ill-will on the part of a man of position, and of hypocrisy pretending to help. reversed: loss. liderança visão honestidade empreendimento responsabilidade o fogo aplicado ao mundo e responsabilizado por ele. waite descreve-o como honesto e consciencioso, com a salamandra e o leão no trono. o rei é o princípio do naipe voltado para fora: alguém que abre caminho e responde pelas consequências de o ter aberto. liderar exige uma confiança que é difícil de calibrar. a mesma certeza que permite decidir por outros impede de os ouvir, e é raro que quem decide muito mantenha a capacidade de reconhecer quando se enganou. a sombra é a visão que deixou de admitir correcção — autoridade que, de tanto funcionar, se tornou impermeável. pode representar liderança, iniciativa ou alguém com autoridade natural. pode trazer temas de responsabilidade assumida publicamente. pode levantar a questão de se a convicção ainda escuta. quando foi a última vez que mudei de posição por causa do que alguém me disse? esta autoridade foi conquistada, ou apenas ocupada? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ace-of-cups", "guia": {"palavras": ["abertura afectiva", "início emocional", "receptividade", "transbordo", "disponibilidade"], "essencia": "A capacidade de sentir antes de estar dirigida a alguém. Waite fala da casa do coração verdadeiro, alegria e fertilidade. É a carta da disponibilidade emocional em estado puro — não uma relação, mas a condição que a torna possível.", "psicologia_sombra": "Estar aberto é uma posição vulnerável e nem sempre voluntária. Há períodos em que a pessoa sente tudo com uma intensidade que não escolheu, e outros em que a abertura é decidida como quem baixa uma defesa antiga. A sombra é o transbordo sem destinatário: emoção que se derrama em qualquer direcção e que, por não distinguir, acaba por não ligar a ninguém.", "leitura": ["Pode assinalar o início de algo afectivo, ainda sem forma.", "Pode trazer temas de receptividade e de disponibilidade para sentir.", "Pode levantar a questão do que se faz com aquilo que se sente."], "pensar": ["Isto que sinto está dirigido a alguém, ou é sobretudo meu?", "O que me custa mais: sentir, ou deixar que se saiba que sinto?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ace of Cups", "pt": "Ás de Copas", "arcano": "menor", "num": 1, "naipe": "Copas", "img": "Cups01.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The waters are beneath, and thereon are water-lilies; the hand issues from the cloud, holding in its palm the cup, from which four streams are pouring; a dove, bearing in its bill a cross-marked Host, descends to place the Wafer in the Cup; the dew of water is falling on all sides. It is an intimation of that which may lie behind the Lesser Arcana."]}, {"t": "Significados", "f": "Waite", "p": ["House of the true heart, joy, content, abode, nourishment, abundance, fertility; Holy Table, felicity hereof."]}, {"t": "Invertida", "f": "Waite", "p": ["House of the false heart, mutation, instability, revolution."]}], "busca": "ace of cups ás de copas the waters are beneath, and thereon are water-lilies; the hand issues from the cloud, holding in its palm the cup, from which four streams are pouring; a dove, bearing in its bill a cross-marked host, descends to place the wafer in the cup; the dew of water is falling on all sides. it is an intimation of that which may lie behind the lesser arcana. house of the true heart, joy, content, abode, nourishment, abundance, fertility; holy table, felicity hereof. house of the false heart, mutation, instability, revolution. abertura afectiva início emocional receptividade transbordo disponibilidade a capacidade de sentir antes de estar dirigida a alguém. waite fala da casa do coração verdadeiro, alegria e fertilidade. é a carta da disponibilidade emocional em estado puro — não uma re
