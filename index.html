<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de Tarot</title>
<style>
:root {
  --fundo: #fbfaf8; --papel: #fff; --tinta: #23201c; --suave: #6b6459;
  --linha: #e4ded4; --realce: #7c5c3e; --sombra: 0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #16140f; --papel: #1e1b16; --tinta: #ece6dc; --suave: #a09888;
    --linha: #322c24; --realce: #c9a227; --sombra: 0 1px 3px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font: 16px/1.6 Georgia, "Iowan Old Style", serif;
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--papel);
  border-bottom: 1px solid var(--linha); padding: .9rem 1.2rem;
}
.topo { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
        max-width: 1180px; margin: 0 auto; }
h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; font-weight: 600; }
h1 a { color: inherit; text-decoration: none; }
#busca {
  flex: 1; min-width: 200px; padding: .5rem .8rem; font: inherit; font-size: .95rem;
  background: var(--fundo); color: var(--tinta);
  border: 1px solid var(--linha); border-radius: 7px;
}
#busca:focus { outline: 2px solid var(--realce); outline-offset: -1px; }
.filtros { display: flex; gap: .35rem; flex-wrap: wrap; }
.filtros button {
  font: inherit; font-size: .85rem; padding: .3rem .75rem; cursor: pointer;
  background: transparent; color: var(--suave);
  border: 1px solid var(--linha); border-radius: 20px;
}
.filtros button[aria-pressed="true"] {
  background: var(--realce); border-color: var(--realce); color: var(--papel);
}
main { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }
.grelha {
  display: grid; gap: 1.1rem;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
}
.carta { cursor: pointer; text-align: center; text-decoration: none; color: inherit; }
.carta img {
  width: 100%; aspect-ratio: 300/527; object-fit: cover; display: block;
  border-radius: 6px; box-shadow: var(--sombra); background: var(--papel);
  transition: transform .12s ease;
}
.carta:hover img { transform: translateY(-3px); }
.carta b { display: block; font-size: .82rem; font-weight: 600; margin-top: .5rem; }
.carta span { display: block; font-size: .72rem; color: var(--suave); }
.vazio { color: var(--suave); padding: 3rem 0; text-align: center; }
.secao-titulo {
  grid-column: 1/-1; font-size: .78rem; text-transform: uppercase;
  letter-spacing: .11em; color: var(--suave); margin: 1.2rem 0 -.3rem;
}
.secao-titulo:first-child { margin-top: 0; }
/* ---- ficha ---- */
.ficha { display: grid; grid-template-columns: 300px 1fr; gap: 2.4rem; align-items: start; }
@media (max-width: 720px) { .ficha { grid-template-columns: 1fr; gap: 1.4rem; } }
.ficha img { width: 100%; border-radius: 8px; box-shadow: var(--sombra); }
.ficha h2 { font-size: 2rem; margin: 0 0 .2rem; line-height: 1.15; }
.ficha .en { color: var(--suave); font-style: italic; margin: 0 0 .4rem; }
.ficha .meta { color: var(--suave); font-size: .85rem; margin: 0 0 1.8rem; }
.bloco { margin-bottom: 2rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 1.8rem; }
.chips button {
  font: inherit; font-size: .8rem; padding: .22rem .7rem; cursor: pointer;
  background: transparent; color: var(--realce);
  border: 1px solid var(--linha); border-radius: 20px;
}
.chips button:hover { border-color: var(--realce); }
.guia { border-left: 2px solid var(--linha); padding-left: 1.3rem; margin-bottom: 2.6rem; }
.guia ul { margin: 0 0 .8rem; padding-left: 1.1rem; }
.guia li { margin-bottom: .35rem; }
.guia .pensar li { color: var(--realce); font-style: italic; }
.fontes-linha { font-size: .8rem; color: var(--suave); font-style: italic; margin: 0; }
details.originais { margin-top: 1rem; }
details.originais summary {
  cursor: pointer; font-size: .78rem; text-transform: uppercase;
  letter-spacing: .11em; color: var(--suave); padding: .6rem 0;
}
details.originais[open] summary { margin-bottom: 1rem; }
.bloco h3 {
  font-size: .78rem; text-transform: uppercase; letter-spacing: .11em;
  color: var(--realce); margin: 0 0 .1rem; font-weight: 700;
}
.bloco .fonte { font-size: .75rem; color: var(--suave); margin: 0 0 .7rem; font-style: italic; }
.bloco p { margin: 0 0 .8rem; }
.nav { display: flex; justify-content: space-between; gap: 1rem;
       margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--linha); }
.nav a { color: var(--realce); text-decoration: none; font-size: .9rem; }
.nav a:hover { text-decoration: underline; }
mark { background: var(--realce); color: var(--papel); padding: 0 .15em; border-radius: 2px; }
</style>
</head>

bra dourada: a coragem de experimentar e de ser visto a fazê-lo, muitas vezes reprimida por medo de parecer pretensioso. pode indicar um momento de iniciativa — os recursos existem; falta escolher para onde os dirigir. pode convidar a perguntar se uma comunicação recente foi genuína ou calculada para o efeito. pode assinalar a diferença entre ter competência e confiar demasiado nela. estou a criar algo, ou a gerir a imagem de que sou capaz de criar? que talento meu uso com mais frequência para impressionar do que para construir? a. e. waite; aleister crowley; sallie nichols; mariana louis; rachel pollack."}, {"id": "the-high-priestess", "guia": {"palavras": ["intuição", "mistério", "receptividade", "inconsciente", "silêncio", "saber interior"], "essencia": "Sentada entre dois pilares, com um véu por trás e um livro fechado ou parcialmente oculto no colo, a Sacerdotisa é o princípio do conhecimento que não se obtém por esforço mas por receptividade. Contrasta com o Mago: onde ele age, ela guarda; onde ele fala, ela guarda silêncio. É a carta que sugere que nem tudo o que é real pode ou deve ser dito.", "simbolismo": ["O véu atrás dela é o próprio inconsciente — o que está por detrás só se revela a quem sabe esperar.", "Os pilares (frequentemente marcados B e J, Boaz e Jachin, do Templo de Salomão) marcam um limiar, não uma sala — entra-se nela, não se a possui.", "A lua aos seus pés liga-a a ciclos, não a factos fixos.", "O livro fechado ou semiaberto sugere conhecimento que se guarda, não que se recusa."], "psicologia": "Corresponde ao pólo receptivo e intuitivo da psique — o que Nichols associa a uma anima altamente diferenciada, capaz de conter significado sem precisar de o explicar de imediato. É a carta do saber que ainda não tem palavras: um pressentimento correcto antes de se saber justificá-lo. Knight nota que esta qualidade, quando distorcida, se torna indisponibilidade emocional disfarçada de mistério — usar a reserva como forma de nunca se comprometer com o que se sente.", "sombra": ["O silêncio pode proteger, mas também pode ser evasão disfarçada de profundidade.", "A intuição pode tornar-se desculpa para não verificar factos ou não comunicar.", "A receptividade pode deslizar para passividade — esperar sem agir mesmo quando agir seria possível.", "Sombra dourada: a capacidade de partilhar uma verdade importante no momento certo, e não antes."], "leitura": ["Pode sugerir que a resposta a uma pergunta ainda não está pronta para ser dita, nem sequer a si mesmo.", "Pode convidar a confiar num pressentimento sem exigir dele prova imediata.", "Pode assinalar uma distância emocional que vale a pena examinar, em vez de simplesmente respeitar."], "pensar": ["O que sei sobre esta situação que ainda não me permiti dizer, nem sequer em pensamento?", "Onde é que o meu silêncio protege algo importante, e onde apenas evita um risco?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis; Rachel Pollack."}, "nome": "The High Priestess", "pt": "A Papisa", "arcano": "maior", "num": 2, "naipe": null, "img": "02-TheHighPriestess.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["She has the lunar crescent at her feet, a horned diadem on her head, with a globe in the middle place, and a large solar cross on her breast. The scroll in her hands is inscribed with the word Torn, signifying the Greater Law, the Secret Law and the second sense of the Word. It is partly covered by her mantle, to shew that some things are implied and some spoken. She is seated between the white and black pillars— J. and B.— of the mystic Temple, and the veil of the Temple is behind her: it is embroidered with palms and pomegranates. The vestments are flowing and gauzy, and the mantle suggests light— a shimmering radiance. She has been called occult Science on the threshold of the Sanctuary of Isis, but she is really the Secret Church, the House which is of God and man. She represents also the Second Marriage of the Prince who is no longer of this world; she is the spiritual Bride and Mother, the daughter of the stars and the Higher Garden of Eden. She is, in fine, the Queen of the borrowed light, but this is the light of all. She is the Moon nourished by the milk of the Supernal Mother. In a manner, she is also the Supernal Mother herself— that is to say, she is the bright reflection. It is in this sense of reflection that her truest and highest name in holism is Shekinah — the co-habiting glory. According to Kabalism, there is a Shekinah both above and below. In the superior world it is called Binah, the Supernal Understanding which reflects to the emanations that are beneath. In the lower world it is Malkuth — that world being, for this purpose, understood as a blessed Kingdom that with which it is made blessed being the Indwelling Glory. Mystically speaking, the Shekinah is the Spiritual Bride of the just man, and when he reads the Law she gives the Divine meaning. There are some respects in which this card is the highest and holiest of the Greater Arcana."]}, {"t": "Resumo", "f": "Waite", "p": ["Secrets, mystery, the future as yet unrevealed; the woman who interests the Querent, if male; the Querent herself, if female; silence, tenacity; mystery, wisdom, science. Reversed : Passion, moral or physical ardour, conceit, surface knowledge."]}], "busca": "the high priestess a papisa she has the lunar crescent at her feet, a horned diadem on her head, with a globe in the middle place, and a large solar cross on her breast. the scroll in her hands is inscribed with the word torn, signifying the greater law, the secret law and the second sense of the word. it is partly covered by her mantle, to shew that some things are implied and some spoken. she is seated between the white and black pillars— j. and b.— of the mystic temple, and the veil of the temple is behind her: it is embroidered with palms and pomegranates. the vestments are flowing and gauzy, and the mantle suggests light— a shimmering radiance. she has been called occult science on the threshold of the sanctuary of isis, but she is really the secret church, the house which is of god and man. she represents also the second marriage of the prince who is no longer of this world; she is the spiritual bride and mother, the daughter of the stars and the higher garden of eden. she is, in fine, the queen of the borrowed light, but this is the light of all. she is the moon nourished by the milk of the supernal mother. in a manner, she is also the supernal mother herself— that is to say, she is the bright reflection. it is in this sense of reflection that her truest and highest name in holism is shekinah — the co-habiting glory. according to kabalism, there is a shekinah both above and below. in the superior world it is called binah, the supernal understanding which reflects to the emanations that are beneath. in the lower world it is malkuth — that world being, for this purpose, understood as a blessed kingdom that with which it is made blessed being the indwelling glory. mystically speaking, the shekinah is the spiritual bride of the just man, and when he reads the law she gives the divine meaning. there are some respects in which this card is the highest and holiest of the greater arcana. secrets, mystery, the future as yet unrevealed; the woman who interests the querent, if male; the querent herself, if female; silence, tenacity; mystery, wisdom, science. reversed : passion, moral or physical ardour, conceit, surface knowledge. intuição mistério receptividade inconsciente silêncio saber interior sentada entre dois pilares, com um véu por trás e um livro fechado ou parcialmente oculto no colo, a sacerdotisa é o princípio do conhecimento que não se obtém por esforço mas por receptividade. contrasta com o mago: onde ele age, ela guarda; onde ele fala, ela guarda silêncio. é a carta que sugere que nem tudo o que é real pode ou deve ser dito. o véu atrás dela é o próprio inconsciente — o que está por detrás só se revela a quem sabe esperar. os pilares (frequentemente marcados b e j, boaz e jachin, do templo de salomão) marcam um limiar, não uma sala — entra-se nela, não se a possui. a lua aos seus pés liga-a a ciclos, não a factos fixos. o livro fechado ou semiaberto sugere conhecimento que se guarda, não que se recusa. corresponde ao pólo receptivo e intuitivo da psique — o que nichols associa a uma anima altamente diferenciada, capaz de conter significado sem precisar de o explicar de imediato. é a carta do saber que ainda não tem palavras: um pressentimento correcto antes de se saber justificá-lo. knight nota que esta qualidade, quando distorcida, se torna indisponibilidade emocional disfarçada de mistério — usar a reserva como forma de nunca se comprometer com o que se sente. o silêncio pode proteger, mas também pode ser evasão disfarçada de profundidade. a intuição pode tornar-se desculpa para não verificar factos ou não comunicar. a receptividade pode deslizar para passividade — esperar sem agir mesmo quando agir seria possível. sombra dourada: a capacidade de partilhar uma verdade importante no momento certo, e não antes. pode sugerir que a resposta a uma pergunta ainda não está pronta para ser dita, nem sequer a si mesmo. pode convidar a confiar num pressentimento sem exigir dele prova imediata. pode assinalar uma distância emocional que vale a pena examinar, em vez de simplesmente respeitar. o que sei sobre esta situação que ainda não me permiti dizer, nem sequer em pensamento? onde é que o meu silêncio protege algo importante, e onde apenas evita um risco? a. e. waite; aleister crowley; sallie nichols; mariana louis; rachel pollack."}, {"id": "the-empress", "guia": {"palavras": ["criação", "fertilidade", "abundância", "natureza", "sensualidade", "nutrição", "corpo", "crescimento"], "essencia": "A Imperatriz representa a capacidade de gerar, nutrir e dar forma à experiência. Sentada entre campos maduros e água corrente, liga espírito e matéria não pelo domínio, mas pela fecundidade. Na tradição de Waite-Smith é \"fecundidade universal\" e o \"sentido exterior do Verbo\" — a vida a tornar-se visível; no sistema de Crowley é Vénus, e a letra Daleth (\"porta\") que une o Pai e a Mãe na Árvore da Vida. Em ambos os sistemas, a Imperatriz precede o Imperador: a criação antecede a ordem que a organiza.", "simbolismo": ["A coroa de doze estrelas e o cetro rematado por um globo (Waite-Smith) ligam-na ao ciclo do ano e ao domínio sobre o mundo manifestado, não apenas à maternidade biológica.", "O escudo com o símbolo de Vénus e os campos de trigo maduro associam-na à colheita — fecundidade que já deu fruto, não apenas potencial.", "Na Árvore da Vida de Crowley, Daleth significa \"porta\": a Imperatriz é passagem, não destino.", "O pelicano que alimenta as crias com o próprio sangue (Thoth) e a água corrente atrás do trono (Waite-Smith) apontam para o mesmo tema: dar de si como princípio de vida."], "psicologia": "Corresponde ao arquétipo junguiano da Grande Mãe — mas não apenas ao seu pólo nutridor. Erich Neumann descreveu esse arquétipo como tendo sempre dois pólos: o \"carácter elementar\", que contém e nutre, e o seu reverso, a Mãe Terrível, que retém e devora. A carta convida a pensar a criação não como acto isolado mas como relação contínua: aquilo que criamos continua a exigir presença depois de nascido. A Imperatriz pergunta menos \"o que estás a criar?\" e mais \"o que estás disposto a continuar a alimentar, e à custa de quê?\"", "sombra": ["Nutrir pode tornar-se sobreproteger: criar condições para que algo cresça pode transformar-se em impedir que cresça sem nós.", "Cuidar pode deslizar para controlar — a mesma atenção que sustenta a vida do outro pode negar-lhe autonomia.", "A abundância pode tornar-se excesso, ou dependência do próprio acto de dar.", "O pólo oposto e igualmente arquetípico — a Mãe Terrível de Neumann — surge quando o cuidado se converte em posse: reter em vez de deixar partir."], "leitura": ["Pode assinalar um período fértil — de projectos, relações ou ideias — e convidar a perguntar o que esse período exige em manutenção contínua.", "Pode trazer à consulta a relação com o corpo, o prazer ou a criatividade como territórios a habitar mais plenamente.", "Pode apontar para uma dinâmica de cuidado, dado ou recebido, que vale a pena examinar: permite crescimento, ou substitui-o?"], "pensar": ["Aquilo que estou a alimentar está realmente a crescer, ou estou apenas a mantê-lo sob a minha tutela?", "Onde é que cuidar de algo ou alguém começou a substituir a confiança na sua autonomia?"], "fontes": "A. E. Waite; Aleister Crowley; Erich Neumann; Sallie Nichols; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "The Empress", "pt": "A Imperatriz", "arcano": "maior", "num": 3, "naipe": null, "img": "03-TheEmpress.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A stately figure, seated, having rich vestments and royal aspect, as of a daughter of heaven and earth. Her diadem is of twelve stars, gathered in a cluster. The symbol of Venus is on the shield which rests near her. A field of corn is ripening in front of her, and beyond there is a fall of water. The sceptre which she bears is surmounted by the globe of this world. She is the inferior Garden of Eden, the Earthly Paradise, all that is symbolized by the visible house of man. She is not Regina coeli, but she is still refugium peccatorum, the fruitful mother of thousands. There are also certain aspects in which she has been correctly described as desire and the wings thereof, as the woman clothed with the sun, as Gloria Mundi and the veil of the Sanctum Sanctorum ; but she is not, I may add, the soul that has attained wings, unless all the symbolism is counted up another and unusual way. She is above all things universal fecundity and the outer sense of the Word. This is obvious, because there is no direct message which has been given to man like that which is borne by woman; but she does not herself carry its interpretation. In another order of ideas, the card of the Empress signifies the door or gate by which an entrance is obtained into this life, as into the Garden of Venus; and then the way which leads out therefrom, into that which is beyond, is the secret known to the High Priestess: it is communicated by her to the elect. Most old attributions of this card are completely wrong on the symbolism— as, for example, its identification with the Word, Divine Nature, the Triad, and so forth."]}, {"t": "Resumo", "f": "Waite", "p": ["Fruitfulness, action, initiative, length of days; the unknown, clandestine; also difficulty, doubt, ignorance. Reversed : Light, truth, the unravelling of involved matters, public rejoicings; according to another reading, vacillation."]}], "busca": "the empress a imperatriz a stately figure, seated, having rich vestments and royal aspect, as of a daughter of heaven and earth. her diadem is of twelve stars, gathered in a cluster. the symbol of venus is on the shield which rests near her. a field of corn is ripening in front of her, and beyond there is a fall of water. the sceptre which she bears is surmounted by the globe of this world. she is the inferior garden of eden, the earthly paradise, all that is symbolized by the visible house of man. she is not regina coeli, but she is still refugium peccatorum, the fruitful mother of thousands. there are also certain aspects in which she has been correctly described as desire and the wings thereof, as the woman clothed with the sun, as gloria mundi and the veil of the sanctum sanctorum ; but she is not, i may add, the soul that has attained wings, unless all the symbolism is counted up another and unusual way. she is above all things universal fecundity and the outer sense of the word. this is obvious, because there is no direct message which has been given to man like that which is borne by woman; but she does not herself carry its interpretation. in another order of ideas, the card of the empress signifies the door or gate by which an entrance is obtained into this life, as into the garden of venus; and then the way which leads out therefrom, into that which is beyond, is the secret known to the high priestess: it is communicated by her to the elect. most old attributions of this card are completely wrong on the symbolism— as, for example, its identification with the word, divine nature, the triad, and so forth. fruitfulness, action, initiative, length of days; the unknown, clandestine; also difficulty, doubt, ignorance. reversed : light, truth, the unravelling of involved matters, public rejoicings; according to another reading, vacillation. criação fertilidade abundância natureza sensualidade nutrição corpo crescimento a imperatriz representa a capacidade de gerar, nutrir e dar forma à experiência. sentada entre campos maduros e água corrente, liga espírito e matéria não pelo domínio, mas pela fecundidade. na tradição de waite-smith é \"fecundidade universal\" e o \"sentido exterior do verbo\" — a vida a tornar-se visível; no sistema de crowley é vénus, e a letra daleth (\"porta\") que une o pai e a mãe na árvore da vida. em ambos os sistemas, a imperatriz precede o imperador: a criação antecede a ordem que a organiza. a coroa de doze estrelas e o cetro rematado por um globo (waite-smith) ligam-na ao ciclo do ano e ao domínio sobre o mundo manifestado, não apenas à maternidade biológica. o escudo com o símbolo de vénus e os campos de trigo maduro associam-na à colheita — fecundidade que já deu fruto, não apenas potencial. na árvore da vida de crowley, daleth significa \"porta\": a imperatriz é passagem, não destino. o pelicano que alimenta as crias com o próprio sangue (thoth) e a água corrente atrás do trono (waite-smith) apontam para o mesmo tema: dar de si como princípio de vida. corresponde ao arquétipo junguiano da grande mãe — mas não apenas ao seu pólo nutridor. erich neumann descreveu esse arquétipo como tendo sempre dois pólos: o \"carácter elementar\", que contém e nutre, e o seu reverso, a mãe terrível, que retém e devora. a carta convida a pensar a criação não como acto isolado mas como relação contínua: aquilo que criamos continua a exigir presença depois de nascido. a imperatriz pergunta menos \"o que estás a criar?\" e mais \"o que estás disposto a continuar a alimentar, e à custa de quê?\" nutrir pode tornar-se sobreproteger: criar condições para que algo cresça pode transformar-se em impedir que cresça sem nós. cuidar pode deslizar para controlar — a mesma atenção que sustenta a vida do outro pode negar-lhe autonomia. a abundância pode tornar-se excesso, ou dependência do próprio acto de dar. o pólo oposto e igualmente arquetípico — a mãe terrível de neumann — surge quando o cuidado se converte em posse: reter em vez de deixar partir. pode assinalar um período fértil — de projectos, relações ou ideias — e convidar a perguntar o que esse período exige em manutenção contínua. pode trazer à consulta a relação com o corpo, o prazer ou a criatividade como territórios a habitar mais plenamente. pode apontar para uma dinâmica de cuidado, dado ou recebido, que vale a pena examinar: permite crescimento, ou substitui-o? aquilo que estou a alimentar está realmente a crescer, ou estou apenas a mantê-lo sob a minha tutela? onde é que cuidar de algo ou alguém começou a substituir a confiança na sua autonomia? a. e. waite; aleister crowley; erich neumann; sallie nichols; rachel pollack; mariana louis; shannon knight."}, {"id": "the-emperor", "guia": {"palavras": ["estrutura", "autoridade", "ordem", "estabilidade", "protecção", "vontade", "liderança"], "essencia": "Sentado num trono ladeado por cabeças de carneiro, cetro numa mão, globo na outra, o Imperador é a estrutura que \"traz ordem ao jardim da Imperatriz\" — logos, lei, forma. Waite descreve-o como \"poder de execução e realização\", governante do mundo natural na sua expressão mais elevada, mas insiste que a carta representa sobretudo \"a soberania do intelecto\" — ordem pensada, não apenas imposta pela força.", "simbolismo": ["O cetro em forma de cruz ansata (Waite-Smith) e o globo simbolizam domínio sobre o que é manifesto, não apenas poder militar.", "O trono ladeado por carneiros liga-o a Áries e ao elemento Fogo (Crowley): energia estruturante, mas de arranque súbito.", "O contraste entre o carneiro selvagem no trono e o cordeiro manso a seus pés dramatiza a diferença entre autoridade e mera dominação.", "No Thoth, o Imperador integra Sofre alquímico — a energia masculina activa do universo."], "psicologia": "Pollack lê o Imperador através do superego: a autoridade paterna interiorizada a partir da qual a criança forma os seus próprios limites. É a carta da estrutura necessária ao crescimento — mas também da pergunta sobre o que essa estrutura serve. Louis insiste em \"resgatar a sua benevolência\": nem toda a ordem é opressão, e a ausência de estrutura não é, por si, liberdade. Knight distingue \"autoritário\" de \"autoritativo\" — governar por medo da imprevisibilidade, ou assumir responsabilidade sem precisar de a impor pela força.", "sombra": ["A necessidade de controlo pode nascer do medo da própria vulnerabilidade, não de confiança na ordem que se cria.", "A estabilidade pode tornar-se rigidez — recusar qualquer mudança à estrutura, mesmo quando já não serve.", "A autoridade pode confundir-se com autoritarismo: exigir obediência em vez de merecer confiança.", "Sombra dourada: a assertividade que procura estabilidade sem a impor pela força."], "leitura": ["Pode assinalar a necessidade de criar ou reforçar uma estrutura — regras, limites, um plano — onde antes havia apenas impulso.", "Pode convidar a examinar uma dinâmica de autoridade, própria ou de outrem, e perguntar a quem ela realmente serve.", "Numa sociedade ou contexto injusto, pode assinalar precisamente o oposto do que promete: uma ordem que impede, em vez de permitir, o crescimento."], "pensar": ["A estrutura que mantenho protege o que interessa, ou protege apenas o meu controlo sobre a situação?", "A quem serve, realmente, a ordem que estou a defender?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "The Emperor", "pt": "O Imperador", "arcano": "maior", "num": 4, "naipe": null, "img": "04-TheEmperor.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He has a form of the Crux ansata for his sceptre and a globe in his left hand. He is a crowned monarch— commanding, stately, seated on a throne, the arms of which axe fronted by rams' heads. He is executive and realization, the power of this world, here clothed with the highest of its natural attributes. He is occasionally represented as seated on a cubic stone, which, however, confuses some of the issues. He is the virile power, to which the Empress responds, and in this sense is he who seeks to remove the Veil of Isis; yet she remains virgo intacta. It should be understood that this card and that of the Empress do not precisely represent the condition of married life, though this state is implied. On the surface, as I have indicated, they stand for mundane royalty, uplifted on the seats of the mighty; but above this there is the suggestion of another presence. They signify also— and the male figure especially-the higher kingship, occupying the intellectual throne. Hereof is the lordship of thought rather than of the animal world. Both personalities, after their own manner, are \"full of strange experience,\" but theirs is not consciously the wisdom which draws from a higher world. The Emperor has been described as (a) will in its embodied form, but this is only one of its applications, and (b) as an expression of virtualities contained in the Absolute Being— but this is fantasy."]}, {"t": "Resumo", "f": "Waite", "p": ["Stability, power, protection, realization; a great person; aid, reason, conviction; also authority and will. Reversed : Benevolence, compassion, credit; also confusion to enemies, obstruction, immaturity."]}], "busca": "the emperor o imperador he has a form of the crux ansata for his sceptre and a globe in his left hand. he is a crowned monarch— commanding, stately, seated on a throne, the arms of which axe fronted by rams' heads. he is executive and realization, the power of this world, here clothed with the highest of its natural attributes. he is occasionally represented as seated on a cubic stone, which, however, confuses some of the issues. he is the virile power, to which the empress responds, and in this sense is he who seeks to remove the veil of isis; yet she remains virgo intacta. it should be understood that this card and that of the empress do not precisely represent the condition of married life, though this state is implied. on the surface, as i have indicated, they stand for mundane royalty, uplifted on the seats of the mighty; but above this there is the suggestion of another presence. they signify also— and the male figure especially-the higher kingship, occupying the intellectual throne. hereof is the lordship of thought rather than of the animal world. both personalities, after their own manner, are \"full of strange experience,\" but theirs is not consciously the wisdom which draws from a higher world. the emperor has been described as (a) will in its embodied form, but this is only one of its applications, and (b) as an expression of virtualities contained in the absolute being— but this is fantasy. stability, power, protection, realization; a great person; aid, reason, conviction; also authority and will. reversed : benevolence, compassion, credit; also confusion to enemies, obstruction, immaturity. estrutura autoridade ordem estabilidade protecção vontade liderança sentado num trono ladeado por cabeças de carneiro, cetro numa mão, globo na outra, o imperador é a estrutura que \"traz ordem ao jardim da imperatriz\" — logos, lei, forma. waite descreve-o como \"poder de execução e realização\", governante do mundo natural na sua expressão mais elevada, mas insiste que a carta representa sobretudo \"a soberania do intelecto\" — ordem pensada, não apenas imposta pela força. o cetro em forma de cruz ansata (waite-smith) e o globo simbolizam domínio sobre o que é manifesto, não apenas poder militar. o trono ladeado por carneiros liga-o a áries e ao elemento fogo (crowley): energia estruturante, mas de arranque súbito. o contraste entre o carneiro selvagem no trono e o cordeiro manso a seus pés dramatiza a diferença entre autoridade e mera dominação. no thoth, o imperador integra sofre alquímico — a energia masculina activa do universo. pollack lê o imperador através do superego: a autoridade paterna interiorizada a partir da qual a criança forma os seus próprios limites. é a carta da estrutura necessária ao crescimento — mas também da pergunta sobre o que essa estrutura serve. louis insiste em \"resgatar a sua benevolência\": nem toda a ordem é opressão, e a ausência de estrutura não é, por si, liberdade. knight distingue \"autoritário\" de \"autoritativo\" — governar por medo da imprevisibilidade, ou assumir responsabilidade sem precisar de a impor pela força. a necessidade de controlo pode nascer do medo da própria vulnerabilidade, não de confiança na ordem que se cria. a estabilidade pode tornar-se rigidez — recusar qualquer mudança à estrutura, mesmo quando já não serve. a autoridade pode confundir-se com autoritarismo: exigir obediência em vez de merecer confiança. sombra dourada: a assertividade que procura estabilidade sem a impor pela força. pode assinalar a necessidade de criar ou reforçar uma estrutura — regras, limites, um plano — onde antes havia apenas impulso. pode convidar a examinar uma dinâmica de autoridade, própria ou de outrem, e perguntar a quem ela realmente serve. numa sociedade ou contexto injusto, pode assinalar precisamente o oposto do que promete: uma ordem que impede, em vez de permitir, o crescimento. a estrutura que mantenho protege o que interessa, ou protege apenas o meu controlo sobre a situação? a quem serve, realmente, a ordem que estou a defender? a. e. waite; aleister crowley; sallie nichols; rachel pollack; mariana louis; shannon knight."}, {"id": "the-hierophant", "guia": {"palavras": ["tradição", "ensino", "doutrina", "pertença", "estrutura espiritual", "transmissão"], "essencia": "Também chamado o Papa nos baralhos mais antigos, o Hierofante está sentado entre duas colunas, dois seguidores ajoelhados diante dele, mão erguida num gesto de bênção. Waite descreve-o como \"o poder governante da religião exterior\", em contraste com a Sacerdotisa, guardiã do saber interior e velado. É a primeira carta a mostrar um diálogo consciente e institucionalizado entre uma figura humana e uma tradição que a excede.", "simbolismo": ["As chaves cruzadas a seus pés são \"o poder das chaves\": acesso a uma doutrina, não posse pessoal dela.", "A tripla coroa e o gesto de bênção ligam-no à autoridade eclesiástica formal — saber transmitido, não descoberto sozinho.", "Os dois seguidores ajoelhados mostram a doutrina em transmissão activa, de professor para aprendiz.", "Crowley reformula a carta em torno do Touro e da Terra: tradição enraizada, não abstracta."], "psicologia": "O Hierofante representa a necessidade humana de pertencer a algo que nos precede — uma linguagem, uma comunidade de sentido, um conjunto de práticas partilhadas. Nichols liga-o à etapa mais madura do desenvolvimento do animus segundo Emma Jung: não poder, nem feito, nem palavra, mas sentido. Louis distingue-o cuidadosamente do Eremita: o Hierofante é misticismo do coração institucionalizado, enquanto o Eremita é o mesmo impulso vivido a sós. A sua sombra mais óbvia — dogma — é também, nota Louis, o que a carta invertida se torna: \"uma versão do Diabo\".", "sombra": ["A tradição pode tornar-se dogma — recusa de qualquer caminho que não siga a fórmula aprovada.", "A pertença pode exigir conformidade ao ponto de apagar a diferença individual.", "O respeito pela autoridade pode substituir o discernimento próprio.", "Sombra dourada: guiar ou ensinar com compaixão, respeitando caminhos diferentes do próprio."], "leitura": ["Pode assinalar a procura, ou a necessidade, de uma estrutura de sentido partilhada — um mentor, uma comunidade, uma prática.", "Pode convidar a examinar se uma regra ou convenção está a ser seguida por convicção ou por medo de destoar.", "Em contextos de aprendizagem, pode marcar a diferença entre receber ensino e submeter-se cegamente a ele."], "pensar": ["Esta regra que sigo, sigo-a porque a compreendo, ou porque nunca perguntei porquê?", "O que ganho, e o que perco, ao pertencer a este grupo, tradição ou comunidade?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis; Rachel Pollack."}, "nome": "The Hierophant", "pt": "O Papa", "arcano": "maior", "num": 5, "naipe": null, "img": "05-TheHierophant.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He wears the triple crown and is seated between two pillars, but they are not those of the Temple which is guarded by the High Priestess. In his left hand he holds a sceptre terminating in the triple cross, and with his right hand he gives the well-known ecclesiastical sign which is called that of esotericism, distinguishing between the manifest and concealed part of doctrine. It is noticeable in this connexion that the High Priestess makes no sign. At his feet are the crossed keys, and two priestly ministers in albs kneel before him. He has been usually called the Pope, which is a particular application of the more general office that he symbolizes. He is the ruling power of external religion, as the High Priestess is the prevailing genius of the esoteric, withdrawn power. The proper meanings of this card have suffered woeful admixture from nearly all hands. Grand Orient says truly that the Hierophant is the power of the keys, exoteric orthodox doctrine, and the outer side of the life which leads to the doctrine; but he is certainly not the prince of occult doctrine, as another commentator has suggested. He is rather the summa totius theologice, when it has passed into the utmost rigidity of expression; but he symbolizes also all things that are righteous and sacred on the manifest side. As such, he is the channel of grace belonging to the world of institution as distinct from that of Nature, and he is the leader of salvation for the human race at large. He is the order and the head of the recognized hierarchy, which is the reflection of another and greater hierarchic order; but it may so happen that the pontiff forgets the significance of this his symbolic state and acts as if he contained within his proper measures all that his sign signifies or his symbol seeks to shew forth. He is not, as it has been thought, philosophy-except on the theological side; he is not inspiration; and he is not religion, although he is a mode of its expression."]}, {"t": "Resumo", "f": "Waite", "p": ["Marriage, alliance, captivity, servitude; by another account, mercy and goodness; inspiration; the man to whom the Querent has recourse. Reversed : Society, good understanding, concord, overkindness, weakness."]}], "busca": "the hierophant o papa he wears the triple crown and is seated between two pillars, but they are not those of the temple which is guarded by the high priestess. in his left hand he holds a sceptre terminating in the triple cross, and with his right hand he gives the well-known ecclesiastical sign which is called that of esotericism, distinguishing between the manifest and concealed part of doctrine. it is noticeable in this connexion that the high priestess makes no sign. at his feet are the crossed keys, and two priestly ministers in albs kneel before him. he has been usually called the pope, which is a particular application of the more general office that he symbolizes. he is the ruling power of external religion, as the high priestess is the prevailing genius of the esoteric, withdrawn power. the proper meanings of this card have suffered woeful admixture from nearly all hands. grand orient says truly that the hierophant is the power of the keys, exoteric orthodox doctrine, and the outer side of the life which leads to the doctrine; but he is certainly not the prince of occult doctrine, as another commentator has suggested. he is rather the summa totius theologice, when it has passed into the utmost rigidity of expression; but he symbolizes also all things that are righteous and sacred on the manifest side. as such, he is the channel of grace belonging to the world of institution as distinct from that of nature, and he is the leader of salvation for the human race at large. he is the order and the head of the recognized hierarchy, which is the reflection of another and greater hierarchic order; but it may so happen that the pontiff forgets the significance of this his symbolic state and acts as if he contained within his proper measures all that his sign signifies or his symbol seeks to shew forth. he is not, as it has been thought, philosophy-except on the theological side; he is not inspiration; and he is not religion, although he is a mode of its expression. marriage, alliance, captivity, servitude; by another account, mercy and goodness; inspiration; the man to whom the querent has recourse. reversed : society, good understanding, concord, overkindness, weakness. tradição ensino doutrina pertença estrutura espiritual transmissão também chamado o papa nos baralhos mais antigos, o hierofante está sentado entre duas colunas, dois seguidores ajoelhados diante dele, mão erguida num gesto de bênção. waite descreve-o como \"o poder governante da religião exterior\", em contraste com a sacerdotisa, guardiã do saber interior e velado. é a primeira carta a mostrar um diálogo consciente e institucionalizado entre uma figura humana e uma tradição que a excede. as chaves cruzadas a seus pés são \"o poder das chaves\": acesso a uma doutrina, não posse pessoal dela. a tripla coroa e o gesto de bênção ligam-no à autoridade eclesiástica formal — saber transmitido, não descoberto sozinho. os dois seguidores ajoelhados mostram a doutrina em transmissão activa, de professor para aprendiz. crowley reformula a carta em torno do touro e da terra: tradição enraizada, não abstracta. o hierofante representa a necessidade humana de pertencer a algo que nos precede — uma linguagem, uma comunidade de sentido, um conjunto de práticas partilhadas. nichols liga-o à etapa mais madura do desenvolvimento do animus segundo emma jung: não poder, nem feito, nem palavra, mas sentido. louis distingue-o cuidadosamente do eremita: o hierofante é misticismo do coração institucionalizado, enquanto o eremita é o mesmo impulso vivido a sós. a sua sombra mais óbvia — dogma — é também, nota louis, o que a carta invertida se torna: \"uma versão do diabo\". a tradição pode tornar-se dogma — recusa de qualquer caminho que não siga a fórmula aprovada. a pertença pode exigir conformidade ao ponto de apagar a diferença individual. o respeito pela autoridade pode substituir o discernimento próprio. sombra dourada: guiar ou ensinar com compaixão, respeitando caminhos diferentes do próprio. pode assinalar a procura, ou a necessidade, de uma estrutura de sentido partilhada — um mentor, uma comunidade, uma prática. pode convidar a examinar se uma regra ou convenção está a ser seguida por convicção ou por medo de destoar. em contextos de aprendizagem, pode marcar a diferença entre receber ensino e submeter-se cegamente a ele. esta regra que sigo, sigo-a porque a compreendo, ou porque nunca perguntei porquê? o que ganho, e o que perco, ao pertencer a este grupo, tradição ou comunidade? a. e. waite; aleister crowley; sallie nichols; mariana louis; rachel pollack."}, {"id": "the-lovers", "guia": {"palavras": ["escolha", "amor", "união", "valores", "atracção", "integração de opostos"], "essencia": "Um homem e uma mulher, nus, sob um anjo que os observa de cima — Adão e Eva, num Éden que Waite lê não como tentação mas como \"mistério da Aliança\". É a primeira carta plenamente humana e individualizada do baralho, e a primeira em que a escolha — não apenas o destino — entra em cena. Waite descreve-a simplesmente como \"a carta do amor humano\".", "simbolismo": ["A árvore da Vida atrás do homem e a árvore do Conhecimento atrás da mulher (com a serpente enrolada) situam a escolha amorosa dentro, não fora, do mito da Queda.", "O anjo (Rafael, nas leituras esotéricas) a abençoar de cima sugere que a união humana participa de algo maior do que a vontade pessoal.", "Em Crowley, a carta liga-se a Mercúrio e a Gémeos: união como síntese de opostos, não apenas atracção.", "Historicamente, versões anteriores a Waite mostravam antes uma escolha entre duas figuras femininas — a decisão, mais do que o amor em si, é o tema mais antigo da carta."], "psicologia": "Marca o início da jornada pessoal do \"herói\", em contraste com as figuras arquetípicas que a antecedem no baralho: aqui, pela primeira vez, há uma escolha a fazer, não apenas um poder a receber. Nichols lê o triângulo emocional (frequentemente presente nas versões mais antigas da carta) como a matéria-prima necessária de um conflito do qual nasce crescimento — convidando o leitor a escrever o seu próprio cenário para a carta antes de aceitar qualquer interpretação fixa. Louis lê-a como hieros gamos, casamento sagrado: a passagem de um amor inconsciente e fundido para um amor consciente, que reconhece o outro como separado de si.", "sombra": ["A escolha amorosa pode tornar-se rigidez — impor ao outro os próprios termos em vez de negociar com ele.", "A necessidade de união pode disfarçar dificuldade real em tolerar a diferença ou a autonomia do outro.", "O medo de escolher mal pode paralisar qualquer decisão.", "Sombra dourada: aceitar em si múltiplas identidades e desejos sem os hierarquizar por medo do julgamento alheio."], "leitura": ["Pode assinalar uma escolha real com consequências — não apenas romântica — entre dois caminhos ou valores.", "Pode trazer à consulta a qualidade de uma relação: até que ponto há espaço, nela, para duas pessoas inteiras.", "Pode convidar a examinar o que está a pesar mais numa decisão: o valor próprio ou a pressão de terceiros."], "pensar": ["Esta escolha, estou a fazê-la a partir do que valorizo, ou a partir do que temo perder?", "Nesta relação, há espaço para sermos dois inteiros, ou só cabemos lá se um se ajustar ao outro?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Mariana Louis."}, "nome": "The Lovers", "pt": "Os Enamorados", "arcano": "maior", "num": 6, "naipe": null, "img": "06-TheLovers.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["THfc LOVERS. The sun shines in the zenith, and beneath is a great winged figure with arms extended, pouring down influences. In the foreground are two human figures, male and female, unveiled before each other, as if Adam and Eve when they first occupied the paradise of the earthly body. Behind the man is the Tree of Life, bearing twelve fruits, and the Tree of the Knowledge of Good and Evil is behind the woman; the serpent is twining round it. The figures suggest youth, virginity, innocence and love before it is contaminated by gross material desire. This is in all simplicity the card of human love, here exhibited as part of the way, the truth and the life. It replaces, by recourse to first principles, the old card of marriage, which I have described previously, and the later follies which depicted man between vice and virtue. In a very high sense, the card is a mystery of the Covenant and Sabbath. The suggestion in respect of the woman is that she signifies that attraction towards the sensitive life which carries within it the idea of the Fall of Man, but she is rather the working of a Secret Law of Providence than a willing and conscious temptress. It is through her imputed lapse that man shall arise ultimately, and only by her can he complete himself. The card is therefore in its way another intimation concerning the great mystery of womanhood. The old meanings fall to pieces of necessity with the old pictures, but even as interpretations of the latter, some of them were of the order of commonplace and others were false in symbolism."]}, {"t": "Resumo", "f": "Waite", "p": ["Attraction, love, beauty, trials overcome. Reversed : Failure, foolish designs. Another account speaks of marriage frustrated and contrarieties of all kinds."]}], "busca": "the lovers os enamorados thfc lovers. the sun shines in the zenith, and beneath is a great winged figure with arms extended, pouring down influences. in the foreground are two human figures, male and female, unveiled before each other, as if adam and eve when they first occupied the paradise of the earthly body. behind the man is the tree of life, bearing twelve fruits, and the tree of the knowledge of good and evil is behind the woman; the serpent is twining round it. the figures suggest youth, virginity, innocence and love before it is contaminated by gross material desire. this is in all simplicity the card of human love, here exhibited as part of the way, the truth and the life. it replaces, by recourse to first principles, the old card of marriage, which i have described previously, and the later follies which depicted man between vice and virtue. in a very high sense, the card is a mystery of the covenant and sabbath. the suggestion in respect of the woman is that she signifies that attraction towards the sensitive life which carries within it the idea of the fall of man, but she is rather the working of a secret law of providence than a willing and conscious temptress. it is through her imputed lapse that man shall arise ultimately, and only by her can he complete himself. the card is therefore in its way another intimation concerning the great mystery of womanhood. the old meanings fall to pieces of necessity with the old pictures, but even as interpretations of the latter, some of them were of the order of commonplace and others were false in symbolism. attraction, love, beauty, trials overcome. reversed : failure, foolish designs. another account speaks of marriage frustrated and contrarieties of all kinds. escolha amor união valores atracção integração de opostos um homem e uma mulher, nus, sob um anjo que os observa de cima — adão e eva, num éden que waite lê não como tentação mas como \"mistério da aliança\". é a primeira carta plenamente humana e individualizada do baralho, e a primeira em que a escolha — não apenas o destino — entra em cena. waite descreve-a simplesmente como \"a carta do amor humano\". a árvore da vida atrás do homem e a árvore do conhecimento atrás da mulher (com a serpente enrolada) situam a escolha amorosa dentro, não fora, do mito da queda. o anjo (rafael, nas leituras esotéricas) a abençoar de cima sugere que a união humana participa de algo maior do que a vontade pessoal. em crowley, a carta liga-se a mercúrio e a gémeos: união como síntese de opostos, não apenas atracção. historicamente, versões anteriores a waite mostravam antes uma escolha entre duas figuras femininas — a decisão, mais do que o amor em si, é o tema mais antigo da carta. marca o início da jornada pessoal do \"herói\", em contraste com as figuras arquetípicas que a antecedem no baralho: aqui, pela primeira vez, há uma escolha a fazer, não apenas um poder a receber. nichols lê o triângulo emocional (frequentemente presente nas versões mais antigas da carta) como a matéria-prima necessária de um conflito do qual nasce crescimento — convidando o leitor a escrever o seu próprio cenário para a carta antes de aceitar qualquer interpretação fixa. louis lê-a como hieros gamos, casamento sagrado: a passagem de um amor inconsciente e fundido para um amor consciente, que reconhece o outro como separado de si. a escolha amorosa pode tornar-se rigidez — impor ao outro os próprios termos em vez de negociar com ele. a necessidade de união pode disfarçar dificuldade real em tolerar a diferença ou a autonomia do outro. o medo de escolher mal pode paralisar qualquer decisão. sombra dourada: aceitar em si múltiplas identidades e desejos sem os hierarquizar por medo do julgamento alheio. pode assinalar uma escolha real com consequências — não apenas romântica — entre dois caminhos ou valores. pode trazer à consulta a qualidade de uma relação: até que ponto há espaço, nela, para duas pessoas inteiras. pode convidar a examinar o que está a pesar mais numa decisão: o valor próprio ou a pressão de terceiros. esta escolha, estou a fazê-la a partir do que valorizo, ou a partir do que temo perder? nesta relação, há espaço para sermos dois inteiros, ou só cabemos lá se um se ajustar ao outro? a. e. waite; aleister crowley; sallie nichols; rachel pollack; mariana louis."}, {"id": "the-chariot", "guia": {"palavras": ["vontade", "controlo", "direcção", "vitória", "avanço", "disciplina", "ego"], "essencia": "Um jovem guerreiro conduz um carro puxado por duas esfinges (ou dois cavalos), sem rédeas visíveis. Waite lê-o como \"conquista em todos os planos — na mente, na ciência, no progresso\" — mas é conquista da razão e da vontade, não ainda sabedoria: o Carro, escreve Waite, \"não conseguiu abrir o rolo chamado Tora\" quando confrontado com a Sacerdotisa. É vitória do ego, e o baralho começa aqui a perguntar quanto essa vitória custa.", "simbolismo": ["A ausência de rédeas é central: o condutor não domina os opostos pela força, tem de os alinhar pela vontade e pelo foco.", "As duas esfinges ou cavalos, de cores opostas, representam impulsos contrários — instinto ainda não integrado.", "O dossel estrelado (Crowley liga-o a Câncer) sugere que este avanço, por mais decidido, ainda decorre sob uma abóbada maior do que o próprio condutor.", "Em várias leituras, a armadura sem ferimentos visíveis marca um triunfo que ainda não foi testado pela derrota."], "psicologia": "Pollack compara o Carro à persona junguiana, citando o intérprete Paul Douglas: podemos confundir facilmente esta persona bem-sucedida com o eu verdadeiro, \"ao ponto de recear a sua perda como uma espécie de morte\". Nichols lê o mesmo condutor com mais desconfiança: um jovem rei que se separou do próprio instinto e da própria mortalidade, imaginando-se acima da natureza — sementes de uma queda que só surgirá páginas mais à frente na sequência do baralho (a Torre). A carta interessa-se pela diferença entre vitória verdadeira (foco espiritual unificado) e ego triunfante (mero controlo).", "sombra": ["O foco disciplinado pode tornar-se rigidez, incapaz de se ajustar quando as circunstâncias mudam.", "A confiança na própria vontade pode transformar-se em recusa de pedir ou aceitar ajuda.", "A vitória pode inflacionar o sentido do que se é capaz de controlar, incluindo o incontrolável.", "Sombra dourada: ser prestável, optimista e confiante, sem deixar de estar aberto ao contributo dos outros."], "leitura": ["Pode assinalar um período de avanço decidido, mas convidar a perguntar o que está a ser deixado de fora desse foco.", "Pode apontar para uma vitória real que ainda não foi testada por um obstáculo genuíno.", "Pode levantar a questão de saber se o controlo que se exerce é sobre a direcção, ou sobre tudo à volta."], "pensar": ["Esta vitória é sobre algo real, ou sobre a imagem que quero dar de mim a avançar?", "O que estou a manter sob controlo apertado por recear o que aconteceria se o soltasse?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "The Chariot", "pt": "O Carro", "arcano": "maior", "num": 7, "naipe": null, "img": "07-TheChariot.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["An erect and princely figure carrying a drawn sword and corresponding, broadly speaking, to the traditional description which I have given in the first part. On the shoulders of the victorious hero are supposed to be the Urim and Thummim. He has led captivity captive; he is conquest on all planes— in the mind, in science, in progress, in certain trials of initiation. He has thus replied to the s sphinx, and it is on this account that I have accepted the variation of Eliphas Levi; two sphinxes thus draw his chariot. He is above all things triumph in the mind. It is to be understood for this reason (a) that the question of the sphinx is concerned with a Mystery of Nature and not of the world of Grace, to which the charioteer could offer no answer; (b) that the planes of his conquest are manifest or external and not within himself; (c) that the liberation which he effects may leave himself in the bondage of the logical understanding; (d) that the tests of initiation through which he has passed in triumph are to be understood physically or rationally; and (e) that if he came to the pillars of that Temple between which the High Priestess is seated, he could not open the scroll called Tora, nor if she questioned him could he answer. He is not hereditary royalty and he is not priesthood."]}, {"t": "Resumo", "f": "Waite", "p": ["Succour, providence also war, triumph, presumption, vengeance, trouble. Reversed : Riot, quarrel, dispute, litigation, defeat."]}], "busca": "the chariot o carro an erect and princely figure carrying a drawn sword and corresponding, broadly speaking, to the traditional description which i have given in the first part. on the shoulders of the victorious hero are supposed to be the urim and thummim. he has led captivity captive; he is conquest on all planes— in the mind, in science, in progress, in certain trials of initiation. he has thus replied to the s sphinx, and it is on this account that i have accepted the variation of eliphas levi; two sphinxes thus draw his chariot. he is above all things triumph in the mind. it is to be understood for this reason (a) that the question of the sphinx is concerned with a mystery of nature and not of the world of grace, to which the charioteer could offer no answer; (b) that the planes of his conquest are manifest or external and not within himself; (c) that the liberation which he effects may leave himself in the bondage of the logical understanding; (d) that the tests of initiation through which he has passed in triumph are to be understood physically or rationally; and (e) that if he came to the pillars of that temple between which the high priestess is seated, he could not open the scroll called tora, nor if she questioned him could he answer. he is not hereditary royalty and he is not priesthood. succour, providence also war, triumph, presumption, vengeance, trouble. reversed : riot, quarrel, dispute, litigation, defeat. vontade controlo direcção vitória avanço disciplina ego um jovem guerreiro conduz um carro puxado por duas esfinges (ou dois cavalos), sem rédeas visíveis. waite lê-o como \"conquista em todos os planos — na mente, na ciência, no progresso\" — mas é conquista da razão e da vontade, não ainda sabedoria: o carro, escreve waite, \"não conseguiu abrir o rolo chamado tora\" quando confrontado com a sacerdotisa. é vitória do ego, e o baralho começa aqui a perguntar quanto essa vitória custa. a ausência de rédeas é central: o condutor não domina os opostos pela força, tem de os alinhar pela vontade e pelo foco. as duas esfinges ou cavalos, de cores opostas, representam impulsos contrários — instinto ainda não integrado. o dossel estrelado (crowley liga-o a câncer) sugere que este avanço, por mais decidido, ainda decorre sob uma abóbada maior do que o próprio condutor. em várias leituras, a armadura sem ferimentos visíveis marca um triunfo que ainda não foi testado pela derrota. pollack compara o carro à persona junguiana, citando o intérprete paul douglas: podemos confundir facilmente esta persona bem-sucedida com o eu verdadeiro, \"ao ponto de recear a sua perda como uma espécie de morte\". nichols lê o mesmo condutor com mais desconfiança: um jovem rei que se separou do próprio instinto e da própria mortalidade, imaginando-se acima da natureza — sementes de uma queda que só surgirá páginas mais à frente na sequência do baralho (a torre). a carta interessa-se pela diferença entre vitória verdadeira (foco espiritual unificado) e ego triunfante (mero controlo). o foco disciplinado pode tornar-se rigidez, incapaz de se ajustar quando as circunstâncias mudam. a confiança na própria vontade pode transformar-se em recusa de pedir ou aceitar ajuda. a vitória pode inflacionar o sentido do que se é capaz de controlar, incluindo o incontrolável. sombra dourada: ser prestável, optimista e confiante, sem deixar de estar aberto ao contributo dos outros. pode assinalar um período de avanço decidido, mas convidar a perguntar o que está a ser deixado de fora desse foco. pode apontar para uma vitória real que ainda não foi testada por um obstáculo genuíno. pode levantar a questão de saber se o controlo que se exerce é sobre a direcção, ou sobre tudo à volta. esta vitória é sobre algo real, ou sobre a imagem que quero dar de mim a avançar? o que estou a manter sob controlo apertado por recear o que aconteceria se o soltasse? a. e. waite; aleister crowley; sallie nichols; rachel pollack; mariana louis; shannon knight."}, {"id": "strength-or-fortitude", "guia": {"palavras": ["coragem", "instinto", "compaixão", "resiliência", "domínio interior", "paciência"], "essencia": "Uma mulher, com o símbolo do infinito sobre a cabeça, fecha (ou abre) suavemente as mandíbulas de um leão. Waite chama-lhe \"Fortitude\" e é explícito: não se trata de domar o animal pela força, mas de uma \"confiança cuja força é divina\" — coragem que nasce não de supressão, mas de uma relação madura com o próprio instinto. Waite nota ainda, no seu próprio texto, ter trocado deliberadamente o número desta carta com o da Justiça, alinhando-a com correspondências astrológicas que privilegiava.", "simbolismo": ["A corrente de flores em volta do leão, e não uma corrente de ferro, assinala domínio pela relação, não pela coação.", "O símbolo do infinito, partilhado com o Mago, liga a Força a um poder tão ilimitado quanto o dele — mas orientado para dentro.", "Em Crowley (onde a carta se chama \"Luxúria\" e mantém o número tradicional XI), a figura cavalga o leão em vez de o dominar de pé — força como êxtase partilhado, não vitória sobre um adversário.", "A ambiguidade do gesto das mãos — a abrir ou a fechar a boca do leão — é lida por Nichols como deliberada: o instinto ora precisa de ser libertado, ora contido."], "psicologia": "A Força representa resiliência do ego alcançada não pela dominação do instinto mas pela sua integração — o leão como desejo, raiva ou impulso que se aprende a encontrar com confiança em vez de medo. Louis constrói a sua leitura sobre a imagem de uma santa que baptiza uma leoa em vez de a temer: \"vem e devora-me\", parafraseando Jung sobre encontrar o instinto com amor. Knight liga a sombra desta carta à falta de limites emocionais — a incapacidade de expressar raiva ou de se defender, frequentemente formada por ter sido punida, em criança, por expressar exactamente essas emoções.", "sombra": ["A calma pode tornar-se supressão — evitar sentir ou expressar emoções tidas como \"demasiado\".", "A coragem pode confundir-se com dureza, negando vulnerabilidade em vez de a integrar.", "A paciência com o próprio instinto pode deslizar para permissividade sem limites.", "Sombra dourada: uma calma genuína mesmo no desconforto, que não nega as emoções difíceis mas também não as deixa dominar."], "leitura": ["Pode assinalar a necessidade de enfrentar algo temido — não com força bruta, mas com presença confiante.", "Pode convidar a examinar a relação com a própria raiva ou desejo: reprimidos, ou integrados?", "Pode apontar para uma situação que pede paciência activa, não passividade."], "pensar": ["Costumo encontrar o que sinto com confiança, ou tento primeiro dominá-lo antes de lhe dar espaço?", "Que emoção fui ensinado a temer em mim mesmo antes ainda de a compreender?"], "fontes": "A. E. Waite; Aleister Crowley; C. G. Jung; Sallie Nichols; Mariana Louis; Shannon Knight."}, "nome": "Strength, or Fortitude", "pt": "A Força", "arcano": "maior", "num": 8, "naipe": null, "img": "08-Strength.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A woman, over whose head there broods the same symbol of life which we have seen in the card of the Magician, is closing the jaws of a lion. The only point in which this design differs from the conventional presentations is that her beneficent fortitude has already subdued the lion, which is being led by a chain of flowers. For reasons which satisfy myself, this card has been interchanged with that of justice, which is usually numbered eight. As the variation carries nothing with it which will signify to the reader, there is no cause for explanation. Fortitude, in one of its most exalted aspects, is connected with the Divine Mystery of Union; the virtue, of course, operates in all planes, and hence draws on all in its symbolism. It connects also with innocentia inviolata, and with the strength which resides in contemplation. These higher meanings are, however, matters of inference, and I do not suggest that they are transparent on the surface of the card. They are intimated in a concealed manner by the chain of flowers, which signifies, among many other things, the sweet yoke and the light burden of Divine Law, when it has been taken into the heart of hearts. The card has nothing to do with self- confidence in the ordinary sense, though this has been suggested— but it concerns the confidence of those whose strength is God, who have found their refuge in Him. There is one aspect in which the lion signifies the passions, and she who is called Strength is the higher nature in its liberation. It has walked upon the asp and the basilisk and has trodden down the lion and the dragon."]}, {"t": "Resumo", "f": "Waite", "p": ["Power, energy, action, courage, magnanimity; also complete success and honours. Reversed : Despotism, abuse if power, weakness, discord, sometimes even disgrace."]}], "busca": "strength, or fortitude a força a woman, over whose head there broods the same symbol of life which we have seen in the card of the magician, is closing the jaws of a lion. the only point in which this design differs from the conventional presentations is that her beneficent fortitude has already subdued the lion, which is being led by a chain of flowers. for reasons which satisfy myself, this card has been interchanged with that of justice, which is usually numbered eight. as the variation carries nothing with it which will signify to the reader, there is no cause for explanation. fortitude, in one of its most exalted aspects, is connected with the divine mystery of union; the virtue, of course, operates in all planes, and hence draws on all in its symbolism. it connects also with innocentia inviolata, and with the strength which resides in contemplation. these higher meanings are, however, matters of inference, and i do not suggest that they are transparent on the surface of the card. they are intimated in a concealed manner by the chain of flowers, which signifies, among many other things, the sweet yoke and the light burden of divine law, when it has been taken into the heart of hearts. the card has nothing to do with self- confidence in the ordinary sense, though this has been suggested— but it concerns the confidence of those whose strength is god, who have found their refuge in him. there is one aspect in which the lion signifies the passions, and she who is called strength is the higher nature in its liberation. it has walked upon the asp and the basilisk and has trodden down the lion and the dragon. power, energy, action, courage, magnanimity; also complete success and honours. reversed : despotism, abuse if power, weakness, discord, sometimes even disgrace. coragem instinto compaixão resiliência domínio interior paciência uma mulher, com o símbolo do infinito sobre a cabeça, fecha (ou abre) suavemente as mandíbulas de um leão. waite chama-lhe \"fortitude\" e é explícito: não se trata de domar o animal pela força, mas de uma \"confiança cuja força é divina\" — coragem que nasce não de supressão, mas de uma relação madura com o próprio instinto. waite nota ainda, no seu próprio texto, ter trocado deliberadamente o número desta carta com o da justiça, alinhando-a com correspondências astrológicas que privilegiava. a corrente de flores em volta do leão, e não uma corrente de ferro, assinala domínio pela relação, não pela coação. o símbolo do infinito, partilhado com o mago, liga a força a um poder tão ilimitado quanto o dele — mas orientado para dentro. em crowley (onde a carta se chama \"luxúria\" e mantém o número tradicional xi), a figura cavalga o leão em vez de o dominar de pé — força como êxtase partilhado, não vitória sobre um adversário. a ambiguidade do gesto das mãos — a abrir ou a fechar a boca do leão — é lida por nichols como deliberada: o instinto ora precisa de ser libertado, ora contido. a força representa resiliência do ego alcançada não pela dominação do instinto mas pela sua integração — o leão como desejo, raiva ou impulso que se aprende a encontrar com confiança em vez de medo. louis constrói a sua leitura sobre a imagem de uma santa que baptiza uma leoa em vez de a temer: \"vem e devora-me\", parafraseando jung sobre encontrar o instinto com amor. knight liga a sombra desta carta à falta de limites emocionais — a incapacidade de expressar raiva ou de se defender, frequentemente formada por ter sido punida, em criança, por expressar exactamente essas emoções. a calma pode tornar-se supressão — evitar sentir ou expressar emoções tidas como \"demasiado\". a coragem pode confundir-se com dureza, negando vulnerabilidade em vez de a integrar. a paciência com o próprio instinto pode deslizar para permissividade sem limites. sombra dourada: uma calma genuína mesmo no desconforto, que não nega as emoções difíceis mas também não as deixa dominar. pode assinalar a necessidade de enfrentar algo temido — não com força bruta, mas com presença confiante. pode convidar a examinar a relação com a própria raiva ou desejo: reprimidos, ou integrados? pode apontar para uma situação que pede paciência activa, não passividade. costumo encontrar o que sinto com confiança, ou tento primeiro dominá-lo antes de lhe dar espaço? que emoção fui ensinado a temer em mim mesmo antes ainda de a compreender? a. e. waite; aleister crowley; c. g. jung; sallie nichols; mariana louis; shannon knight."}, {"id": "the-hermit", "guia": {"palavras": ["introspecção", "solidão", "sabedoria", "orientação interior", "retirada", "procura"], "essencia": "Um velho, capa e capuz, ergue uma lanterna com uma estrela dentro, sozinho no cume de uma montanha. Waite chama-lhe \"um cartão de realização\", e insiste — contra leituras ocultistas da sua época — que a luz não é escondida deliberadamente de quem procura: os mistérios protegem-se a si mesmos de quem ainda não está pronto, o Eremita não recusa ninguém. É a forma individual e interiorizada do Velho Sábio, em contraste com a forma institucional do Hierofante.", "simbolismo": ["A lanterna com uma estrela dentro, e não uma chama simples, sugere uma luz já filtrada pela reflexão, não crua.", "O cajado apoia o caminhar solitário — ajuda que não depende de companhia.", "A posição elevada, no cume, marca distância do mundo social sem a negar por completo.", "Em Crowley, a carta liga-se a Virgem e à letra Yod, lida como semente ou princípio criativo secreto, latente antes de germinar."], "psicologia": "O Eremita representa a necessidade de retirada consciente — não fuga, mas um afastamento temporário necessário para ouvir o que só se ouve em silêncio. Pollack faz aqui um ponto explicitamente historicista: os \"sábios velhos\" dominam os sonhos ocidentais não porque o arquétipo seja masculino por natureza, mas por causa de séculos de cultura patriarcal — noutras tradições, a figura-guia foi frequentemente feminina. Nichols avisa contra confundir esta carta com culto de grupo ou veneração de gurus: a luz que oferece só serve enquanto convite a encontrar a própria, não como substituto dela.", "sombra": ["A introspecção pode isolar em vez de esclarecer, tornando-se recusa de qualquer ligação.", "A sabedoria conquistada em solidão pode transformar-se em julgamento de quem não a partilha.", "A procura de orientação interior pode adiar indefinidamente qualquer decisão ou acção.", "Sombra dourada: manter-se firme em meio ao caos, equilibrando solidão e abertura genuína aos outros."], "leitura": ["Pode assinalar a necessidade de um período de retirada ou reflexão antes de agir.", "Pode convidar a examinar se o isolamento actual está a ajudar a clarificar algo, ou apenas a evitar contacto.", "Pode apontar para a procura de um mentor ou guia — interior ou exterior."], "pensar": ["Este afastamento está a ajudar-me a ver com mais clareza, ou é só uma forma confortável de evitar alguém ou algo?", "A quem, ou a que parte de mim, recorro quando preciso de orientação — e porquê essa e não outra?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Shannon Knight."}, "nome": "The Hermit", "pt": "O Eremita", "arcano": "maior", "num": 9, "naipe": null, "img": "09-TheHermit.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The variation from the conventional models in this card is only that the lamp is not enveloped partially in the mantle of its bearer, who blends the idea of the Ancient of Days with the Light of the World It is a star which shines in the lantern. I have said that this is a card of attainment, and to extend this conception the figure is seen holding up his beacon on an eminence. Therefore the Hermit is not, as Court de Gebelin explained, a wise man in search of truth and justice; nor is he, as a later explanation proposes, an especial example of experience. His beacon intimates that \"where I am, you also may be.\" It is further a card which is understood quite incorrectly when it is connected with the idea of occult isolation, as the protection of personal magnetism against admixture. This is one of the frivolous renderings which we owe to Eliphas Levi. It has been adopted by the French Order of Martinism and some of us have heard a great deal of the Silent and Unknown Philosophy enveloped by his mantle from the knowledge of the profane. In true Martinism, the significance of the term Philosophe inconnu was of another order. It did not refer to the intended concealment of the Instituted Mysteries, much less of their substitutes, but— like the card itself— to the truth that the Divine Mysteries secure their own protection from those who are unprepared."]}, {"t": "Resumo", "f": "Waite", "p": ["Prudence, circumspection; also and especially treason, dissimulation, roguery, corruption. Reversed : Concealment, disguise, policy, fear, unreasoned caution."]}], "busca": "the hermit o eremita the variation from the conventional models in this card is only that the lamp is not enveloped partially in the mantle of its bearer, who blends the idea of the ancient of days with the light of the world it is a star which shines in the lantern. i have said that this is a card of attainment, and to extend this conception the figure is seen holding up his beacon on an eminence. therefore the hermit is not, as court de gebelin explained, a wise man in search of truth and justice; nor is he, as a later explanation proposes, an especial example of experience. his beacon intimates that \"where i am, you also may be.\" it is further a card which is understood quite incorrectly when it is connected with the idea of occult isolation, as the protection of personal magnetism against admixture. this is one of the frivolous renderings which we owe to eliphas levi. it has been adopted by the french order of martinism and some of us have heard a great deal of the silent and unknown philosophy enveloped by his mantle from the knowledge of the profane. in true martinism, the significance of the term philosophe inconnu was of another order. it did not refer to the intended concealment of the instituted mysteries, much less of their substitutes, but— like the card itself— to the truth that the divine mysteries secure their own protection from those who are unprepared. prudence, circumspection; also and especially treason, dissimulation, roguery, corruption. reversed : concealment, disguise, policy, fear, unreasoned caution. introspecção solidão sabedoria orientação interior retirada procura um velho, capa e capuz, ergue uma lanterna com uma estrela dentro, sozinho no cume de uma montanha. waite chama-lhe \"um cartão de realização\", e insiste — contra leituras ocultistas da sua época — que a luz não é escondida deliberadamente de quem procura: os mistérios protegem-se a si mesmos de quem ainda não está pronto, o eremita não recusa ninguém. é a forma individual e interiorizada do velho sábio, em contraste com a forma institucional do hierofante. a lanterna com uma estrela dentro, e não uma chama simples, sugere uma luz já filtrada pela reflexão, não crua. o cajado apoia o caminhar solitário — ajuda que não depende de companhia. a posição elevada, no cume, marca distância do mundo social sem a negar por completo. em crowley, a carta liga-se a virgem e à letra yod, lida como semente ou princípio criativo secreto, latente antes de germinar. o eremita representa a necessidade de retirada consciente — não fuga, mas um afastamento temporário necessário para ouvir o que só se ouve em silêncio. pollack faz aqui um ponto explicitamente historicista: os \"sábios velhos\" dominam os sonhos ocidentais não porque o arquétipo seja masculino por natureza, mas por causa de séculos de cultura patriarcal — noutras tradições, a figura-guia foi frequentemente feminina. nichols avisa contra confundir esta carta com culto de grupo ou veneração de gurus: a luz que oferece só serve enquanto convite a encontrar a própria, não como substituto dela. a introspecção pode isolar em vez de esclarecer, tornando-se recusa de qualquer ligação. a sabedoria conquistada em solidão pode transformar-se em julgamento de quem não a partilha. a procura de orientação interior pode adiar indefinidamente qualquer decisão ou acção. sombra dourada: manter-se firme em meio ao caos, equilibrando solidão e abertura genuína aos outros. pode assinalar a necessidade de um período de retirada ou reflexão antes de agir. pode convidar a examinar se o isolamento actual está a ajudar a clarificar algo, ou apenas a evitar contacto. pode apontar para a procura de um mentor ou guia — interior ou exterior. este afastamento está a ajudar-me a ver com mais clareza, ou é só uma forma confortável de evitar alguém ou algo? a quem, ou a que parte de mim, recorro quando preciso de orientação — e porquê essa e não outra? a. e. waite; aleister crowley; sallie nichols; rachel pollack; shannon knight."}, {"id": "wheel-of-fortune", "guia": {"palavras": ["ciclos", "destino", "mudança", "causalidade", "sorte", "viragem"], "essencia": "Uma roda gira, com uma esfinge no topo e figuras — Ezequiel, alquímicas ou mitológicas, consoante o baralho — a subir e a descer as suas margens. Waite lê a carta não como sorte no sentido comum, mas como \"a negação do acaso e da fatalidade nele implícita\": um convite a olhar para o padrão, não apenas para o resultado. É a carta que introduz, de forma simbólica e ainda velada, uma primeira avaliação de para onde a vida de alguém tem ido.", "simbolismo": ["A esfinge imóvel no topo, em contraste com a roda em movimento, distingue o que muda do que observa a mudança.", "As figuras nas margens da roda (subindo, no topo, descendo, em baixo) mostram um ciclo completo, não um só momento de sorte ou azar.", "As letras TARO/ROTA em torno da roda, e o
