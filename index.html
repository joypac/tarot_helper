lação, mas a condição que a torna possível. estar aberto é uma posição vulnerável e nem sempre voluntária. há períodos em que a pessoa sente tudo com uma intensidade que não escolheu, e outros em que a abertura é decidida como quem baixa uma defesa antiga. a sombra é o transbordo sem destinatário: emoção que se derrama em qualquer direcção e que, por não distinguir, acaba por não ligar a ninguém. pode assinalar o início de algo afectivo, ainda sem forma. pode trazer temas de receptividade e de disponibilidade para sentir. pode levantar a questão do que se faz com aquilo que se sente. isto que sinto está dirigido a alguém, ou é sobretudo meu? o que me custa mais: sentir, ou deixar que se saiba que sinto? a. e. waite; estrutura tradicional dos naipes."}, {"id": "two-of-cups", "guia": {"palavras": ["reciprocidade", "vínculo", "reconhecimento mútuo", "acordo", "atracção"], "essencia": "Dois que se reconhecem e trocam alguma coisa em condições de igualdade. Waite associa a carta a amor, amizade, afinidade e concórdia. O essencial é a reciprocidade: não é atracção de um lado, é um encontro em que ambos oferecem e ambos recebem.", "psicologia_sombra": "A reciprocidade é mais rara do que a linguagem sugere. Muitas ligações que se descrevem como mútuas assentam num desequilíbrio estável que convém aos dois lados por razões diferentes. A sombra desta carta é a fusão: quando o reconhecimento do outro se torna a única fonte de identidade, e a diferença entre as duas pessoas passa a ser vivida como ameaça em vez de condição.", "leitura": ["Pode representar um vínculo, acordo ou reconhecimento entre duas partes.", "Pode trazer a questão do equilíbrio real da troca.", "Pode levantar temas de proximidade e do espaço que sobra dentro dela."], "pensar": ["Nesta relação, o que dou e o que recebo têm o mesmo peso?", "Consigo discordar sem sentir que estou a pôr o vínculo em risco?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Two of Cups", "pt": "Dois de Copas", "arcano": "menor", "num": 2, "naipe": "Copas", "img": "Cups02.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A youth and maiden are pledging one another, and above their cups rises the Caduceus of Hermes, between the great wings of which there appears a lion's head. It is a variant of a sign which is found in a few old examples of this card. Some curious emblematical meanings are attached to it, but they do not concern us in this place."]}, {"t": "Significados", "f": "Waite", "p": ["Love, passion, friendship, affinity, union, concord, sympathy, the interrelation of the sexes, and— as a suggestion apart from all offices of divination- that desire which is not in Nature, but by which Nature is sanctified."]}], "busca": "two of cups dois de copas a youth and maiden are pledging one another, and above their cups rises the caduceus of hermes, between the great wings of which there appears a lion's head. it is a variant of a sign which is found in a few old examples of this card. some curious emblematical meanings are attached to it, but they do not concern us in this place. love, passion, friendship, affinity, union, concord, sympathy, the interrelation of the sexes, and— as a suggestion apart from all offices of divination- that desire which is not in nature, but by which nature is sanctified. reciprocidade vínculo reconhecimento mútuo acordo atracção dois que se reconhecem e trocam alguma coisa em condições de igualdade. waite associa a carta a amor, amizade, afinidade e concórdia. o essencial é a reciprocidade: não é atracção de um lado, é um encontro em que ambos oferecem e ambos recebem. a reciprocidade é mais rara do que a linguagem sugere. muitas ligações que se descrevem como mútuas assentam num desequilíbrio estável que convém aos dois lados por razões diferentes. a sombra desta carta é a fusão: quando o reconhecimento do outro se torna a única fonte de identidade, e a diferença entre as duas pessoas passa a ser vivida como ameaça em vez de condição. pode representar um vínculo, acordo ou reconhecimento entre duas partes. pode trazer a questão do equilíbrio real da troca. pode levantar temas de proximidade e do espaço que sobra dentro dela. nesta relação, o que dou e o que recebo têm o mesmo peso? consigo discordar sem sentir que estou a pôr o vínculo em risco? a. e. waite; estrutura tradicional dos naipes."}, {"id": "three-of-cups", "guia": {"palavras": ["amizade", "celebração", "comunidade", "partilha", "conclusão feliz"], "essencia": "Alegria que existe por ser partilhada. Waite fala de conclusão de um assunto, abundância e regozijo. Ao contrário do Dois, aqui a ligação é de grupo — a experiência não se completa dentro de uma relação, mas entre várias pessoas.", "psicologia_sombra": "Pertencer a um grupo resolve muita coisa e cobra outra. A pressão para manter o tom colectivo pode tornar impossível trazer o que destoa, e há celebrações que funcionam sobretudo como acordo tácito de não falar do que está mal. A sombra é a sociabilidade como evitamento: companhia constante que impede qualquer conversa que exigisse estar só com alguém.", "leitura": ["Pode assinalar convívio, apoio de grupo ou um motivo partilhado de alegria.", "Pode trazer temas de amizade e do lugar que se ocupa entre outros.", "Pode levantar a questão do que não cabe na alegria colectiva."], "pensar": ["Neste grupo, o que é que eu não posso dizer?", "Estou acompanhado, ou apenas rodeado?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Three of Cups", "pt": "Três de Copas", "arcano": "menor", "num": 3, "naipe": "Copas", "img": "Cups03.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Maidens in a garden-ground with cups uplifted, as if pledging one another."]}, {"t": "Significados", "f": "Waite", "p": ["The conclusion of any matter in plenty, perfection and merriment; happy issue, victory, fulfilment, solace, healing,"]}, {"t": "Invertida", "f": "Waite", "p": ["Expedition, dispatch, achievement, end. It signifies also the side of excess in physical enjoyment, and the pleasures of the senses."]}], "busca": "three of cups três de copas maidens in a garden-ground with cups uplifted, as if pledging one another. the conclusion of any matter in plenty, perfection and merriment; happy issue, victory, fulfilment, solace, healing, expedition, dispatch, achievement, end. it signifies also the side of excess in physical enjoyment, and the pleasures of the senses. amizade celebração comunidade partilha conclusão feliz alegria que existe por ser partilhada. waite fala de conclusão de um assunto, abundância e regozijo. ao contrário do dois, aqui a ligação é de grupo — a experiência não se completa dentro de uma relação, mas entre várias pessoas. pertencer a um grupo resolve muita coisa e cobra outra. a pressão para manter o tom colectivo pode tornar impossível trazer o que destoa, e há celebrações que funcionam sobretudo como acordo tácito de não falar do que está mal. a sombra é a sociabilidade como evitamento: companhia constante que impede qualquer conversa que exigisse estar só com alguém. pode assinalar convívio, apoio de grupo ou um motivo partilhado de alegria. pode trazer temas de amizade e do lugar que se ocupa entre outros. pode levantar a questão do que não cabe na alegria colectiva. neste grupo, o que é que eu não posso dizer? estou acompanhado, ou apenas rodeado? a. e. waite; estrutura tradicional dos naipes."}, {"id": "four-of-cups", "guia": {"palavras": ["apatia", "saciedade", "desinteresse", "introspecção", "recusa"], "essencia": "Oferece-se alguma coisa e a pessoa não olha. Waite fala de fastio, aversão e contrariedades imaginárias, misturadas com prazer. A figura tem três taças à frente e uma quarta a ser-lhe estendida, e o problema não é a falta de oferta — é a incapacidade de a registar.", "psicologia_sombra": "O desinteresse é frequentemente uma defesa. Quem espera pouco não é desiludido, e a apatia pode ser a forma mais eficaz de não arriscar nada. Também pode ser sinal legítimo de que algo já não serve. A sombra é a recusa automática, quando dizer que não deixou de ser escolha e passou a ser reflexo, e a pessoa já não distingue o que rejeita do que simplesmente não vê.", "leitura": ["Pode representar desinteresse por algo que outros considerariam bom.", "Pode trazer temas de retraimento e de olhar voltado para dentro.", "Pode levantar a questão do que está a ser oferecido e não é visto."], "pensar": ["O que é que me está a ser oferecido e eu não estou a olhar?", "Este desinteresse protege-me de quê?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Four of Cups", "pt": "Quatro de Copas", "arcano": "menor", "num": 4, "naipe": "Copas", "img": "Cups04.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A young man is seated under a tree and contemplates three cups set on the grass before him; an arm issuing from a cloud offers him another cup. His expression notwithstanding is one of discontent with his environment."]}, {"t": "Significados", "f": "Waite", "p": ["Weariness, disgust, aversion, imaginary vexations, as if the wine of this world had caused satiety only; another wine, as if a fairy gift, is now offered the wastrel, but he sees no consolation therein. This is also a card of blended pleasure."]}, {"t": "Invertida", "f": "Waite", "p": ["Novelty, presage, new instruction, new relations."]}], "busca": "four of cups quatro de copas a young man is seated under a tree and contemplates three cups set on the grass before him; an arm issuing from a cloud offers him another cup. his expression notwithstanding is one of discontent with his environment. weariness, disgust, aversion, imaginary vexations, as if the wine of this world had caused satiety only; another wine, as if a fairy gift, is now offered the wastrel, but he sees no consolation therein. this is also a card of blended pleasure. novelty, presage, new instruction, new relations. apatia saciedade desinteresse introspecção recusa oferece-se alguma coisa e a pessoa não olha. waite fala de fastio, aversão e contrariedades imaginárias, misturadas com prazer. a figura tem três taças à frente e uma quarta a ser-lhe estendida, e o problema não é a falta de oferta — é a incapacidade de a registar. o desinteresse é frequentemente uma defesa. quem espera pouco não é desiludido, e a apatia pode ser a forma mais eficaz de não arriscar nada. também pode ser sinal legítimo de que algo já não serve. a sombra é a recusa automática, quando dizer que não deixou de ser escolha e passou a ser reflexo, e a pessoa já não distingue o que rejeita do que simplesmente não vê. pode representar desinteresse por algo que outros considerariam bom. pode trazer temas de retraimento e de olhar voltado para dentro. pode levantar a questão do que está a ser oferecido e não é visto. o que é que me está a ser oferecido e eu não estou a olhar? este desinteresse protege-me de quê? a. e. waite; estrutura tradicional dos naipes."}, {"id": "five-of-cups", "guia": {"palavras": ["perda", "luto", "arrependimento", "foco no que caiu", "atenção selectiva"], "essencia": "Três taças entornadas à frente e duas de pé atrás. Waite fala de perda no prazer e de herança que não corresponde ao esperado. A carta não nega a perda: mostra que a atenção está inteiramente voltada para ela, e que o que resta continua fora do campo de visão.", "psicologia_sombra": "O luto tem um tempo próprio que não se pode encurtar por decisão. Mas há uma diferença entre atravessar uma perda e organizar-se permanentemente à volta dela — quando a mágoa passa a ser o lugar mais conhecido, sair dele parece uma traição ao que se perdeu. A sombra desta carta é a identidade construída sobre o que faltou.", "leitura": ["Pode assinalar uma perda real e o processo de a atravessar.", "Pode trazer a questão do que permanece e não está a ser contado.", "Pode levantar temas de arrependimento e de atenção selectiva."], "pensar": ["O que é que ainda está de pé atrás de mim?", "Quem seria eu sem esta perda como referência?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Five of Cups", "pt": "Cinco de Copas", "arcano": "menor", "num": 5, "naipe": "Copas", "img": "Cups05.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A dark, cloaked figure, looking sideways at three prone cups two others stand upright behind him; a bridge is in the background, leading to a small keep or holding. Divanatory Meanings: It is a card of loss, but something remains over; three have been taken, but two are left; it is a card of inheritance, patrimony, transmission, but not corresponding to expectations; with some interpreters it is a card of marriage, but not without bitterness or frustration."]}, {"t": "Invertida", "f": "Waite", "p": ["News, alliances, affinity, consanguinity, ancestry, return, false projects."]}], "busca": "five of cups cinco de copas a dark, cloaked figure, looking sideways at three prone cups two others stand upright behind him; a bridge is in the background, leading to a small keep or holding. divanatory meanings: it is a card of loss, but something remains over; three have been taken, but two are left; it is a card of inheritance, patrimony, transmission, but not corresponding to expectations; with some interpreters it is a card of marriage, but not without bitterness or frustration. news, alliances, affinity, consanguinity, ancestry, return, false projects. perda luto arrependimento foco no que caiu atenção selectiva três taças entornadas à frente e duas de pé atrás. waite fala de perda no prazer e de herança que não corresponde ao esperado. a carta não nega a perda: mostra que a atenção está inteiramente voltada para ela, e que o que resta continua fora do campo de visão. o luto tem um tempo próprio que não se pode encurtar por decisão. mas há uma diferença entre atravessar uma perda e organizar-se permanentemente à volta dela — quando a mágoa passa a ser o lugar mais conhecido, sair dele parece uma traição ao que se perdeu. a sombra desta carta é a identidade construída sobre o que faltou. pode assinalar uma perda real e o processo de a atravessar. pode trazer a questão do que permanece e não está a ser contado. pode levantar temas de arrependimento e de atenção selectiva. o que é que ainda está de pé atrás de mim? quem seria eu sem esta perda como referência? a. e. waite; estrutura tradicional dos naipes."}, {"id": "six-of-cups", "guia": {"palavras": ["memória", "infância", "nostalgia", "reencontro", "inocência"], "essencia": "O passado a visitar o presente. Waite associa a carta a felicidade e prazer vindos do que desapareceu, e também a novas relações e ambientes. A ternura da imagem é real, mas o material é sempre memória — algo que já não está a acontecer.", "psicologia_sombra": "A memória não é um registo, é uma reconstrução ao serviço do presente. Lembrar um período como simples e bom diz frequentemente mais sobre a complexidade actual do que sobre esse tempo. A sombra é a nostalgia que impede: um passado idealizado com que nenhuma situação presente consegue competir, e que serve para justificar não investir em nada de novo.", "leitura": ["Pode assinalar memória, reencontro ou influência do passado.", "Pode trazer temas de infância e do que dela permanece activo.", "Pode levantar a questão de se a memória alimenta ou substitui."], "pensar": ["Esta memória é onde eu descanso, ou onde eu me escondo?", "Que parte daquele tempo estou a deixar de fora quando o recordo?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Six of Cups", "pt": "Seis de Copas", "arcano": "menor", "num": 6, "naipe": "Copas", "img": "Cups06.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Children in an old garden, their cups filled with flowers."]}, {"t": "Significados", "f": "Waite", "p": ["A card of the past and of memories, looking back, as— for example— on childhood; happiness, enjoyment, but coming rather from the past; things that have vanished. Another reading reverses this, giving new relations, new knowledge, new environment, and then the children are disporting in an unfamiliar precinct. Reversed l: The future, renewal, that which will come to pass presently."]}], "busca": "six of cups seis de copas children in an old garden, their cups filled with flowers. a card of the past and of memories, looking back, as— for example— on childhood; happiness, enjoyment, but coming rather from the past; things that have vanished. another reading reverses this, giving new relations, new knowledge, new environment, and then the children are disporting in an unfamiliar precinct. reversed l: the future, renewal, that which will come to pass presently. memória infância nostalgia reencontro inocência o passado a visitar o presente. waite associa a carta a felicidade e prazer vindos do que desapareceu, e também a novas relações e ambientes. a ternura da imagem é real, mas o material é sempre memória — algo que já não está a acontecer. a memória não é um registo, é uma reconstrução ao serviço do presente. lembrar um período como simples e bom diz frequentemente mais sobre a complexidade actual do que sobre esse tempo. a sombra é a nostalgia que impede: um passado idealizado com que nenhuma situação presente consegue competir, e que serve para justificar não investir em nada de novo. pode assinalar memória, reencontro ou influência do passado. pode trazer temas de infância e do que dela permanece activo. pode levantar a questão de se a memória alimenta ou substitui. esta memória é onde eu descanso, ou onde eu me escondo? que parte daquele tempo estou a deixar de fora quando o recordo? a. e. waite; estrutura tradicional dos naipes."}, {"id": "seven-of-cups", "guia": {"palavras": ["fantasia", "opções", "ilusão", "indecisão", "projecção"], "essencia": "Sete taças em nuvens, cada uma com uma visão diferente. Waite fala de favores ilusórios, imagens de reflexão e coisas vistas no espelho da contemplação. As possibilidades são muitas e nenhuma foi ainda submetida à realidade.", "psicologia_sombra": "Imaginar cenários é uma capacidade útil e um refúgio confortável. Enquanto tudo é possível, nada tem de ser tentado e nada pode falhar — a fantasia protege da mediania de qualquer escolha concreta. A sombra é a proliferação de opções como forma de adiamento, e a projecção: encontrar nas taças aquilo que se deseja, sem verificar se está lá.", "leitura": ["Pode representar excesso de possibilidades e dificuldade em escolher.", "Pode trazer temas de imaginação, desejo projectado e ilusão.", "Pode levantar a questão de quais das opções existem mesmo."], "pensar": ["Destas hipóteses todas, quantas são reais e quantas são desejo?", "O que teria de perder se escolhesse uma?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Seven of Cups", "pt": "Sete de Copas", "arcano": "menor", "num": 7, "naipe": "Copas", "img": "Cups07.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Strange chalices of vision, but the images are more especially those of the fantastic spirit."]}, {"t": "Significados", "f": "Waite", "p": ["Fairy favours, images of reflection, sentiment, imagination, things seen in the glass of contemplation; some attainment in these degrees, but nothing permanent or substantial is suggested."]}, {"t": "Invertida", "f": "Waite", "p": ["Desire, will, determination, project."]}], "busca": "seven of cups sete de copas strange chalices of vision, but the images are more especially those of the fantastic spirit. fairy favours, images of reflection, sentiment, imagination, things seen in the glass of contemplation; some attainment in these degrees, but nothing permanent or substantial is suggested. desire, will, determination, project. fantasia opções ilusão indecisão projecção sete taças em nuvens, cada uma com uma visão diferente. waite fala de favores ilusórios, imagens de reflexão e coisas vistas no espelho da contemplação. as possibilidades são muitas e nenhuma foi ainda submetida à realidade. imaginar cenários é uma capacidade útil e um refúgio confortável. enquanto tudo é possível, nada tem de ser tentado e nada pode falhar — a fantasia protege da mediania de qualquer escolha concreta. a sombra é a proliferação de opções como forma de adiamento, e a projecção: encontrar nas taças aquilo que se deseja, sem verificar se está lá. pode representar excesso de possibilidades e dificuldade em escolher. pode trazer temas de imaginação, desejo projectado e ilusão. pode levantar a questão de quais das opções existem mesmo. destas hipóteses todas, quantas são reais e quantas são desejo? o que teria de perder se escolhesse uma? a. e. waite; estrutura tradicional dos naipes."}, {"id": "eight-of-cups", "guia": {"palavras": ["partida voluntária", "procura", "abandono", "insatisfação", "coragem"], "essencia": "Alguém que deixa para trás algo que estava construído. Waite fala do declínio de um assunto e de viajar de lugar em lugar, abandonando o sucesso. É a decisão de sair quando nada obriga a sair — o que a torna mais difícil e mais deliberada do que uma ruptura imposta.", "psicologia_sombra": "Sair de uma situação que funciona exige reconhecer um desalinhamento que não tem provas externas. É frequentemente incompreendido por quem está de fora, e por vezes pela própria pessoa. A sombra é a partida como padrão: quem sai sempre no mesmo ponto, quando a novidade acaba e começaria o trabalho, e chama procura ao que é incapacidade de permanecer.", "leitura": ["Pode assinalar o afastamento voluntário de algo aparentemente bom.", "Pode trazer temas de procura de sentido para lá do que está garantido.", "Pode levantar a questão de se é a primeira vez que se sai assim."], "pensar": ["Estou a sair porque isto acabou, ou porque começou a exigir?", "Já saí antes deste mesmo ponto?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Eight of Cups", "pt": "Oito de Copas", "arcano": "menor", "num": 8, "naipe": "Copas", "img": "Cups08.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A man of dejected aspect is deserting the cups of his felicity, enterprise, undertaking or previous concern."]}, {"t": "Significados", "f": "Waite", "p": ["The card speaks for itself on the surface, but other readings are entirely antithetical— giving joy, mildness, timidity, honour, modesty. In practice, it is usually found that the card shews the decline of a matter, or that a matter which has been thought to be important is really of slight consequence— either for good or evil."]}, {"t": "Invertida", "f": "Waite", "p": ["Great joy, happiness, feasting."]}], "busca": "eight of cups oito de copas a man of dejected aspect is deserting the cups of his felicity, enterprise, undertaking or previous concern. the card speaks for itself on the surface, but other readings are entirely antithetical— giving joy, mildness, timidity, honour, modesty. in practice, it is usually found that the card shews the decline of a matter, or that a matter which has been thought to be important is really of slight consequence— either for good or evil. great joy, happiness, feasting. partida voluntária procura abandono insatisfação coragem alguém que deixa para trás algo que estava construído. waite fala do declínio de um assunto e de viajar de lugar em lugar, abandonando o sucesso. é a decisão de sair quando nada obriga a sair — o que a torna mais difícil e mais deliberada do que uma ruptura imposta. sair de uma situação que funciona exige reconhecer um desalinhamento que não tem provas externas. é frequentemente incompreendido por quem está de fora, e por vezes pela própria pessoa. a sombra é a partida como padrão: quem sai sempre no mesmo ponto, quando a novidade acaba e começaria o trabalho, e chama procura ao que é incapacidade de permanecer. pode assinalar o afastamento voluntário de algo aparentemente bom. pode trazer temas de procura de sentido para lá do que está garantido. pode levantar a questão de se é a primeira vez que se sai assim. estou a sair porque isto acabou, ou porque começou a exigir? já saí antes deste mesmo ponto? a. e. waite; estrutura tradicional dos naipes."}, {"id": "nine-of-cups", "guia": {"palavras": ["satisfação", "desejo cumprido", "conforto", "bem-estar", "contentamento"], "essencia": "O que se queria, conseguido. Waite fala de concórdia, contentamento e bem-estar físico; a tradição chama-lhe a carta do desejo realizado. A figura está satisfeita e as taças estão alinhadas atrás dela, exibidas.", "psicologia_sombra": "Obter o que se desejava produz frequentemente menos do que se esperava, e essa discrepância é uma das experiências mais silenciosamente perturbadoras que há. A sombra desta carta é a satisfação que se esgota no que se pode mostrar — conforto genuíno mas voltado para fora, e um contentamento que não resiste ao momento em que ninguém está a ver.", "leitura": ["Pode assinalar satisfação, um desejo cumprido ou um período de conforto.", "Pode trazer a questão da distância entre o desejado e o obtido.", "Pode levantar temas de prazer próprio e de exibição."], "pensar": ["Isto que consegui era mesmo o que eu queria?", "Este contentamento aguenta-se sem público?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Nine of Cups", "pt": "Nove de Copas", "arcano": "menor", "num": 9, "naipe": "Copas", "img": "Cups09.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A goodly personage has feasted to his heart's content, and abundant refreshment of wine is on the arched counter behind him, seeming to indicate that the future is also assured. The picture offers the material side only, but there are other aspects."]}, {"t": "Significados", "f": "Waite", "p": ["Concord, contentment, physical bien-etre\\ also victory, success, advantage; satisfaction for the Querent or person for whom the consultation is made."]}, {"t": "Invertida", "f": "Waite", "p": ["Truth, loyalty, liberty; but the readings vary and include mistakes, imperfections, etc."]}], "busca": "nine of cups nove de copas a goodly personage has feasted to his heart's content, and abundant refreshment of wine is on the arched counter behind him, seeming to indicate that the future is also assured. the picture offers the material side only, but there are other aspects. concord, contentment, physical bien-etre\\ also victory, success, advantage; satisfaction for the querent or person for whom the consultation is made. truth, loyalty, liberty; but the readings vary and include mistakes, imperfections, etc. satisfação desejo cumprido conforto bem-estar contentamento o que se queria, conseguido. waite fala de concórdia, contentamento e bem-estar físico; a tradição chama-lhe a carta do desejo realizado. a figura está satisfeita e as taças estão alinhadas atrás dela, exibidas. obter o que se desejava produz frequentemente menos do que se esperava, e essa discrepância é uma das experiências mais silenciosamente perturbadoras que há. a sombra desta carta é a satisfação que se esgota no que se pode mostrar — conforto genuíno mas voltado para fora, e um contentamento que não resiste ao momento em que ninguém está a ver. pode assinalar satisfação, um desejo cumprido ou um período de conforto. pode trazer a questão da distância entre o desejado e o obtido. pode levantar temas de prazer próprio e de exibição. isto que consegui era mesmo o que eu queria? este contentamento aguenta-se sem público? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ten-of-cups", "guia": {"palavras": ["plenitude afectiva", "família", "harmonia", "pertença", "conclusão"], "essencia": "A realização do princípio das Copas em forma duradoura. Waite fala de contentamento e repouso do coração inteiro, perfeição do amor e da amizade. É a imagem de um vínculo estabelecido, com o arco-íris ao fundo — algo que se manteve tempo suficiente para se ter tornado um lugar.", "psicologia_sombra": "As imagens de harmonia completa têm um efeito ambíguo: consolam e também estabelecem uma medida contra a qual quase tudo fica a perder. A sombra desta carta é o ideal como instrumento de descontentamento — a família ou a relação que existe, comparada permanentemente com a que deveria ser, e desvalorizada por não coincidir com a imagem.", "leitura": ["Pode representar harmonia afectiva ou um vínculo consolidado.", "Pode trazer temas de família, pertença e continuidade.", "Pode levantar a questão da distância entre a imagem e o que existe."], "pensar": ["Estou a viver esta relação, ou a compará-la com uma ideia dela?", "O que é que a harmonia aqui está a custar a alguém?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ten of Cups", "pt": "Dez de Copas", "arcano": "menor", "num": 10, "naipe": "Copas", "img": "Cups10.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Appearance of Cups in a rainbow; it is contemplated in wonder and ecstacy by a man and woman below, evidently husband and wife. His right arm is about her; his left is raised upward; she raises her right arm. The two children dancing near them have not observed the prodigy but are happy after their own manner. There is a home-scene beyond."]}, {"t": "Significados", "f": "Waite", "p": ["Contentment, repose of the entire heart; the perfection of that state; also perfection of human love and friendship; if with several picture-cards, a person who is taking charge of the Querent's interests; also the town, village or country inhabited by the Querent."]}, {"t": "Invertida", "f": "Waite", "p": ["Repose of the false heart, indignation, violence."]}], "busca": "ten of cups dez de copas appearance of cups in a rainbow; it is contemplated in wonder and ecstacy by a man and woman below, evidently husband and wife. his right arm is about her; his left is raised upward; she raises her right arm. the two children dancing near them have not observed the prodigy but are happy after their own manner. there is a home-scene beyond. contentment, repose of the entire heart; the perfection of that state; also perfection of human love and friendship; if with several picture-cards, a person who is taking charge of the querent's interests; also the town, village or country inhabited by the querent. repose of the false heart, indignation, violence. plenitude afectiva família harmonia pertença conclusão a realização do princípio das copas em forma duradoura. waite fala de contentamento e repouso do coração inteiro, perfeição do amor e da amizade. é a imagem de um vínculo estabelecido, com o arco-íris ao fundo — algo que se manteve tempo suficiente para se ter tornado um lugar. as imagens de harmonia completa têm um efeito ambíguo: consolam e também estabelecem uma medida contra a qual quase tudo fica a perder. a sombra desta carta é o ideal como instrumento de descontentamento — a família ou a relação que existe, comparada permanentemente com a que deveria ser, e desvalorizada por não coincidir com a imagem. pode representar harmonia afectiva ou um vínculo consolidado. pode trazer temas de família, pertença e continuidade. pode levantar a questão da distância entre a imagem e o que existe. estou a viver esta relação, ou a compará-la com uma ideia dela? o que é que a harmonia aqui está a custar a alguém? a. e. waite; estrutura tradicional dos naipes."}, {"id": "page-of-cups", "guia": {"palavras": ["sensibilidade", "mensagem afectiva", "imaginação", "estudo", "reflexão"], "essencia": "Alguém no início de uma relação com a própria vida emocional. Waite associa-o a um jovem estudioso, a notícias, mensagens e meditação — e a imagem tem um peixe a sair da taça, algo inesperado vindo de dentro. É a sensibilidade ainda sem prática.", "psicologia_sombra": "Sentir muito não é o mesmo que compreender o que se sente. Nesta fase, a emoção chega com força e sem categorias, e é frequentemente atribuída ao exterior por não haver ainda linguagem para a situar dentro. A sombra é a sensibilidade como identidade: sentir intensamente transformado em qualidade em si, sem o trabalho de a tornar inteligível.", "leitura": ["Pode assinalar o começo de algo afectivo ou criativo.", "Pode trazer mensagens, intuições ou material vindo de dentro.", "Pode levantar temas de sensibilidade ainda por educar."], "pensar": ["O que é que isto que sinto me está a dizer, se eu parar para o ouvir?", "Isto vem de fora ou vem de mim?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Page of Cups", "pt": "Valete de Copas", "arcano": "menor", "num": 11, "naipe": "Copas", "img": "Cups11.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["PACE dj CUP 5, A fair, pleasing, somewhat effeminate page, of studious and intent aspect, contemplates a fish rising from a cup to look at him. It is the pictures of the mind taking form."]}, {"t": "Significados", "f": "Waite", "p": ["Fair young man, one impelled to render service and with whom the Querent will be connected; a studious youth; news, message; application, reflection, meditation; also these things directed to business."]}, {"t": "Invertida", "f": "Waite", "p": ["Taste, inclination, attachment, seduction, deception, artifice."]}], "busca": "page of cups valete de copas pace dj cup 5, a fair, pleasing, somewhat effeminate page, of studious and intent aspect, contemplates a fish rising from a cup to look at him. it is the pictures of the mind taking form. fair young man, one impelled to render service and with whom the querent will be connected; a studious youth; news, message; application, reflection, meditation; also these things directed to business. taste, inclination, attachment, seduction, deception, artifice. sensibilidade mensagem afectiva imaginação estudo reflexão alguém no início de uma relação com a própria vida emocional. waite associa-o a um jovem estudioso, a notícias, mensagens e meditação — e a imagem tem um peixe a sair da taça, algo inesperado vindo de dentro. é a sensibilidade ainda sem prática. sentir muito não é o mesmo que compreender o que se sente. nesta fase, a emoção chega com força e sem categorias, e é frequentemente atribuída ao exterior por não haver ainda linguagem para a situar dentro. a sombra é a sensibilidade como identidade: sentir intensamente transformado em qualidade em si, sem o trabalho de a tornar inteligível. pode assinalar o começo de algo afectivo ou criativo. pode trazer mensagens, intuições ou material vindo de dentro. pode levantar temas de sensibilidade ainda por educar. o que é que isto que sinto me está a dizer, se eu parar para o ouvir? isto vem de fora ou vem de mim? a. e. waite; estrutura tradicional dos naipes."}, {"id": "knight-of-cups", "guia": {"palavras": ["proposta", "convite", "idealismo", "romantismo", "aproximação"], "essencia": "Alguém que se aproxima com uma oferta. Waite fala de chegada, aproximação, propostas e convite. Ao contrário dos outros Cavaleiros, este avança devagar — o movimento das Copas é de aproximação, não de investida.", "psicologia_sombra": "O idealismo torna alguém capaz de oferecer muito e pouco fiável no que se segue. A energia está na aproximação, e é frequente que se esgote assim que a relação passa a exigir presença em vez de gesto. A sombra é a proposta bonita sem sustentação — e, do lado de quem recebe, a tentação de responder à imagem que é apresentada em vez de à pessoa.", "leitura": ["Pode assinalar uma proposta, convite ou aproximação afectiva.", "Pode trazer temas de idealização, própria ou de outrem.", "Pode levantar a questão do que acontece depois do gesto inicial."], "pensar": ["Estou a responder a esta pessoa ou à ideia que faço dela?", "Esta oferta tem seguimento previsto, ou esgota-se em ser feita?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Knight of Cups", "pt": "Cavaleiro de Copas", "arcano": "menor", "num": 12, "naipe": "Copas", "img": "Cups12.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Graceful, but not warlike; riding quietly, wearing a winged helmet, referring to those higher graces of the imagination which sometimes characterize this card. He too is a dreamer, but the images of the side of sense haunt him in his vision."]}, {"t": "Significados", "f": "Waite", "p": ["Arrival, approach— sometimes that of a messenger; advances, proposition, demeanour, invitation, incitement."]}, {"t": "Invertida", "f": "Waite", "p": ["Trickery, artifice, subtlety, swindling, duplicity, fraud."]}], "busca": "knight of cups cavaleiro de copas graceful, but not warlike; riding quietly, wearing a winged helmet, referring to those higher graces of the imagination which sometimes characterize this card. he too is a dreamer, but the images of the side of sense haunt him in his vision. arrival, approach— sometimes that of a messenger; advances, proposition, demeanour, invitation, incitement. trickery, artifice, subtlety, swindling, duplicity, fraud. proposta convite idealismo romantismo aproximação alguém que se aproxima com uma oferta. waite fala de chegada, aproximação, propostas e convite. ao contrário dos outros cavaleiros, este avança devagar — o movimento das copas é de aproximação, não de investida. o idealismo torna alguém capaz de oferecer muito e pouco fiável no que se segue. a energia está na aproximação, e é frequente que se esgote assim que a relação passa a exigir presença em vez de gesto. a sombra é a proposta bonita sem sustentação — e, do lado de quem recebe, a tentação de responder à imagem que é apresentada em vez de à pessoa. pode assinalar uma proposta, convite ou aproximação afectiva. pode trazer temas de idealização, própria ou de outrem. pode levantar a questão do que acontece depois do gesto inicial. estou a responder a esta pessoa ou à ideia que faço dela? esta oferta tem seguimento previsto, ou esgota-se em ser feita? a. e. waite; estrutura tradicional dos naipes."}, {"id": "queen-of-cups", "guia": {"palavras": ["empatia", "profundidade emocional", "intuição", "cuidado", "absorção"], "essencia": "O princípio das Copas vivido por dentro, com profundidade e sem dispersão. Waite descreve-a como honesta, dedicada, com inteligência amorosa e o dom da visão. É a única figura de corte que olha para a própria taça — a atenção está voltada para o que sente, não para quem a vê.", "psicologia_sombra": "Uma grande capacidade de sentir o que se passa nos outros tem um custo pouco discutido: a dificuldade em distinguir o que é próprio do que foi absorvido. Quem regula constantemente o estado emocional de quem o rodeia pode perder o acesso ao seu. A sombra desta carta não é frieza, é a diluição — cuidar dos outros como forma de nunca ter de olhar para si.", "leitura": ["Pode representar empatia, intuição ou alguém com essa qualidade.", "Pode trazer temas de cuidado emocional e do seu preço.", "Pode levantar a questão de onde acaba a pessoa e começa o outro."], "pensar": ["Isto que sinto é meu ou é de quem está ao meu lado?", "Quem cuida de mim enquanto eu cuido?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Queen of Cups", "pt": "Rainha de Copas", "arcano": "menor", "num": 13, "naipe": "Copas", "img": "Cups13.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Beautiful, fair, dreamy— as one who sees visions in a cup. This is, however, only one of her aspects; she sees, but she also acts, and her activity feeds her dream."]}, {"t": "Significados", "f": "Waite", "p": ["Good, fair woman; honest, devoted woman, who will do service to the Querent; loving intelligence, and hence the gift of vision; success, happiness, pleasure; also wisdom, virtue; a perfect spouse and a good mother."]}, {"t": "Invertida", "f": "Waite", "p": ["The accounts vary; good woman; otherwise, distinguished woman but one not to be trusted; perverse woman; vice, dishonour, depravity."]}], "busca": "queen of cups rainha de copas beautiful, fair, dreamy— as one who sees visions in a cup. this is, however, only one of her aspects; she sees, but she also acts, and her activity feeds her dream. good, fair woman; honest, devoted woman, who will do service to the querent; loving intelligence, and hence the gift of vision; success, happiness, pleasure; also wisdom, virtue; a perfect spouse and a good mother. the accounts vary; good woman; otherwise, distinguished woman but one not to be trusted; perverse woman; vice, dishonour, depravity. empatia profundidade emocional intuição cuidado absorção o princípio das copas vivido por dentro, com profundidade e sem dispersão. waite descreve-a como honesta, dedicada, com inteligência amorosa e o dom da visão. é a única figura de corte que olha para a própria taça — a atenção está voltada para o que sente, não para quem a vê. uma grande capacidade de sentir o que se passa nos outros tem um custo pouco discutido: a dificuldade em distinguir o que é próprio do que foi absorvido. quem regula constantemente o estado emocional de quem o rodeia pode perder o acesso ao seu. a sombra desta carta não é frieza, é a diluição — cuidar dos outros como forma de nunca ter de olhar para si. pode representar empatia, intuição ou alguém com essa qualidade. pode trazer temas de cuidado emocional e do seu preço. pode levantar a questão de onde acaba a pessoa e começa o outro. isto que sinto é meu ou é de quem está ao meu lado? quem cuida de mim enquanto eu cuido? a. e. waite; estrutura tradicional dos naipes."}, {"id": "king-of-cups", "guia": {"palavras": ["equilíbrio emocional", "serenidade", "conselho", "contenção", "maturidade"], "essencia": "Emoção governada sem ser negada. Waite descreve-o como homem justo, ligado ao direito e à divindade, com inteligência criativa e responsabilidade. O trono flutua sobre um mar agitado e ele mantém-se estável — a agitação existe, não o domina.", "psicologia_sombra": "A contenção emocional madura e a repressão bem-educada são difíceis de distinguir de fora, e por vezes de dentro. Alguém que nunca perde a compostura pode ter integrado a sua vida afectiva ou pode ter aprendido a mantê-la fora de alcance. A sombra é a serenidade como muro: disponível para toda a gente, acessível a ninguém, incluindo a si próprio.", "leitura": ["Pode representar maturidade emocional, ou alguém que a oferece.", "Pode trazer temas de conselho, contenção e estabilidade sob pressão.", "Pode levantar a questão da diferença entre integrar e conter."], "pensar": ["Esta calma é integração ou é distância?", "Quando foi a última vez que deixei que se notasse o que sinto?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "King of Cups", "pt": "Rei de Copas", "arcano": "menor", "num": 14, "naipe": "Copas", "img": "Cups14.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["He holds a short sceptre in his left hand and a great cup in his right; his throne is set upon the sea; on one side a ship is riding and on the other a dolphin is leaping. The implicit is that the Sign of the Cup naturally refers to water, which appears in all the court cards."]}, {"t": "Significados", "f": "Waite", "p": ["Fair man, man of business, law, or divinity; responsible, disposed to oblige the Querent; also equity, art and science, including those who profess science, law and art; creative intelligence."]}, {"t": "Invertida", "f": "Waite", "p": ["Dishonest, double-dealing man; roguery, exaction, injustice, vice, scandal, pillage, considerable loss."]}], "busca": "king of cups rei de copas he holds a short sceptre in his left hand and a great cup in his right; his throne is set upon the sea; on one side a ship is riding and on the other a dolphin is leaping. the implicit is that the sign of the cup naturally refers to water, which appears in all the court cards. fair man, man of business, law, or divinity; responsible, disposed to oblige the querent; also equity, art and science, including those who profess science, law and art; creative intelligence. dishonest, double-dealing man; roguery, exaction, injustice, vice, scandal, pillage, considerable loss. equilíbrio emocional serenidade conselho contenção maturidade emoção governada sem ser negada. waite descreve-o como homem justo, ligado ao direito e à divindade, com inteligência criativa e responsabilidade. o trono flutua sobre um mar agitado e ele mantém-se estável — a agitação existe, não o domina. a contenção emocional madura e a repressão bem-educada são difíceis de distinguir de fora, e por vezes de dentro. alguém que nunca perde a compostura pode ter integrado a sua vida afectiva ou pode ter aprendido a mantê-la fora de alcance. a sombra é a serenidade como muro: disponível para toda a gente, acessível a ninguém, incluindo a si próprio. pode representar maturidade emocional, ou alguém que a oferece. pode trazer temas de conselho, contenção e estabilidade sob pressão. pode levantar a questão da diferença entre integrar e conter. esta calma é integração ou é distância? quando foi a última vez que deixei que se notasse o que sinto? a. e. waite; estrutura tradicional dos naipes."}, {"id": "ace-of-swords", "guia": {"palavras": ["clareza", "verdade", "corte", "decisão", "lucidez", "discernimento"], "essencia": "A faculdade de distinguir, no seu estado mais puro. Waite fala de triunfo, conquista e grande força, com a coroa no punho da espada. É a ideia que separa — o momento em que algo confuso passa a ter contornos, com tudo o que isso tem de libertador e de doloroso.", "psicologia_sombra": "Ver com clareza é um alívio e uma perda: o que estava indefinido permitia várias leituras, e nomear elimina-as. Há pessoas que procuram a lucidez como quem procura uma arma. A sombra desta carta é a verdade usada para cortar — a franqueza que se autoriza a magoar por estar do lado do que é exacto, esquecendo que o rigor não dispensa a escolha do momento.", "leitura": ["Pode assinalar um esclarecimento ou uma decisão que separa.", "Pode trazer temas de verdade dita ou por dizer.", "Pode levantar a questão do que se perde quando algo é finalmente nomeado."], "pensar": ["Esta clareza é para compreender ou para vencer?", "O que é que eu já sei e ainda não formulei?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Ace of Swords", "pt": "Ás de Espadas", "arcano": "menor", "num": 1, "naipe": "Espadas", "img": "Swords01.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A hand issues from a cloud, grasping as word, the point of which is encircled by a crown."]}, {"t": "Significados", "f": "Waite", "p": ["Triumph, the excessive degree in everything, conquest, triumph of force. It is a card of great force, in love as well as in hatred. The crown may carry a much higher significance than comes usually within the sphere of fortune-telling."]}, {"t": "Invertida", "f": "Waite", "p": ["The same, but the results are disastrous; another account says— conception, childbirth, augmentation, multiplicity."]}, {"t": "Resumo", "f": "Waite", "p": ["Great prosperity or great misery. Reversed. Marriage broken off, for a woman, through her own imprudence."]}], "busca": "ace of swords ás de espadas a hand issues from a cloud, grasping as word, the point of which is encircled by a crown. triumph, the excessive degree in everything, conquest, triumph of force. it is a card of great force, in love as well as in hatred. the crown may carry a much higher significance than comes usually within the sphere of fortune-telling. the same, but the results are disastrous; another account says— conception, childbirth, augmentation, multiplicity. great prosperity or great misery. reversed. marriage broken off, for a woman, through her own imprudence. clareza verdade corte decisão lucidez discernimento a faculdade de distinguir, no seu estado mais puro. waite fala de triunfo, conquista e grande força, com a coroa no punho da espada. é a ideia que separa — o momento em que algo confuso passa a ter contornos, com tudo o que isso tem de libertador e de doloroso. ver com clareza é um alívio e uma perda: o que estava indefinido permitia várias leituras, e nomear elimina-as. há pessoas que procuram a lucidez como quem procura uma arma. a sombra desta carta é a verdade usada para cortar — a franqueza que se autoriza a magoar por estar do lado do que é exacto, esquecendo que o rigor não dispensa a escolha do momento. pode assinalar um esclarecimento ou uma decisão que separa. pode trazer temas de verdade dita ou por dizer. pode levantar a questão do que se perde quando algo é finalmente nomeado. esta clareza é para compreender ou para vencer? o que é que eu já sei e ainda não formulei? a. e. waite; estrutura tradicional dos naipes."}, {"id": "two-of-swords", "guia": {"palavras": ["impasse", "recusa em ver", "equilíbrio forçado", "suspensão", "defesa"], "essencia": "Uma figura vendada com duas espadas cruzadas ao peito, de costas para o mar. Waite fala de conformidade, equilíbrio e concórdia em estado de armas. O equilíbrio existe, mas é mantido à custa de não olhar — uma trégua que depende da venda.", "psicologia_sombra": "Não decidir é uma decisão que não se assume como tal. A venda protege de uma informação que tornaria a posição insustentável, e quem não olha consegue manter os dois lados intactos por mais algum tempo. A sombra é o impasse confortável: a suspensão prolongada indefinidamente porque qualquer resolução custaria mais do que o desconforto de continuar parado.", "leitura": ["Pode representar um impasse mantido por não se olhar directamente.", "Pode trazer temas de decisão adiada ou de informação evitada.", "Pode levantar a questão do que a venda está a proteger."], "pensar": ["O que é que eu teria de admitir se tirasse a venda?", "Este equilíbrio é paz ou é adiamento?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Two of Swords", "pt": "Dois de Espadas", "arcano": "menor", "num": 2, "naipe": "Espadas", "img": "Swords02.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A hoodwinked female figure balances two swords upon her shoulders."]}, {"t": "Significados", "f": "Waite", "p": ["Conformity and the equipoise which it suggests, courage, friendship, concord in a state of arms; another reading gives tenderness, affection, intimacy. The suggestion of harmony and other favourable readings must be considered in a qualified manner, as Swords generally are not symbolical of beneficent forces in human affairs."]}, {"t": "Invertida", "f": "Waite", "p": ["Imposture, falsehood, duplicity, disloyalty."]}, {"t": "Resumo", "f": "Waite", "p": ["Gifts for a lady, influential protection for a man in search of help. Reversed: Dealings with 3.4 Some Additional Meanings of the Lesser Arcana"]}], "busca": "two of swords dois de espadas a hoodwinked female figure balances two swords upon her shoulders. conformity and the equipoise which it suggests, courage, friendship, concord in a state of arms; another reading gives tenderness, affection, intimacy. the suggestion of harmony and other favourable readings must be considered in a qualified manner, as swords generally are not symbolical of beneficent forces in human affairs. imposture, falsehood, duplicity, disloyalty. gifts for a lady, influential protection for a man in search of help. reversed: dealings with 3.4 some additional meanings of the lesser arcana impasse recusa em ver equilíbrio forçado suspensão defesa uma figura vendada com duas espadas cruzadas ao peito, de costas para o mar. waite fala de conformidade, equilíbrio e concórdia em estado de armas. o equilíbrio existe, mas é mantido à custa de não olhar — uma trégua que depende da venda. não decidir é uma decisão que não se assume como tal. a venda protege de uma informação que tornaria a posição insustentável, e quem não olha consegue manter os dois lados intactos por mais algum tempo. a sombra é o impasse confortável: a suspensão prolongada indefinidamente porque qualquer resolução custaria mais do que o desconforto de continuar parado. pode representar um impasse mantido por não se olhar directamente. pode trazer temas de decisão adiada ou de informação evitada. pode levantar a questão do que a venda está a proteger. o que é que eu teria de admitir se tirasse a venda? este equilíbrio é paz ou é adiamento? a. e. waite; estrutura tradicional dos naipes."}, {"id": "three-of-swords", "guia": {"palavras": ["mágoa", "ruptura", "verdade dolorosa", "separação", "dor lúcida"], "essencia": "Um coração atravessado por três espadas, com nuvem e chuva ao fundo. Waite fala de afastamento, ausência, divisão, ruptura e dispersão. A imagem é directa e não admite metáfora consoladora — mas as espadas são de pensamento: a dor aqui vem frequentemente de ter compreendido.", "psicologia_sombra": "Há mágoas que doem porque a coisa é verdadeira. Compreender o que aconteceu não alivia, e por algum tempo torna tudo pior — a lucidez retira até o conforto da dúvida. A sombra desta carta é a dor cultivada: quando revisitar a ferida se torna a forma de a manter presente, e a nitidez da mágoa passa a ser preferível ao risco de deixar de a sentir.", "leitura": ["Pode assinalar uma mágoa, separação ou verdade difícil.", "Pode trazer temas de dor que resulta de ter compreendido.", "Pode levantar a questão do que se faz com o que já não se pode desconhecer."], "pensar": ["Esta dor está a passar, ou estou a mantê-la viva?", "O que é que eu compreendi que preferia não ter compreendido?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Three of Swords", "pt": "Três de Espadas", "arcano": "menor", "num": 3, "naipe": "Espadas", "img": "Swords03.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Three swords piercing a heart; cloud and rain behind."]}, {"t": "Significados", "f": "Waite", "p": ["Removal, absence, delay, division, rupture, dispersion, and all that the design signifies naturally, being too simple and obvious to call for specific enumeration."]}, {"t": "Invertida", "f": "Waite", "p": ["Mental alienation, error, loss, distraction, disorder, confusion."]}, {"t": "Resumo", "f": "Waite", "p": ["For a woman, the flight of her lover. Reversed: A meeting with one whom the Querent has compromised; also a nun."]}], "busca": "three of swords três de espadas three swords piercing a heart; cloud and rain behind. removal, absence, delay, division, rupture, dispersion, and all that the design signifies naturally, being too simple and obvious to call for specific enumeration. mental alienation, error, loss, distraction, disorder, confusion. for a woman, the flight of her lover. reversed: a meeting with one whom the querent has compromised; also a nun. mágoa ruptura verdade dolorosa separação dor lúcida um coração atravessado por três espadas, com nuvem e chuva ao fundo. waite fala de afastamento, ausência, divisão, ruptura e dispersão. a imagem é directa e não admite metáfora consoladora — mas as espadas são de pensamento: a dor aqui vem frequentemente de ter compreendido. há mágoas que doem porque a coisa é verdadeira. compreender o que aconteceu não alivia, e por algum tempo torna tudo pior — a lucidez retira até o conforto da dúvida. a sombra desta carta é a dor cultivada: quando revisitar a ferida se torna a forma de a manter presente, e a nitidez da mágoa passa a ser preferível ao risco de deixar de a sentir. pode assinalar uma mágoa, separação ou verdade difícil. pode trazer temas de dor que resulta de ter compreendido. pode levantar a questão do que se faz com o que já não se pode desconhecer. esta dor está a passar, ou estou a mantê-la viva? o que é que eu compreendi que preferia não ter compreendido? a. e. waite; estrutura tradicional dos naipes."}, {"id": "four-of-swords", "guia": {"palavras": ["repouso", "recolhimento", "convalescença", "trégua", "pausa necessária"], "essencia": "Uma figura deitada, em repouso, com três espadas na parede e uma ao lado. Waite fala de vigilância, retiro, solidão e repouso de eremita. Não é derrota nem fim: é a interrupção deliberada de um conflito para permitir recuperação.", "psicologia_sombra": "Parar exige tolerar a ausência de progresso, e para muitas pessoas isso é mais difícil do que continuar exaustas. O repouso é frequentemente adiado até deixar de ser escolha. A sombra é a retirada que se prolonga: a pausa que era recuperação e passou a ser afastamento permanente, quando o mundo lá fora começa a parecer demasiado ruidoso para se voltar a ele.", "leitura": ["Pode assinalar necessidade de pausa, convalescença ou retirada temporária.", "Pode trazer temas de silêncio e de recuperação depois de esforço.", "Pode levantar a questão de quando a pausa deixa de servir."], "pensar": ["Estou a descansar, ou a esconder-me?", "O que é que eu teria de enfrentar se voltasse agora?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Four of Swords", "pt": "Quatro de Espadas", "arcano": "menor", "num": 4, "naipe": "Espadas", "img": "Swords04.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The effigy of a knight in the attitude of prayer, at full length upon his tomb."]}, {"t": "Significados", "f": "Waite", "p": ["Vigilance, retreat, solitude, hermit's repose, exile, tomb and coffin. It is these last that have suggested the design."]}, {"t": "Invertida", "f": "Waite", "p": ["Wise administration, circumspection, economy, avarice, precaution, testament."]}, {"t": "Resumo", "f": "Waite", "p": ["A bad card, but if reversed a qualified success may be expected by wise administration of affairs. Reversed: A certain success following wise administration."]}], "busca": "four of swords quatro de espadas the effigy of a knight in the attitude of prayer, at full length upon his tomb. vigilance, retreat, solitude, hermit's repose, exile, tomb and coffin. it is these last that have suggested the design. wise administration, circumspection, economy, avarice, precaution, testament. a bad card, but if reversed a qualified success may be expected by wise administration of affairs. reversed: a certain success following wise administration. repouso recolhimento convalescença trégua pausa necessária uma figura deitada, em repouso, com três espadas na parede e uma ao lado. waite fala de vigilância, retiro, solidão e repouso de eremita. não é derrota nem fim: é a interrupção deliberada de um conflito para permitir recuperação. parar exige tolerar a ausência de progresso, e para muitas pessoas isso é mais difícil do que continuar exaustas. o repouso é frequentemente adiado até deixar de ser escolha. a sombra é a retirada que se prolonga: a pausa que era recuperação e passou a ser afastamento permanente, quando o mundo lá fora começa a parecer demasiado ruidoso para se voltar a ele. pode assinalar necessidade de pausa, convalescença ou retirada temporária. pode trazer temas de silêncio e de recuperação depois de esforço. pode levantar a questão de quando a pausa deixa de servir. estou a descansar, ou a esconder-me? o que é que eu teria de enfrentar se voltasse agora? a. e. waite; estrutura tradicional dos naipes."}, {"id": "five-of-swords", "guia": {"palavras": ["vitória vazia", "custo do conflito", "humilhação", "ganho amargo", "orgulho"], "essencia": "Alguém recolhe as espadas enquanto dois se afastam derrotados. Waite fala de degradação, destruição, infâmia e perda. Houve um vencedor, mas a carta olha para o preço: ganhar não deixou ninguém melhor, incluindo quem ganhou.", "psicologia_sombra": "Há discussões em que ter razão custa mais do que valia a razão. O impulso de vencer sobrepõe-se frequentemente ao interesse real, e só depois de o outro se afastar é que fica claro o que se trocou por aquilo. A sombra é o orgulho que não sabe parar: a incapacidade de ceder um ponto pequeno, mesmo quando isso custa a relação inteira.", "leitura": ["Pode representar um conflito ganho a um custo desproporcionado.", "Pode trazer temas de orgulho, humilhação e do que fica depois.", "Pode levantar a questão de quem perdeu o quê, incluindo quem venceu."], "pensar": ["O que é que esta vitória me custou?", "Queria resolver isto, ou queria ganhar?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Five of Swords", "pt": "Cinco de Espadas", "arcano": "menor", "num": 5, "naipe": "Espadas", "img": "Swords05.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A disdainful man looks after two retreating and dejected figures. Their swords lie upon the ground. He carries two others on his left shoulder, and a third sword is in his right hand, point to earth. He is the master in possession of the field."]}, {"t": "Significados", "f": "Waite", "p": ["Degradation, destruction, revocation, infamy, dishonour, loss, with the variants and analogues of these."]}, {"t": "Invertida", "f": "Waite", "p": ["The same; burial and obsequies."]}, {"t": "Resumo", "f": "Waite", "p": ["An attack on the fortune of the Querent. Reversed: A sign of sorrow and mourning."]}], "busca": "five of swords cinco de espadas a disdainful man looks after two retreating and dejected figures. their swords lie upon the ground. he carries two others on his left shoulder, and a third sword is in his right hand, point to earth. he is the master in possession of the field. degradation, destruction, revocation, infamy, dishonour, loss, with the variants and analogues of these. the same; burial and obsequies. an attack on the fortune of the querent. reversed: a sign of sorrow and mourning. vitória vazia custo do conflito humilhação ganho amargo orgulho alguém recolhe as espadas enquanto dois se afastam derrotados. waite fala de degradação, destruição, infâmia e perda. houve um vencedor, mas a carta olha para o preço: ganhar não deixou ninguém melhor, incluindo quem ganhou. há discussões em que ter razão custa mais do que valia a razão. o impulso de vencer sobrepõe-se frequentemente ao interesse real, e só depois de o outro se afastar é que fica claro o que se trocou por aquilo. a sombra é o orgulho que não sabe parar: a incapacidade de ceder um ponto pequeno, mesmo quando isso custa a relação inteira. pode representar um conflito ganho a um custo desproporcionado. pode trazer temas de orgulho, humilhação e do que fica depois. pode levantar a questão de quem perdeu o quê, incluindo quem venceu. o que é que esta vitória me custou? queria resolver isto, ou queria ganhar? a. e. waite; estrutura tradicional dos naipes."}, {"id": "six-of-swords", "guia": {"palavras": ["travessia", "transição", "afastamento", "alívio gradual", "passagem"], "essencia": "Uma barca que atravessa águas calmas levando figuras e espadas. Waite fala de viagem por água, rota e caminho. Sai-se de algo difícil, mas devagar e sem euforia — e as espadas vão dentro do barco, não ficaram para trás.", "psicologia_sombra": "As transições reais raramente são limpas. Leva-se o que se atravessou, e a melhoria é gradual o suficiente para ser difícil de reconhecer enquanto acontece. A sombra desta carta é o movimento sem elaboração: mudar de circunstância na esperança de que a mudança faça o trabalho, e descobrir que a mesma configuração se reinstala do outro lado.", "leitura": ["Pode assinalar uma transição em curso, com alívio ainda parcial.", "Pode trazer temas de afastamento de uma situação difícil.", "Pode levantar a questão do que se leva na travessia."], "pensar": ["O que é que eu estou a levar comigo desta situação?", "Isto é uma passagem, ou uma mudança de cenário?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Six of Swords", "pt": "Seis de Espadas", "arcano": "menor", "num": 6, "naipe": "Espadas", "img": "Swords06.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A ferryman carrying passengers in his punt to the further shore. The course is smooth, and seeing that the freight is light, it may be noted that the work is not beyond his strength."]}, {"t": "Significados", "f": "Waite", "p": ["journey by water, route, way, envoy, commissionary, expedient."]}, {"t": "Invertida", "f": "Waite", "p": ["Declaration, confession, publicity; one account says that it is a proposal of love."]}], "busca": "six of swords seis de espadas a ferryman carrying passengers in his punt to the further shore. the course is smooth, and seeing that the freight is light, it may be noted that the work is not beyond his strength. journey by water, route, way, envoy, commissionary, expedient. declaration, confession, publicity; one account says that it is a proposal of love. travessia transição afastamento alívio gradual passagem uma barca que atravessa águas calmas levando figuras e espadas. waite fala de viagem por água, rota e caminho. sai-se de algo difícil, mas devagar e sem euforia — e as espadas vão dentro do barco, não ficaram para trás. as transições reais raramente são limpas. leva-se o que se atravessou, e a melhoria é gradual o suficiente para ser difícil de reconhecer enquanto acontece. a sombra desta carta é o movimento sem elaboração: mudar de circunstância na esperança de que a mudança faça o trabalho, e descobrir que a mesma configuração se reinstala do outro lado. pode assinalar uma transição em curso, com alívio ainda parcial. pode trazer temas de afastamento de uma situação difícil. pode levantar a questão do que se leva na travessia. o que é que eu estou a levar comigo desta situação? isto é uma passagem, ou uma mudança de cenário? a. e. waite; estrutura tradicional dos naipes."}, {"id": "seven-of-swords", "guia": {"palavras": ["estratégia", "evasão", "ocultação", "autonomia", "cálculo"], "essencia": "Alguém leva cinco espadas e deixa duas para trás. Waite fala de desígnio, tentativa, esperança e confiança, mas também de discórdia e de um plano que pode falhar. A carta trata de agir por fora do combinado — o que pode ser astúcia, necessidade ou traição, e a imagem não decide qual.", "psicologia_sombra": "Contornar em vez de confrontar é por vezes a única via disponível, sobretudo em situações de desigualdade de poder. Também é um hábito fácil de instalar. A sombra é a evasão como método por defeito: resolver tudo pela margem, sem nunca testar se a via directa era possível — e acabar sem saber quais das suas relações aguentariam uma conversa franca.", "leitura": ["Pode trazer temas de estratégia, discrição ou coisas não ditas.", "Pode representar autonomia conquistada por vias indirectas.", "Pode levantar a questão do que não está a ser dito, e por quem."], "nota": "esta carta não constitui indicação de que alguém está a mentir ou a trair. Aponta para o tema da transparência, não para um facto sobre terceiros.", "pensar": ["O que é que eu estou a contornar em vez de dizer?", "Se eu fosse directo, o que temia que acontecesse?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Seven of Swords", "pt": "Sete de Espadas", "arcano": "menor", "num": 7, "naipe": "Espadas", "img": "Swords07.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A man in the act of carrying away five swords rapidly; the two others of the card remain stuck in the ground. A camp is close at hand."]}, {"t": "Significados", "f": "Waite", "p": ["Design, attempt, wish, hope, confidence; also quarrelling, a plan that may fail, annoyance. The design is uncertain in its import, because the significations are widely at variance with each other."]}, {"t": "Invertida", "f": "Waite", "p": ["Good advice, counsel, instruction, slander, babbling."]}, {"t": "Resumo", "f": "Waite", "p": ["Dark girl; a good card; it promises a country life after a competence has been secured. Reversed: Good advice, probably neglected. 57v.-The voyage will be pleasant. Reversed: Unfavourable issue of lawsuit."]}], "busca": "seven of swords sete de espadas a man in the act of carrying away five swords rapidly; the two others of the card remain stuck in the ground. a camp is close at hand. design, attempt, wish, hope, confidence; also quarrelling, a plan that may fail, annoyance. the design is uncertain in its import, because the significations are widely at variance with each other. good advice, counsel, instruction, slander, babbling. dark girl; a good card; it promises a country life after a competence has been secured. reversed: good advice, probably neglected. 57v.-the voyage will be pleasant. reversed: unfavourable issue of lawsuit. estratégia evasão ocultação autonomia cálculo alguém leva cinco espadas e deixa duas para trás. waite fala de desígnio, tentativa, esperança e confiança, mas também de discórdia e de um plano que pode falhar. a carta trata de agir por fora do combinado — o que pode ser astúcia, necessidade ou traição, e a imagem não decide qual. contornar em vez de confrontar é por vezes a única via disponível, sobretudo em situações de desigualdade de poder. também é um hábito fácil de instalar. a sombra é a evasão como método por defeito: resolver tudo pela margem, sem nunca testar se a via directa era possível — e acabar sem saber quais das suas relações aguentariam uma conversa franca. pode trazer temas de estratégia, discrição ou coisas não ditas. pode representar autonomia conquistada por vias indirectas. pode levantar a questão do que não está a ser dito, e por quem. esta carta não constitui indicação de que alguém está a mentir ou a trair. aponta para o tema da transparência, não para um facto sobre terceiros. o que é que eu estou a contornar em vez de dizer? se eu fosse directo, o que temia que acontecesse? a. e. waite; estrutura tradicional dos naipes."}, {"id": "eight-of-swords", "guia": {"palavras": ["limitação", "sensação de preso", "autocensura", "medo", "paralisia"], "essencia": "Uma figura vendada e frouxamente amarrada, rodeada de espadas mas com o caminho aberto. Waite fala de más notícias, crise, censura e poder em entraves. A restrição é real, e ao mesmo tempo menos fechada do que a posição sugere.", "psicologia_sombra": "Sentir-se preso e estar preso não são o mesmo, e a diferença é difícil de avaliar de dentro. Muitas limitações começam como reais e continuam como hábito, muito depois de as condições terem mudado. A sombra desta carta não é a fraqueza: é a familiaridade da posição, quando o cativeiro se tornou previsível e sair exigiria aceitar responsabilidade por tudo o que viesse depois.", "leitura": ["Pode representar uma situação vivida como sem saída.", "Pode trazer temas de autocensura e de limites interiorizados.", "Pode levantar a questão de quais das amarras ainda estão atadas."], "pensar": ["Quanto desta prisão é a situação e quanto é a minha leitura dela?", "O que teria de assumir se saísse daqui?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Eight of Swords", "pt": "Oito de Espadas", "arcano": "menor", "num": 8, "naipe": "Espadas", "img": "Swords08.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A woman, bound and hoodwinked, with the swords of the card about her. Y et it is rather a card of temporary durance than of irretrievable bondage."]}, {"t": "Significados", "f": "Waite", "p": ["Bad news, violent chagrin, crisis, censure, power in trammels, conflict, calumny; also sickness."]}, {"t": "Invertida", "f": "Waite", "p": ["Disquiet, difficulty, opposition, accident, treachery; what is unforeseen; fatality."]}, {"t": "Resumo", "f": "Waite", "p": ["For a woman, scandal spread in her respect. Reversed: Departure of a relative."]}], "busca": "eight of swords oito de espadas a woman, bound and hoodwinked, with the swords of the card about her. y et it is rather a card of temporary durance than of irretrievable bondage. bad news, violent chagrin, crisis, censure, power in trammels, conflict, calumny; also sickness. disquiet, difficulty, opposition, accident, treachery; what is unforeseen; fatality. for a woman, scandal spread in her respect. reversed: departure of a relative. limitação sensação de preso autocensura medo paralisia uma figura vendada e frouxamente amarrada, rodeada de espadas mas com o caminho aberto. waite fala de más notícias, crise, censura e poder em entraves. a restrição é real, e ao mesmo tempo menos fechada do que a posição sugere. sentir-se preso e estar preso não são o mesmo, e a diferença é difícil de avaliar de dentro. muitas limitações começam como reais e continuam como hábito, muito depois de as condições terem mudado. a sombra desta carta não é a fraqueza: é a familiaridade da posição, quando o cativeiro se tornou previsível e sair exigiria aceitar responsabilidade por tudo o que viesse depois. pode representar uma situação vivida como sem saída. pode trazer temas de autocensura e de limites interiorizados. pode levantar a questão de quais das amarras ainda estão atadas. quanto desta prisão é a situação e quanto é a minha leitura dela? o que teria de assumir se saísse daqui? a. e. waite; estrutura tradicional dos naipes."}, {"id": "nine-of-swords", "guia": {"palavras": ["angústia", "ruminação", "insónia", "medo nocturno", "antecipação"], "essencia": "Alguém sentado na cama, com o rosto nas mãos, e nove espadas na parede. Waite fala de sofrimento, desilusão e desespero. É a carta da angústia mental — o sofrimento que se produz na cabeça, muitas vezes desproporcionado ao que efectivamente aconteceu.", "psicologia_sombra": "A ruminação nocturna tem uma qualidade própria: os pensamentos parecem mais verdadeiros e as soluções mais impossíveis do que serão de manhã. Antecipar o pior dá a ilusão de preparação. A sombra desta carta é a angústia como forma de controlo — imaginar todas as catástrofes para não ser apanhado desprevenido, ao custo de as viver todas antecipadamente.", "leitura": ["Pode assinalar angústia, preocupação persistente ou insónia.", "Pode trazer temas de sofrimento antecipado e desproporcionado.", "Pode levantar a distinção entre o que aconteceu e o que se teme."], "pensar": ["Destes receios, quantos já se concretizaram?", "O que é que este sofrimento me está a dar em troca?"], "fontes": "A. E. Waite; estrutura tradicional dos naipes."}, "nome": "Nine of Swords", "pt": "Nove de Espadas", "arcano": "menor", "num": 9, "naipe": "Espadas", "img": "Swords09.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["One seated on her couch in lamentation, with the swords over her. She is as one who knows no sorrow which is like unto hers. It is a card of utter desolation."]}, {"t": "Significados", "f": "Waite", "p": ["Death, failure, miscarriage, delay, deception, disappointment, despair."]}, {"t": "Invertida", "f": "Waite", "p": ["Imprisonment, suspicion, doubt, reasonable fear, shame."]}, {"t": "Resumo", "f": "Waite", "p": ["An ecclesiastic, a priest; generally, a card of bad omen. Reversed: Good ground for suspicion against a doubtful person."]}], "busca": "nine of swords nove de espadas one seated on her couch in lamentation, with the swords over her. she is as one who knows no sorrow which is like unto hers. it is a card of utter desolation. death, failure, miscarriage, delay, deception, disappointment, despair. imprisonment, suspicion, doubt, reasonable fear, shame. an ecclesiastic, a priest; generally, a card of bad omen. reversed: good ground for suspicion against a doubtful person. angústia ruminação insónia medo nocturno antecipação alguém sentado na cama, com o rosto nas mãos, e nove espadas na parede. waite fala de sofrimento, desilusão e desespero. é a carta da angústia mental — o sofrimento que se produz na cabeça, muitas vezes desproporcionado ao que efectivamente aconteceu. a ruminação nocturna tem uma qualidade própria: os pensamentos parecem mais verdadeiros e as soluções mais impossíveis do que serão de manhã. antecipar o pior dá a ilusão de preparação. a sombra desta carta é a angústia como forma de controlo — imaginar todas as catástrofes para não ser apanhado desprevenido, ao custo de as viver todas antecipadamente. pode assinalar angústia, preocupação persistente ou insónia. pode trazer temas de sofrimento antecipado e desproporcionado. pode levantar a distinção entre o que aconteceu e o que se teme. destes receios, quantos já se
