s quatro seres de Ezequiel nos cantos, ligam o acaso aparente a uma ordem simbólica mais funda.", "Em Crowley, três figuras — esfinge, Hermanubis, Tifão — giram na roda como as três forças que regem todo o movimento fenomenal."], "psicologia": "A Roda convida a olhar para um padrão recorrente na própria vida, mais do que para um único acontecimento. Nichols detém-se longamente em como trabalhar sonhos e situações que se repetem, notando que perguntar \"porquê\" tantas vezes paralisa mais do que liberta. Louis constrói a sua leitura sobre Boécio, escrevendo à espera de execução: \"o movimento acontece na circunferência, mas o centro está sempre imóvel\" — a tarefa não é parar a roda, mas deslocar-se da margem para o eixo.", "sombra": ["Tentar controlar ou prever cada resultado pode ser uma forma de evitar a incerteza real da vida.", "Atribuir tudo ao destino pode servir para evitar responsabilidade pessoal por escolhas concretas.", "A esperança de uma \"próxima viragem\" pode substituir o trabalho de mudar algo agora.", "Sombra dourada: confiar no processo mesmo sem controlo total sobre o resultado."], "leitura": ["Pode assinalar uma mudança de fase — ascendente ou descendente — mais cíclica do que definitiva.", "Pode convidar a identificar um padrão que se repete, em vez de tratar cada ocorrência como isolada.", "Pode levantar a questão de quanto de uma situação é mesmo \"sorte\" e quanto é um padrão que se pode reconhecer."], "pensar": ["Que padrão já vivi antes, sob outra forma, e ainda não reconheci como tal?", "Estou a olhar para o centro imóvel desta situação, ou só para a margem que sobe e desce?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis."}, "nome": "Wheel of Fortune", "pt": "A Roda da Fortuna", "arcano": "maior", "num": 10, "naipe": null, "img": "10-WheelOfFortune.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["WHEEL FORTUNE. | / In this symbol I have again followed the reconstruction of Eliphas Levi, who has furnished several variants. It is legitimate— as I have intimated— to use Egyptian symbolism when this serves our purpose, provided that no theory of origin is implied therein. I have, however, presented Typhon in his serpent form. The symbolism is, of course, not exclusively Egyptian, as the four Living Creatures of Ezekiel occupy the angles of the card, and the wheel itself follows other indications of Levi in respect of Ezekiel's vision, as illustrative of the particular Tarot Key. With the French occultist, and in the design itself, the symbolic picture stands for the perpetual motion of a fluidic universe and for the flux of human life. The Sphinx is the equilibrium therein. The transliteration of Taro as Rota is inscribed on the wheel, counterchanged with the letters of the Divine Name— to shew that Providence is imphed through all. But this is the Divine intention within, and the similar intention without is exemplified by the four Living Creatures. Sometimes the sphinx is represented couchant on a pedestal above, which defrauds the symbolism by stultifying the essential idea of stability amidst movement. Behind the general notion expressed in the symbol there lies the denial of chance and the fatality which is implied therein. It may be added that, from the days of Levi onward, the occult explanations of this card are— even for occultism itself— of a singularly fatuous kind. It has been said to mean principle, fecundity, virile honour, ruling authority, etc. The findings of common fortune-telling are better than this on their own plane."]}, {"t": "Resumo", "f": "Waite", "p": ["Destiny, fortune, success, elevation, luck, felicity. Reversed : Increase, abundance, superfluity."]}], "busca": "wheel of fortune a roda da fortuna wheel fortune. | / in this symbol i have again followed the reconstruction of eliphas levi, who has furnished several variants. it is legitimate— as i have intimated— to use egyptian symbolism when this serves our purpose, provided that no theory of origin is implied therein. i have, however, presented typhon in his serpent form. the symbolism is, of course, not exclusively egyptian, as the four living creatures of ezekiel occupy the angles of the card, and the wheel itself follows other indications of levi in respect of ezekiel's vision, as illustrative of the particular tarot key. with the french occultist, and in the design itself, the symbolic picture stands for the perpetual motion of a fluidic universe and for the flux of human life. the sphinx is the equilibrium therein. the transliteration of taro as rota is inscribed on the wheel, counterchanged with the letters of the divine name— to shew that providence is imphed through all. but this is the divine intention within, and the similar intention without is exemplified by the four living creatures. sometimes the sphinx is represented couchant on a pedestal above, which defrauds the symbolism by stultifying the essential idea of stability amidst movement. behind the general notion expressed in the symbol there lies the denial of chance and the fatality which is implied therein. it may be added that, from the days of levi onward, the occult explanations of this card are— even for occultism itself— of a singularly fatuous kind. it has been said to mean principle, fecundity, virile honour, ruling authority, etc. the findings of common fortune-telling are better than this on their own plane. destiny, fortune, success, elevation, luck, felicity. reversed : increase, abundance, superfluity. ciclos destino mudança causalidade sorte viragem uma roda gira, com uma esfinge no topo e figuras — ezequiel, alquímicas ou mitológicas, consoante o baralho — a subir e a descer as suas margens. waite lê a carta não como sorte no sentido comum, mas como \"a negação do acaso e da fatalidade nele implícita\": um convite a olhar para o padrão, não apenas para o resultado. é a carta que introduz, de forma simbólica e ainda velada, uma primeira avaliação de para onde a vida de alguém tem ido. a esfinge imóvel no topo, em contraste com a roda em movimento, distingue o que muda do que observa a mudança. as figuras nas margens da roda (subindo, no topo, descendo, em baixo) mostram um ciclo completo, não um só momento de sorte ou azar. as letras taro/rota em torno da roda, e os quatro seres de ezequiel nos cantos, ligam o acaso aparente a uma ordem simbólica mais funda. em crowley, três figuras — esfinge, hermanubis, tifão — giram na roda como as três forças que regem todo o movimento fenomenal. a roda convida a olhar para um padrão recorrente na própria vida, mais do que para um único acontecimento. nichols detém-se longamente em como trabalhar sonhos e situações que se repetem, notando que perguntar \"porquê\" tantas vezes paralisa mais do que liberta. louis constrói a sua leitura sobre boécio, escrevendo à espera de execução: \"o movimento acontece na circunferência, mas o centro está sempre imóvel\" — a tarefa não é parar a roda, mas deslocar-se da margem para o eixo. tentar controlar ou prever cada resultado pode ser uma forma de evitar a incerteza real da vida. atribuir tudo ao destino pode servir para evitar responsabilidade pessoal por escolhas concretas. a esperança de uma \"próxima viragem\" pode substituir o trabalho de mudar algo agora. sombra dourada: confiar no processo mesmo sem controlo total sobre o resultado. pode assinalar uma mudança de fase — ascendente ou descendente — mais cíclica do que definitiva. pode convidar a identificar um padrão que se repete, em vez de tratar cada ocorrência como isolada. pode levantar a questão de quanto de uma situação é mesmo \"sorte\" e quanto é um padrão que se pode reconhecer. que padrão já vivi antes, sob outra forma, e ainda não reconheci como tal? estou a olhar para o centro imóvel desta situação, ou só para a margem que sobe e desce? a. e. waite; aleister crowley; sallie nichols; mariana louis."}, {"id": "justice", "guia": {"palavras": ["equilíbrio", "verdade", "responsabilidade", "causa e efeito", "discernimento", "lei"], "essencia": "Uma figura sentada entre pilares, espada numa mão, balança na outra, olhar directo. Waite compõe deliberadamente esta carta como espelho da Sacerdotisa — mas onde ela guarda um mistério que não se explica, a Justiça representa \"a cada um segundo as suas obras\": um princípio de causa e efeito compreensível, não graça inexplicável. Waite chama-lhe \"equidade, rectidão, probidade\".", "simbolismo": ["A espada erguida representa discernimento — a capacidade de cortar o que já não serve.", "A balança pesa não moralismo abstracto, mas a relação entre acção e consequência.", "Os pilares, que ecoam os da Sacerdotisa, marcam duas ordens distintas: a da graça incompreensível, e a da lei compreensível.", "Historicamente, esta carta trocou de número com a Força nos baralhos derivados de Waite — nos baralhos de Marselha e no Thoth de Crowley (onde se chama \"Ajustamento\"), mantém a posição VIII, mais antiga."], "psicologia": "Pollack coloca esta carta no centro estrutural exacto da sequência de vinte e um trunfos e detém-se, de forma pouco comum, no livre-arbítrio como problema prático, não abstracto: \"o livre-arbítrio certamente existe. É que não sabemos como o usar.\" Argumenta, a partir da própria experiência de leitora, que exercê-lo exige compreender causas, não apenas conhecer resultados. Louis nota que a sua Justiça retira a venda dos olhos, ao contrário da Têmis clássica — porque, nesta etapa, a justiça verdadeira exige olhos abertos e lealdade à própria verdade, não imparcialidade cega.", "sombra": ["A busca de equidade pode tornar-se rigidez sobre regras, incapaz de tolerar excepções legítimas.", "O discernimento pode deslizar para julgamento severo de quem se desvia do que se considera \"certo\".", "A responsabilização pode ser usada para culpar em vez de compreender causas.", "Sombra dourada: profunda apreciação da equidade, capaz de defender-se a si e aos outros sem perder o discernimento."], "leitura": ["Pode assinalar a necessidade de assumir consequências de escolhas já feitas, em vez de as adiar.", "Pode convidar a examinar uma situação com honestidade, mesmo quando isso complica uma narrativa mais confortável.", "Pode apontar para uma decisão que pede equilíbrio entre os próprios interesses e os de outra pessoa."], "pensar": ["Estou a ver esta situação com clareza, ou apenas do ângulo que mais me favorece?", "Que consequência de uma escolha minha ainda não assumi por completo?"], "fontes": "A. E. Waite; Aleister Crowley; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "Justice", "pt": "A Justiça", "arcano": "maior", "num": 11, "naipe": null, "img": "11-Justice.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["As this card follows the traditional symbolism and carries above all its obvious meanings, there is little to say regarding it outside the few considerations collected in the first part, to which the reader is referred. It will be seen, however, that the figure is seated between pillars, like the High Priestess, and on this account it seems desirable to indicate that the moral principle which deals unto every man according to his works— while, of course, it is in strict analogy with higher things ;-differs in its essence from the spiritual justice which is involved in the idea of election. The latter belongs to a mysterious order of Providence, in virtue of which it is possible for certain men to conceive the idea of dedication to the highest things. The operation of this is like the breathing of the Spirit where it wills, and we have no canon of criticism or ground of explanation concerning it. It is analogous to the possession of the fairy gifts and the high gifts and the gracious gifts of the poet: we have them or have not, and their presence is as much a mystery as their absence. The law of Justice is not however involved by either alternative. In conclusion, the pillars of Justice open into one world and the pillars of the High Priestess into another."]}, {"t": "Resumo", "f": "Waite", "p": ["Equity, rightness, probity, executive; triumph of the deserving side in law. Reversed: Law in all its departments, legal complications, bigotry, bias, excessive severity."]}], "busca": "justice a justiça as this card follows the traditional symbolism and carries above all its obvious meanings, there is little to say regarding it outside the few considerations collected in the first part, to which the reader is referred. it will be seen, however, that the figure is seated between pillars, like the high priestess, and on this account it seems desirable to indicate that the moral principle which deals unto every man according to his works— while, of course, it is in strict analogy with higher things ;-differs in its essence from the spiritual justice which is involved in the idea of election. the latter belongs to a mysterious order of providence, in virtue of which it is possible for certain men to conceive the idea of dedication to the highest things. the operation of this is like the breathing of the spirit where it wills, and we have no canon of criticism or ground of explanation concerning it. it is analogous to the possession of the fairy gifts and the high gifts and the gracious gifts of the poet: we have them or have not, and their presence is as much a mystery as their absence. the law of justice is not however involved by either alternative. in conclusion, the pillars of justice open into one world and the pillars of the high priestess into another. equity, rightness, probity, executive; triumph of the deserving side in law. reversed: law in all its departments, legal complications, bigotry, bias, excessive severity. equilíbrio verdade responsabilidade causa e efeito discernimento lei uma figura sentada entre pilares, espada numa mão, balança na outra, olhar directo. waite compõe deliberadamente esta carta como espelho da sacerdotisa — mas onde ela guarda um mistério que não se explica, a justiça representa \"a cada um segundo as suas obras\": um princípio de causa e efeito compreensível, não graça inexplicável. waite chama-lhe \"equidade, rectidão, probidade\". a espada erguida representa discernimento — a capacidade de cortar o que já não serve. a balança pesa não moralismo abstracto, mas a relação entre acção e consequência. os pilares, que ecoam os da sacerdotisa, marcam duas ordens distintas: a da graça incompreensível, e a da lei compreensível. historicamente, esta carta trocou de número com a força nos baralhos derivados de waite — nos baralhos de marselha e no thoth de crowley (onde se chama \"ajustamento\"), mantém a posição viii, mais antiga. pollack coloca esta carta no centro estrutural exacto da sequência de vinte e um trunfos e detém-se, de forma pouco comum, no livre-arbítrio como problema prático, não abstracto: \"o livre-arbítrio certamente existe. é que não sabemos como o usar.\" argumenta, a partir da própria experiência de leitora, que exercê-lo exige compreender causas, não apenas conhecer resultados. louis nota que a sua justiça retira a venda dos olhos, ao contrário da têmis clássica — porque, nesta etapa, a justiça verdadeira exige olhos abertos e lealdade à própria verdade, não imparcialidade cega. a busca de equidade pode tornar-se rigidez sobre regras, incapaz de tolerar excepções legítimas. o discernimento pode deslizar para julgamento severo de quem se desvia do que se considera \"certo\". a responsabilização pode ser usada para culpar em vez de compreender causas. sombra dourada: profunda apreciação da equidade, capaz de defender-se a si e aos outros sem perder o discernimento. pode assinalar a necessidade de assumir consequências de escolhas já feitas, em vez de as adiar. pode convidar a examinar uma situação com honestidade, mesmo quando isso complica uma narrativa mais confortável. pode apontar para uma decisão que pede equilíbrio entre os próprios interesses e os de outra pessoa. estou a ver esta situação com clareza, ou apenas do ângulo que mais me favorece? que consequência de uma escolha minha ainda não assumi por completo? a. e. waite; aleister crowley; rachel pollack; mariana louis; shannon knight."}, {"id": "the-hanged-man", "guia": {"palavras": ["rendição", "inversão de perspectiva", "pausa", "sacrifício voluntário", "espera"], "essencia": "Um homem pende de cabeça para baixo, suspenso por um pé de uma trave viva, o rosto sereno, um halo em torno da cabeça. Waite é incomum na sua própria incerteza sobre esta carta: recusa explicitamente lê-la como martírio, prudência ou \"grande obra\", preferindo dizer apenas que exprime \"a relação entre o Divino e o Universo\" — significado que se sente antes de se conseguir explicar.", "simbolismo": ["A trave viva, com folhas, indica que a suspensão não é morte mas um estado de vida em pausa.", "As pernas cruzadas formam uma cruz — não sofrimento gratuito, mas um símbolo de intersecção entre dois planos.", "A expressão serena do rosto, insiste Waite, mostra \"entrancement\", não sofrimento.", "Em Crowley, a carta liga-se à Água e a uma inversão que é também baptismo — morte que já contém, nela, o início de outra coisa."], "psicologia": "Nichols lê esta carta com particular ternura, sem a patologizar: cita Jung, para quem certas crises psíquicas podem ser medida correctiva da natureza, e não apenas disfunção a corrigir depressa. Sugere fisicamente virar a página para ver a carta \"dançar\" ao contrário. O seu argumento mais distintivo é que a pressa em \"resolver\" um período de suspensão ou impasse pode cortar pela raiz uma transformação necessária — a carta pede menos acção imediata do que tolerância ao desconforto de ver as coisas de um ângulo novo.", "sombra": ["A rendição pode tornar-se paralisia — usar a \"espera\" como desculpa para nunca decidir.", "A inversão de perspectiva pode ser evitada por orgulho ou obstinação, mantendo a visão habitual mesmo quando já não serve.", "O sacrifício pode tornar-se martírio performativo, mais sobre ser visto a sofrer do que sobre transformação real.", "Sombra dourada: valorizar ver por ângulos diferentes e procurar crescimento mesmo no desconforto."], "leitura": ["Pode assinalar um período em que agir directamente não é possível, nem sequer desejável — o trabalho, aqui, é de perspectiva.", "Pode convidar a olhar para uma situação já conhecida a partir de um ângulo completamente diferente.", "Pode apontar para uma pausa forçada que, vista de outro modo, pode revelar-se útil."], "pensar": ["O que vejo de diferente nesta situação se, por um momento, a olhar de cabeça para baixo?", "Estou a resistir a esta pausa, ou a usá-la para ver o que a pressa normalmente esconde?"], "fontes": "A. E. Waite; Aleister Crowley; C. G. Jung; Sallie Nichols; Mariana Louis."}, "nome": "The Hanged Man", "pt": "O Enforcado", "arcano": "maior", "num": 12, "naipe": null, "img": "12-TheHangedMan.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The gallows from which he is suspended forms a Tau cross, while the figure— from the position of the legs-forms a fylfot cross. There is a nimbus about the head of the seeming martyr. It should be noted (1) that the tree of sacrifice is living wood, with leaves thereon; (2) that the face expresses deep entrancement, not suffering; (3) that the figure, as a whole, suggests life in suspension, but life and not death. It is a card of profound significance, but all the significance is veiled. One of his s editors suggests that Eliphas Levi did not know the meaning, which is unquestionable nor did the editor himself. It has been called falsely a card of martyrdom, a card a of prudence, a card of the Great Work, a card of duty; but we may exhaust all published interpretations and find only vanity. I will say very simply on my own part that it expresses the relation, in one of its aspects, between the Divine and the Universe. He who can understand that the story of his higher nature is imbedded in this symbolism will receive intimations concerning a great awakening that is possible, and will know that after the sacred Mystery of Death there is a glorious Mystery of Resurrection."]}, {"t": "Resumo", "f": "Waite", "p": ["Wisdom, circumspection, discernment, trials, sacrifice, intuition, divination, prophecy. Reversed: Selfishness, the crowd, body politic."]}], "busca": "the hanged man o enforcado the gallows from which he is suspended forms a tau cross, while the figure— from the position of the legs-forms a fylfot cross. there is a nimbus about the head of the seeming martyr. it should be noted (1) that the tree of sacrifice is living wood, with leaves thereon; (2) that the face expresses deep entrancement, not suffering; (3) that the figure, as a whole, suggests life in suspension, but life and not death. it is a card of profound significance, but all the significance is veiled. one of his s editors suggests that eliphas levi did not know the meaning, which is unquestionable nor did the editor himself. it has been called falsely a card of martyrdom, a card a of prudence, a card of the great work, a card of duty; but we may exhaust all published interpretations and find only vanity. i will say very simply on my own part that it expresses the relation, in one of its aspects, between the divine and the universe. he who can understand that the story of his higher nature is imbedded in this symbolism will receive intimations concerning a great awakening that is possible, and will know that after the sacred mystery of death there is a glorious mystery of resurrection. wisdom, circumspection, discernment, trials, sacrifice, intuition, divination, prophecy. reversed: selfishness, the crowd, body politic. rendição inversão de perspectiva pausa sacrifício voluntário espera um homem pende de cabeça para baixo, suspenso por um pé de uma trave viva, o rosto sereno, um halo em torno da cabeça. waite é incomum na sua própria incerteza sobre esta carta: recusa explicitamente lê-la como martírio, prudência ou \"grande obra\", preferindo dizer apenas que exprime \"a relação entre o divino e o universo\" — significado que se sente antes de se conseguir explicar. a trave viva, com folhas, indica que a suspensão não é morte mas um estado de vida em pausa. as pernas cruzadas formam uma cruz — não sofrimento gratuito, mas um símbolo de intersecção entre dois planos. a expressão serena do rosto, insiste waite, mostra \"entrancement\", não sofrimento. em crowley, a carta liga-se à água e a uma inversão que é também baptismo — morte que já contém, nela, o início de outra coisa. nichols lê esta carta com particular ternura, sem a patologizar: cita jung, para quem certas crises psíquicas podem ser medida correctiva da natureza, e não apenas disfunção a corrigir depressa. sugere fisicamente virar a página para ver a carta \"dançar\" ao contrário. o seu argumento mais distintivo é que a pressa em \"resolver\" um período de suspensão ou impasse pode cortar pela raiz uma transformação necessária — a carta pede menos acção imediata do que tolerância ao desconforto de ver as coisas de um ângulo novo. a rendição pode tornar-se paralisia — usar a \"espera\" como desculpa para nunca decidir. a inversão de perspectiva pode ser evitada por orgulho ou obstinação, mantendo a visão habitual mesmo quando já não serve. o sacrifício pode tornar-se martírio performativo, mais sobre ser visto a sofrer do que sobre transformação real. sombra dourada: valorizar ver por ângulos diferentes e procurar crescimento mesmo no desconforto. pode assinalar um período em que agir directamente não é possível, nem sequer desejável — o trabalho, aqui, é de perspectiva. pode convidar a olhar para uma situação já conhecida a partir de um ângulo completamente diferente. pode apontar para uma pausa forçada que, vista de outro modo, pode revelar-se útil. o que vejo de diferente nesta situação se, por um momento, a olhar de cabeça para baixo? estou a resistir a esta pausa, ou a usá-la para ver o que a pressa normalmente esconde? a. e. waite; aleister crowley; c. g. jung; sallie nichols; mariana louis."}, {"id": "death", "guia": {"palavras": ["fim", "transformação", "desapego", "transição", "ciclo", "renúncia"], "essencia": "Um esqueleto de armadura, montado a cavalo, avança sobre um campo onde reis, crianças e clérigos caem ou se ajoelham por igual — a única figura verdadeiramente democrática do baralho. Apesar do nome, a tradição interpretativa é quase unânime: raramente indica morte literal. Simboliza antes o fim necessário de uma forma de vida ou de identidade que já cumpriu o seu propósito.", "simbolismo": ["A ausência de marcadores de género no esqueleto dissolve, pela primeira vez no baralho, o binário masculino/feminino que estruturou as cartas anteriores.", "O sol a nascer ao fundo, entre duas torres, sugere que o que morre aqui abre espaço para algo que ainda não tem nome.", "As diferentes reacções das figuras — resistência, súplica, aceitação — mostram várias posturas possíveis perante o mesmo fim inevitável.", "A bandeira com a rosa branca (Waite-Smith) associa a morte à pureza de um recomeço, não apenas à perda."], "psicologia": "Louis defende explicitamente o próprio nome da carta contra eufemismos contemporâneos (\"Renascimento\", \"Metamorfose\"): \"a Morte merece a seriedade que o seu nome implica\". Desenvolve a metáfora da borboleta — os discos imaginais que sobrevivem à digestão dentro do casulo — como imagem do que persiste através de uma transformação real. Nichols critica a tendência cultural de sanitizar a morte, literal e simbólica, e distingue mortificatio, o luto alquímico necessário de conteúdos ultrapassados, da obsessão literal com o fim.", "sombra": ["Evitar finais pode manter vivo, artificialmente, o que já não cumpre função.", "O medo da mudança pode gerar pessimismo generalizado perante qualquer transição.", "Agarrar-se ao que é familiar, mesmo doloroso, pode parecer mais seguro do que o vazio que se segue a um fim.", "Sombra dourada: ver os finais como oportunidades de transformação, aceitando os ciclos de fim e recomeço como parte da vida."], "leitura": ["Pode assinalar o fim real de uma fase, relação ou identidade — não sempre desejado, mas necessário.", "Pode convidar a perguntar o que está a ser mantido vivo apenas por hábito ou medo do vazio.", "Pode apontar para uma transição já em curso, ainda que não plenamente reconhecida."], "pensar": ["O que, na minha vida, já terminou de facto, mesmo que eu ainda não lhe tenha dado esse nome?", "Que parte de mim tenho medo de perder, mesmo sabendo que já não me serve?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis."}, "nome": "Death", "pt": "A Morte", "arcano": "maior", "num": 13, "naipe": null, "img": "13-Death.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The veil or mask of life is perpetuated in change, transformation and passage from lower to higher, and this is more fitly represented in the rectified Tarot by one of the apocalyptic visions than by the crude notion of the reaping skeleton. Behind it lies the whole world of ascent in the spirit. The mysterious horseman moves slowly, bearing a black banner emblazoned with the Mystic Rose, which signifies life. Between two pillars on the verge of the horizon there shines the sun of immortality. The horseman carries no visible weapon, but king and child and maiden fall before him, while a prelate with clasped hands awaits his end. There should be no need to point out that the suggestion of death which I have made in connection with the previous card is, of course, to be understood mystically, but this is not the case in the present instance. The natural transit of man to the next stage of his being either is or may be one form of his progress, but the exotic and almost unknown entrance, while still in this life, into the state of mystical death is a change in the form of consciousness and the passage into a state to which ordinary death is neither the path nor gate. The existing occult explanations of the 13th card are, on the whole, better than usual, rebirth, creation, destination, renewal, and the rest."]}, {"t": "Resumo", "f": "Waite", "p": ["End, mortality, destruction, corruption also, for a man, the loss of a benefactor for a woman, many contrarieties; for a maid, failure of marriage projects. Reversed: Inertia, sleep, lethargy, petrifaction, somnambulism; hope destroyed."]}], "busca": "death a morte the veil or mask of life is perpetuated in change, transformation and passage from lower to higher, and this is more fitly represented in the rectified tarot by one of the apocalyptic visions than by the crude notion of the reaping skeleton. behind it lies the whole world of ascent in the spirit. the mysterious horseman moves slowly, bearing a black banner emblazoned with the mystic rose, which signifies life. between two pillars on the verge of the horizon there shines the sun of immortality. the horseman carries no visible weapon, but king and child and maiden fall before him, while a prelate with clasped hands awaits his end. there should be no need to point out that the suggestion of death which i have made in connection with the previous card is, of course, to be understood mystically, but this is not the case in the present instance. the natural transit of man to the next stage of his being either is or may be one form of his progress, but the exotic and almost unknown entrance, while still in this life, into the state of mystical death is a change in the form of consciousness and the passage into a state to which ordinary death is neither the path nor gate. the existing occult explanations of the 13th card are, on the whole, better than usual, rebirth, creation, destination, renewal, and the rest. end, mortality, destruction, corruption also, for a man, the loss of a benefactor for a woman, many contrarieties; for a maid, failure of marriage projects. reversed: inertia, sleep, lethargy, petrifaction, somnambulism; hope destroyed. fim transformação desapego transição ciclo renúncia um esqueleto de armadura, montado a cavalo, avança sobre um campo onde reis, crianças e clérigos caem ou se ajoelham por igual — a única figura verdadeiramente democrática do baralho. apesar do nome, a tradição interpretativa é quase unânime: raramente indica morte literal. simboliza antes o fim necessário de uma forma de vida ou de identidade que já cumpriu o seu propósito. a ausência de marcadores de género no esqueleto dissolve, pela primeira vez no baralho, o binário masculino/feminino que estruturou as cartas anteriores. o sol a nascer ao fundo, entre duas torres, sugere que o que morre aqui abre espaço para algo que ainda não tem nome. as diferentes reacções das figuras — resistência, súplica, aceitação — mostram várias posturas possíveis perante o mesmo fim inevitável. a bandeira com a rosa branca (waite-smith) associa a morte à pureza de um recomeço, não apenas à perda. louis defende explicitamente o próprio nome da carta contra eufemismos contemporâneos (\"renascimento\", \"metamorfose\"): \"a morte merece a seriedade que o seu nome implica\". desenvolve a metáfora da borboleta — os discos imaginais que sobrevivem à digestão dentro do casulo — como imagem do que persiste através de uma transformação real. nichols critica a tendência cultural de sanitizar a morte, literal e simbólica, e distingue mortificatio, o luto alquímico necessário de conteúdos ultrapassados, da obsessão literal com o fim. evitar finais pode manter vivo, artificialmente, o que já não cumpre função. o medo da mudança pode gerar pessimismo generalizado perante qualquer transição. agarrar-se ao que é familiar, mesmo doloroso, pode parecer mais seguro do que o vazio que se segue a um fim. sombra dourada: ver os finais como oportunidades de transformação, aceitando os ciclos de fim e recomeço como parte da vida. pode assinalar o fim real de uma fase, relação ou identidade — não sempre desejado, mas necessário. pode convidar a perguntar o que está a ser mantido vivo apenas por hábito ou medo do vazio. pode apontar para uma transição já em curso, ainda que não plenamente reconhecida. o que, na minha vida, já terminou de facto, mesmo que eu ainda não lhe tenha dado esse nome? que parte de mim tenho medo de perder, mesmo sabendo que já não me serve? a. e. waite; aleister crowley; sallie nichols; mariana louis."}, {"id": "temperance", "guia": {"palavras": ["equilíbrio", "mediação", "integração", "paciência", "moderação", "síntese"], "essencia": "Um anjo, um pé na terra e outro na água, verte líquido entre dois cálices num fluxo contínuo. É a primeira imagem de reintegração depois do desmembramento da Morte — não ainda plenitude, mas o processo cuidadoso de voltar a juntar as partes. A carta representa menos \"moderação\" no sentido de conter-se, e mais a capacidade de combinar opostos sem os anular.", "simbolismo": ["O fluxo de líquido entre dois cálices, sem nunca se derramar, sugere um equilíbrio dinâmico, não estático.", "Um pé na água e outro na terra mostra a figura a habitar dois elementos ao mesmo tempo, sem escolher só um.", "O caminho ao fundo, que leva a montanhas distantes com uma coroa de luz, sugere que este equilíbrio serve um propósito, não é um fim em si.", "Em Crowley, a carta chama-se \"Arte\", e junta-se aos Enamorados na fórmula alquímica solve et coagula: dissolver e depois recombinar."], "psicologia": "Louis distingue cuidadosamente \"moderação\" (supressão) de verdadeira mediação (fusão de opostos): a carta não pede que se sinta menos, mas que se aprenda a sustentar sentimentos ou realidades contraditórias ao mesmo tempo. Nichols introduz aqui a imaginação activa como técnica formal, e o conceito junguiano de que a energia psíquica \"insiste no cumprimento das suas próprias condições\" — não se pode forçar por onde não quer fluir. É a carta da paciência que sabe que a integração leva tempo e não se apressa por ansiedade.", "sombra": ["O equilíbrio pode tornar-se evitamento — recusar tomar partido mesmo quando é necessário.", "A paciência pode deslizar para inércia, adiando indefinidamente decisões que já estão maduras.", "A capacidade de sustentar opostos pode transformar-se em indecisão crónica.", "Sombra dourada: sustentar sentimentos opostos ao mesmo tempo — alegria e tristeza, certeza e dúvida — sem colapsar num deles."], "leitura": ["Pode assinalar um processo de integração já em curso, que só precisa de tempo para se consolidar.", "Pode convidar a procurar um meio-termo real entre duas exigências ou desejos aparentemente incompatíveis.", "Pode apontar para a necessidade de moderar um extremo recente, sem negar o que o motivou."], "pensar": ["Onde estou a escolher entre dois opostos quando talvez pudesse encontrar uma forma de sustentar ambos?", "Que parte do processo que estou a viver não posso apressar, por mais que o queira?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Mariana Louis."}, "nome": "Temperance", "pt": "A Temperança", "arcano": "maior", "num": 14, "naipe": null, "img": "14-Temperance.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A winged angel, with the sign of the sun upon his forehead and on his breast the square and triangle of the septenary. I speak of him in the masculine sense, but the figure is neither male nor female. It is held to be pouring the essences of life from chalice to chalice. It has one foot upon the earth and one upon waters, thus illustrating the nature of the essences. A direct path goes up to certain heights on the verge of the horizon, and above there is a great light, through which a crown is seen vaguely. Hereof is some part of the Secret of Eternal Life, as it is possible to man in his incarnation. All the conventional emblems are renounced herein. So also are the conventional meanings, which refer to changes in the seasons, perpetual movement of life and even the combination of ideas. It is, moreover, untrue to say that the figure symbolizes the genius of the sun, though it is the analogy of solar light, realized in the third part of our human triplicity. It is called Temperance fantastically, because, when the rule of it obtains in our consciousness, it tempers, combines and harmonises the psychic and material natures. Under that rule we know in our rational part something of whence we came and whither we are going."]}, {"t": "Resumo", "f": "Waite", "p": ["Economy, moderation, frugality, management, accommodation. Reversed: Things connected with churches, religions, sects, the priesthood, sometimes even the priest who will marry the Querent; also disunion, unfortunate combinations, competing interests. 3.3 The Greater Arcana and their Divinatory Meanings"]}], "busca": "temperance a temperança a winged angel, with the sign of the sun upon his forehead and on his breast the square and triangle of the septenary. i speak of him in the masculine sense, but the figure is neither male nor female. it is held to be pouring the essences of life from chalice to chalice. it has one foot upon the earth and one upon waters, thus illustrating the nature of the essences. a direct path goes up to certain heights on the verge of the horizon, and above there is a great light, through which a crown is seen vaguely. hereof is some part of the secret of eternal life, as it is possible to man in his incarnation. all the conventional emblems are renounced herein. so also are the conventional meanings, which refer to changes in the seasons, perpetual movement of life and even the combination of ideas. it is, moreover, untrue to say that the figure symbolizes the genius of the sun, though it is the analogy of solar light, realized in the third part of our human triplicity. it is called temperance fantastically, because, when the rule of it obtains in our consciousness, it tempers, combines and harmonises the psychic and material natures. under that rule we know in our rational part something of whence we came and whither we are going. economy, moderation, frugality, management, accommodation. reversed: things connected with churches, religions, sects, the priesthood, sometimes even the priest who will marry the querent; also disunion, unfortunate combinations, competing interests. 3.3 the greater arcana and their divinatory meanings equilíbrio mediação integração paciência moderação síntese um anjo, um pé na terra e outro na água, verte líquido entre dois cálices num fluxo contínuo. é a primeira imagem de reintegração depois do desmembramento da morte — não ainda plenitude, mas o processo cuidadoso de voltar a juntar as partes. a carta representa menos \"moderação\" no sentido de conter-se, e mais a capacidade de combinar opostos sem os anular. o fluxo de líquido entre dois cálices, sem nunca se derramar, sugere um equilíbrio dinâmico, não estático. um pé na água e outro na terra mostra a figura a habitar dois elementos ao mesmo tempo, sem escolher só um. o caminho ao fundo, que leva a montanhas distantes com uma coroa de luz, sugere que este equilíbrio serve um propósito, não é um fim em si. em crowley, a carta chama-se \"arte\", e junta-se aos enamorados na fórmula alquímica solve et coagula: dissolver e depois recombinar. louis distingue cuidadosamente \"moderação\" (supressão) de verdadeira mediação (fusão de opostos): a carta não pede que se sinta menos, mas que se aprenda a sustentar sentimentos ou realidades contraditórias ao mesmo tempo. nichols introduz aqui a imaginação activa como técnica formal, e o conceito junguiano de que a energia psíquica \"insiste no cumprimento das suas próprias condições\" — não se pode forçar por onde não quer fluir. é a carta da paciência que sabe que a integração leva tempo e não se apressa por ansiedade. o equilíbrio pode tornar-se evitamento — recusar tomar partido mesmo quando é necessário. a paciência pode deslizar para inércia, adiando indefinidamente decisões que já estão maduras. a capacidade de sustentar opostos pode transformar-se em indecisão crónica. sombra dourada: sustentar sentimentos opostos ao mesmo tempo — alegria e tristeza, certeza e dúvida — sem colapsar num deles. pode assinalar um processo de integração já em curso, que só precisa de tempo para se consolidar. pode convidar a procurar um meio-termo real entre duas exigências ou desejos aparentemente incompatíveis. pode apontar para a necessidade de moderar um extremo recente, sem negar o que o motivou. onde estou a escolher entre dois opostos quando talvez pudesse encontrar uma forma de sustentar ambos? que parte do processo que estou a viver não posso apressar, por mais que o queira? a. e. waite; aleister crowley; sallie nichols; mariana louis."}, {"id": "the-devil", "guia": {"palavras": ["sombra", "tentação", "materialismo", "apego", "instinto reprimido", "ilusão de prisão"], "essencia": "Uma figura com chifres e asas preside a duas figuras acorrentadas a seus pés — só que, olhando bem, as correntes estão largas o suficiente para serem retiradas. O Diabo não é, na maior parte das leituras psicológicas, o mal em si, mas a sombra personificada: tudo o que foi reprimido, negado ou tratado como inaceitável, e que por isso passou a operar de forma autónoma e a parecer maior do que é.", "simbolismo": ["As correntes soltas ao pescoço das figuras acorrentadas são o detalhe central: a prisão é, em grande parte, uma ilusão de que não há alternativa.", "Os chifres, asas de morcego e patas de bode combinam símbolos de várias tradições associadas ao instinto e ao apetite, não a um mal metafísico único.", "A tocha invertida na mão do Diabo (Waite-Smith) sugere luz posta ao contrário — energia distorcida, não ausência de energia.", "Em Crowley, o Diabo liga-se a Saturno e Capricórnio, e à matéria levada ao seu extremo mais denso."], "psicologia": "Nichols desenvolve aqui o tratamento mais extenso da Sombra em todo o corpus reunido: cita Jung sobre a ambivalência do próprio divino, e argumenta que a repressão da sombra colectiva alimenta atrocidades em larga escala — somos, na formulação que retira de Jung, \"sempre, graças à nossa natureza humana, criminosos potenciais\". Pollack propõe uma leitura mais radical ainda: a carta fornece a energia reprimida e sobretudo sexual de que a consciência precisa para avançar — passar através, não à volta, do que foi tornado tabu. Louis trata directamente a projecção de sombra sobre o colectivo (preconceito, negação, hostilidade) como sombra pessoal não integrada, ampliada.", "sombra": ["(Esta carta é, ela própria, sobre a Sombra — por isso a tensão central não é \"sombra da carta\" mas o que a carta revela sobre qualquer sombra em geral.)", "O que reprimimos por vergonha tende a regressar de forma distorcida, maior e mais assustadora do que era.", "Culpar circunstâncias externas pode ser forma de evitar responsabilidade por um padrão próprio.", "A recusa de nomear um desejo ou impulso não o faz desaparecer — só o torna menos gerível.", "Sombra dourada (Knight): reconhecer os próprios gatilhos e procurar alternativas alinhadas com os próprios valores, em vez de negar que existem."], "leitura": ["Pode assinalar um padrão de dependência, controlo ou apego que vale a pena nomear directamente.", "Pode convidar a examinar o que se sente \"sem alternativa\", e verificar se essa ausência de saída é real ou aprendida.", "Pode apontar para um desejo ou impulso reprimido que está a agir de forma indirecta, precisamente por não ser reconhecido."], "pensar": ["Esta situação em que me sinto preso, tem mesmo correntes fechadas, ou estou apenas a não as tentar retirar?", "Que parte de mim julgo tão inaceitável que prefiro não olhar para ela de frente?"], "fontes": "A. E. Waite; Aleister Crowley; C. G. Jung; Sallie Nichols; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "The Devil", "pt": "O Diabo", "arcano": "maior", "num": 15, "naipe": null, "img": "15-TheDevil.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The design is an accommodation, mean or harmony, between several motives mentioned in the first part. The Horned Goat of Mendes, with wings like those of a bat, is standing on an altar. At the pit of the stomach there is the sign of Mercury. The right hand is upraised and extended, being the reverse of that benediction which is given by the Hierophant in the fifth card. In the left hand there is a great flaming torch, inverted towards the earth. A reversed pentagram is on the forehead. There is a ring in front of the altar, from which two chains are carried to the necks of two figures, male and female. These are analogous with those of the fifth card, as if Adam and Eve after the Fall. Hereof is the chain and fatality of the material life. The figures are tailed, to signify the animal nature, but there is human intelligence in the faces, and he who is exalted above them is not to be their master for ever. Even now, he is also a bondsman, sustained by the evil that is in him and blind to the liberty of service. With more than his usual s derision for the arts which he pretended to respect and interpret as a master therein, Eliphas Levi affirms that the Baphometic figure is occult science and magic. Another commentator says that in the Divine world it signifies predestination, but there is no correspondence in that world with the things which below are of the brute. What it does signify is the Dweller on the Threshold without the Mystical Garden when those are driven forth therefrom who have eaten the forbidden fruit."]}, {"t": "Resumo", "f": "Waite", "p": ["Ravage, violence, vehemence, extraordinary efforts, force, fatality; that which is predestined but is not for this reason evil. Reversed : Evil fatality, weakness, pettiness, blindness."]}], "busca": "the devil o diabo the design is an accommodation, mean or harmony, between several motives mentioned in the first part. the horned goat of mendes, with wings like those of a bat, is standing on an altar. at the pit of the stomach there is the sign of mercury. the right hand is upraised and extended, being the reverse of that benediction which is given by the hierophant in the fifth card. in the left hand there is a great flaming torch, inverted towards the earth. a reversed pentagram is on the forehead. there is a ring in front of the altar, from which two chains are carried to the necks of two figures, male and female. these are analogous with those of the fifth card, as if adam and eve after the fall. hereof is the chain and fatality of the material life. the figures are tailed, to signify the animal nature, but there is human intelligence in the faces, and he who is exalted above them is not to be their master for ever. even now, he is also a bondsman, sustained by the evil that is in him and blind to the liberty of service. with more than his usual s derision for the arts which he pretended to respect and interpret as a master therein, eliphas levi affirms that the baphometic figure is occult science and magic. another commentator says that in the divine world it signifies predestination, but there is no correspondence in that world with the things which below are of the brute. what it does signify is the dweller on the threshold without the mystical garden when those are driven forth therefrom who have eaten the forbidden fruit. ravage, violence, vehemence, extraordinary efforts, force, fatality; that which is predestined but is not for this reason evil. reversed : evil fatality, weakness, pettiness, blindness. sombra tentação materialismo apego instinto reprimido ilusão de prisão uma figura com chifres e asas preside a duas figuras acorrentadas a seus pés — só que, olhando bem, as correntes estão largas o suficiente para serem retiradas. o diabo não é, na maior parte das leituras psicológicas, o mal em si, mas a sombra personificada: tudo o que foi reprimido, negado ou tratado como inaceitável, e que por isso passou a operar de forma autónoma e a parecer maior do que é. as correntes soltas ao pescoço das figuras acorrentadas são o detalhe central: a prisão é, em grande parte, uma ilusão de que não há alternativa. os chifres, asas de morcego e patas de bode combinam símbolos de várias tradições associadas ao instinto e ao apetite, não a um mal metafísico único. a tocha invertida na mão do diabo (waite-smith) sugere luz posta ao contrário — energia distorcida, não ausência de energia. em crowley, o diabo liga-se a saturno e capricórnio, e à matéria levada ao seu extremo mais denso. nichols desenvolve aqui o tratamento mais extenso da sombra em todo o corpus reunido: cita jung sobre a ambivalência do próprio divino, e argumenta que a repressão da sombra colectiva alimenta atrocidades em larga escala — somos, na formulação que retira de jung, \"sempre, graças à nossa natureza humana, criminosos potenciais\". pollack propõe uma leitura mais radical ainda: a carta fornece a energia reprimida e sobretudo sexual de que a consciência precisa para avançar — passar através, não à volta, do que foi tornado tabu. louis trata directamente a projecção de sombra sobre o colectivo (preconceito, negação, hostilidade) como sombra pessoal não integrada, ampliada. (esta carta é, ela própria, sobre a sombra — por isso a tensão central não é \"sombra da carta\" mas o que a carta revela sobre qualquer sombra em geral.) o que reprimimos por vergonha tende a regressar de forma distorcida, maior e mais assustadora do que era. culpar circunstâncias externas pode ser forma de evitar responsabilidade por um padrão próprio. a recusa de nomear um desejo ou impulso não o faz desaparecer — só o torna menos gerível. sombra dourada (knight): reconhecer os próprios gatilhos e procurar alternativas alinhadas com os próprios valores, em vez de negar que existem. pode assinalar um padrão de dependência, controlo ou apego que vale a pena nomear directamente. pode convidar a examinar o que se sente \"sem alternativa\", e verificar se essa ausência de saída é real ou aprendida. pode apontar para um desejo ou impulso reprimido que está a agir de forma indirecta, precisamente por não ser reconhecido. esta situação em que me sinto preso, tem mesmo correntes fechadas, ou estou apenas a não as tentar retirar? que parte de mim julgo tão inaceitável que prefiro não olhar para ela de frente? a. e. waite; aleister crowley; c. g. jung; sallie nichols; rachel pollack; mariana louis; shannon knight."}, {"id": "the-tower", "guia": {"palavras": ["colapso", "ruptura súbita", "revelação", "libertação forçada", "crise"], "essencia": "Um raio atinge o topo de uma torre, e duas figuras caem de cabeça para baixo enquanto a coroa que a coroava é arremessada ao céu. É a imagem mais abruptamente violenta do baralho — e, na leitura psicológica que atravessa quase toda a tradição junguiana do Tarot, também uma das mais necessárias: o colapso súbito de uma estrutura que já não se sustenta por dentro.", "simbolismo": ["A coroa a saltar do topo da torre assinala que o que cai é precisamente aquilo que parecia mais seguro e mais elevado.", "O raio, e não uma força humana, sublinha que este colapso vem de fora do controlo consciente — não se escolhe, sofre-se.", "As duas figuras a cair em espelho sugerem que ninguém, nem quem construiu a torre nem quem nela vivia, escapa à sua queda.", "A torre construída sobre rocha, não sobre areia, indica que a fragilidade não estava nos alicerces materiais, mas em algo interno à própria estrutura."], "psicologia": "Nichols lê a torre atingida como libertação, não castigo: uma prisão mental ou ideológica rígida — hubris intelectual, racionalidade excessiva — a ser rachada por uma intervenção que a consciência, sozinha, não teria escolhido. Pollack cita Jung directamente e de forma central: a consciência como uma barragem que bloqueia o fluxo livre do inconsciente; a Temperança regula esse fluxo pouco a pouco, mas a Torre \"faz explodir completamente a barragem\". Louis é directa: tendemos a ver a Torre como algo que nos acontece, mas é frequentemente algo que acontece através de nós — o colapso de uma vida construída sobre premissas que, num momento de clareza súbita, deixam de fazer sentido.", "sombra": ["A crise pode ser usada, inconscientemente, como forma de evitar uma mudança mais lenta e deliberada que se recusava a fazer.", "A destruição pode confundir-se com progresso — nem tudo o que cai precisa de cair para se avançar.", "Ligar-se aos outros através do caos partilhado pode substituir intimidade real.", "Sombra dourada: não temer desmantelar estruturas ultrapassadas para construir outras, mais inclusivas, no seu lugar."], "leitura": ["Pode assinalar um colapso ou ruptura já em curso, mais do que iminente — algo que já começou a ceder.", "Pode convidar a reconhecer que uma certa estrutura (uma crença, uma rotina, uma relação) deixou de se sustentar por dentro, antes de esperar que caia por fora.", "Pode apontar para uma revelação súbita, desconfortável mas esclarecedora."], "pensar": ["Que estrutura na minha vida sinto que já não se sustenta, mesmo que ainda não tenha cedido por fora?", "O que ganharia clareza se deixasse cair algo que insisto em manter de pé?"], "fontes": "A. E. Waite; Aleister Crowley; C. G. Jung; Sallie Nichols; Rachel Pollack; Mariana Louis."}, "nome": "The Tower", "pt": "A Torre", "arcano": "maior", "num": 16, "naipe": null, "img": "16-TheTower.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["Occult explanations attached to this card are meagre and mostly disconcerting. It is idle to indicate that it depicts min in all its aspects, because it bears this evidence on the surface. It is said further that it contains the first allusion to a material building, but I do not conceive that the Tower is more or less material than the pillars which we have met with in three previous cases. I see nothing to warrant Papus in supposing that it is literally the fall of Adam, but there is more in favour of his alternative— that it signifies the materialization of the spiritual word. The bibliographer Christian imagines that it is the downfall of the mind, seeking to penetrate the mystery of God. I agree rather with Grand Orient that it is the ruin of the House of We, when evil has prevailed therein, and above all that it is the rending of a House of Doctrine. I understand that the reference is, however, to a House of Falsehood. It illustrates also in the most comprehensive way the old truth that \"except the Lord build the house, they labour in vain that build it.\" There is a sense in which the catastrophe is a reflection from the previous card, but not on the side of the symbolism which I have tried to indicate therein. It is more correctly a question of analogy; one is concerned with the fall into the material and animal state, while the other signifies destruction on the intellectual side. The Tower has been spoken of as the chastisement of pride and the intellect overwhelmed in the attempt to penetrate the Mystery of God; but in neither case do these explanations account for the two persons who are the living sufferers. The one is the literal word made void and the other its false interpretation. In yet a deeper sense, it may signify also the end of a dispensation, but there is no possibility here for the consideration of this involved question."]}, {"t": "Resumo", "f": "Waite", "p": ["Misery, distress, indigence, adversity, calamity, disgrace, deception, min. It is a card in particular of unforeseen catastrophe. Reversed : According to one account, the same in a lesser degree also oppression, imprisonment, tyranny."]}], "busca": "the tower a torre occult explanations attached to this card are meagre and mostly disconcerting. it is idle to indicate that it depicts min in all its aspects, because it bears this evidence on the surface. it is said further that it contains the first allusion to a material building, but i do not conceive that the tower is more or less material than the pillars which we have met with in three previous cases. i see nothing to warrant papus in supposing that it is literally the fall of adam, but there is more in favour of his alternative— that it signifies the materialization of the spiritual word. the bibliographer christian imagines that it is the downfall of the mind, seeking to penetrate the mystery of god. i agree rather with grand orient that it is the ruin of the house of we, when evil has prevailed therein, and above all that it is the rending of a house of doctrine. i understand that the reference is, however, to a house of falsehood. it illustrates also in the most comprehensive way the old truth that \"except the lord build the house, they labour in vain that build it.\" there is a sense in which the catastrophe is a reflection from the previous card, but not on the side of the symbolism which i have tried to indicate therein. it is more correctly a question of analogy; one is concerned with the fall into the material and animal state, while the other signifies destruction on the intellectual side. the tower has been spoken of as the chastisement of pride and the intellect overwhelmed in the attempt to penetrate the mystery of god; but in neither case do these explanations account for the two persons who are the living sufferers. the one is the literal word made void and the other its false interpretation. in yet a deeper sense, it may signify also the end of a dispensation, but there is no possibility here for the consideration of this involved question. misery, distress, indigence, adversity, calamity, disgrace, deception, min. it is a card in particular of unforeseen catastrophe. reversed : according to one account, the same in a lesser degree also oppression, imprisonment, tyranny. colapso ruptura súbita revelação libertação forçada crise um raio atinge o topo de uma torre, e duas figuras caem de cabeça para baixo enquanto a coroa que a coroava é arremessada ao céu. é a imagem mais abruptamente violenta do baralho — e, na leitura psicológica que atravessa quase toda a tradição junguiana do tarot, também uma das mais necessárias: o colapso súbito de uma estrutura que já não se sustenta por dentro. a coroa a saltar do topo da torre assinala que o que cai é precisamente aquilo que parecia mais seguro e mais elevado. o raio, e não uma força humana, sublinha que este colapso vem de fora do controlo consciente — não se escolhe, sofre-se. as duas figuras a cair em espelho sugerem que ninguém, nem quem construiu a torre nem quem nela vivia, escapa à sua queda. a torre construída sobre rocha, não sobre areia, indica que a fragilidade não estava nos alicerces materiais, mas em algo interno à própria estrutura. nichols lê a torre atingida como libertação, não castigo: uma prisão mental ou ideológica rígida — hubris intelectual, racionalidade excessiva — a ser rachada por uma intervenção que a consciência, sozinha, não teria escolhido. pollack cita jung directamente e de forma central: a consciência como uma barragem que bloqueia o fluxo livre do inconsciente; a temperança regula esse fluxo pouco a pouco, mas a torre \"faz explodir completamente a barragem\". louis é directa: tendemos a ver a torre como algo que nos acontece, mas é frequentemente algo que acontece através de nós — o colapso de uma vida construída sobre premissas que, num momento de clareza súbita, deixam de fazer sentido. a crise pode ser usada, inconscientemente, como forma de evitar uma mudança mais lenta e deliberada que se recusava a fazer. a destruição pode confundir-se com progresso — nem tudo o que cai precisa de cair para se avançar. ligar-se aos outros através do caos partilhado pode substituir intimidade real. sombra dourada: não temer desmantelar estruturas ultrapassadas para construir outras, mais inclusivas, no seu lugar. pode assinalar um colapso ou ruptura já em curso, mais do que iminente — algo que já começou a ceder. pode convidar a reconhecer que uma certa estrutura (uma crença, uma rotina, uma relação) deixou de se sustentar por dentro, antes de esperar que caia por fora. pode apontar para uma revelação súbita, desconfortável mas esclarecedora. que estrutura na minha vida sinto que já não se sustenta, mesmo que ainda não tenha cedido por fora? o que ganharia clareza se deixasse cair algo que insisto em manter de pé? a. e. waite; aleister crowley; c. g. jung; sallie nichols; rachel pollack; mariana louis."}, {"id": "the-star", "guia": {"palavras": ["esperança", "confiança", "vulnerabilidade", "renovação", "inspiração", "paz"], "essencia": "Uma mulher nua, ajoelhada junto a um lago, verte água de dois jarros — um sobre a terra, outro sobre a própria água. É a primeira figura humana totalmente despida do baralho depois do colapso da Torre: honestidade radical, sem persona a proteger. Sete estrelas menores rodeiam uma maior, que brilha por cima dela, imagem central de esperança depois da crise.", "simbolismo": ["A nudez, sem qualquer defesa ou disfarce, marca uma vulnerabilidade escolhida, não sofrida.", "Verter água simultaneamente sobre a terra e sobre a água já existente sugere que dar de si não esgota a fonte.", "Um pé dentro de água e outro sobre terra firme (nalgumas versões) equilibra sonho e realidade, sem que um anule o outro.", "A ave (íbis, associada a Thoth) presente nalgumas leituras liga a carta à origem da própria arte e criatividade humanas."], "psicologia": "Louis escreve este capítulo num registo lírico incomum: \"a luz que perseguimos é a luz que possuímos\". A Estrela representa a fase em que, depois da destruição da Torre, é possível voltar a confiar — não ingenuamente, mas com a experiência de ter sobrevivido ao colapso. Pollack emparelha esta carta com a Temperança: ambas vertem água de recipientes, mas onde a Temperança controla o fluxo com cautela, a Estrela liberta-o livremente, confiante numa fonte que não teme esgotar-se. Knight liga a sombra desta carta ao medo de voltar a mostrar-se depois de já ter sido magoado por o fazer.", "sombra": ["A abertura pode tornar-se exposição sem discernimento — mostrar tudo sem avaliar a quem.", "A esperança pode deslizar para passividade, à espera de que as coisas melhorem sozinhas.", "O medo de voltar a confiar, depois de uma desilusão, pode gerar isolamento disfarçado de autossuficiência.", "Sombra dourada: encarnar abertura e confiança, acreditando que a cura passa por aceitar o eu inteiro, com as suas falhas."], "leitura": ["Pode assinalar um momento de renovação genuína depois de um período difícil.", "Pode convidar a examinar a relação com a esperança: motor de acção, ou substituto dela?", "Pode apontar para a possibilidade de voltar a confiar, em si ou nos outros, depois de uma ruptura."], "pensar": ["Depois do que vivi, o que ainda me permito esperar, sem garantias?", "Onde é que a minha esperança precisa de se tornar acção, e não apenas sentimento?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Mariana Louis; Shannon Knight."}, "nome": "The Star", "pt": "A Estrela", "arcano": "maior", "num": 17, "naipe": null, "img": "17-TheStar.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["A great, radiant star of eight rays, surrounded by seven lesser stars— also of eight rays. The female figure in the foreground is entirely naked. Her left knee is on the land and her right foot upon the water. She pours Water of Life from two great ewers, irrigating sea and land. Behind her is rising ground and on the right a shrub or tree, whereon a bird alights. The figure expresses eternal youth and beauty. The star is I'etoile flamboyant e, which appears in Masonic symbolism, but has been confused therein. That which the figure communicates to the living scene is the substance of the heavens and the elements. It has been said truly that the mottoes of this card are \"Waters of Life freely\" and \"Gifts of the Spirit.\" The summary of several tawdry explanations says that it is a card of hope. On other planes it has been certified as immortality and interior light. For the majority of prepared minds, the figure will appear as the type of Truth unveiled, glorious in undying beauty, pouring on the waters of the soul some part and measure of her priceless possession. But she is in reality the Great Mother in the Kabalistic Sephira Binah, which is supernal Understanding, who communicates to the Sephiroth that are below in the measure that they can receive her influx."]}, {"t": "Resumo", "f": "Waite", "p": ["Loss, theft, privation, abandonment; another reading says-hope and bright prospects, Reversed: Arrogance, haughtiness, impotence."]}], "busca": "the star a estrela a great, radiant star of eight rays, surrounded by seven lesser stars— also of eight rays. the female figure in the foreground is entirely naked. her left knee is on the land and her right foot upon the water. she pours water of life from two great ewers, irrigating sea and land. behind her is rising ground and on the right a shrub or tree, whereon a bird alights. the figure expresses eternal youth and beauty. the star is i'etoile flamboyant e, which appears in masonic symbolism, but has been confused therein. that which the figure communicates to the living scene is the substance of the heavens and the elements. it has been said truly that the mottoes of this card are \"waters of life freely\" and \"gifts of the spirit.\" the summary of several tawdry explanations says that it is a card of hope. on other planes it has been certified as immortality and interior light. for the majority of prepared minds, the figure will appear as the type of truth unveiled, glorious in undying beauty, pouring on the waters of the soul some part and measure of her priceless possession. but she is in reality the great mother in the kabalistic sephira binah, which is supernal understanding, who communicates to the sephiroth that are below in the measure that they can receive her influx. loss, theft, privation, abandonment; another reading says-hope and bright prospects, reversed: arrogance, haughtiness, impotence. esperança confiança vulnerabilidade renovação inspiração paz uma mulher nua, ajoelhada junto a um lago, verte água de dois jarros — um sobre a terra, outro sobre a própria água. é a primeira figura humana totalmente despida do baralho depois do colapso da torre: honestidade radical, sem persona a proteger. sete estrelas menores rodeiam uma maior, que brilha por cima dela, imagem central de esperança depois da crise. a nudez, sem qualquer defesa ou disfarce, marca uma vulnerabilidade escolhida, não sofrida. verter água simultaneamente sobre a terra e sobre a água já existente sugere que dar de si não esgota a fonte. um pé dentro de água e outro sobre terra firme (nalgumas versões) equilibra sonho e realidade, sem que um anule o outro. a ave (íbis, associada a thoth) presente nalgumas leituras liga a carta à origem da própria arte e criatividade humanas. louis escreve este capítulo num registo lírico incomum: \"a luz que perseguimos é a luz que possuímos\". a estrela representa a fase em que, depois da destruição da torre, é possível voltar a confiar — não ingenuamente, mas com a experiência de ter sobrevivido ao colapso. pollack emparelha esta carta com a temperança: ambas vertem água de recipientes, mas onde a temperança controla o fluxo com cautela, a estrela liberta-o livremente, confiante numa fonte que não teme esgotar-se. knight liga a sombra desta carta ao medo de voltar a mostrar-se depois de já ter sido magoado por o fazer. a abertura pode tornar-se exposição sem discernimento — mostrar tudo sem avaliar a quem. a esperança pode deslizar para passividade, à espera de que as coisas melhorem sozinhas. o medo de voltar a confiar, depois de uma desilusão, pode gerar isolamento disfarçado de autossuficiência. sombra dourada: encarnar abertura e confiança, acreditando que a cura passa por aceitar o eu inteiro, com as suas falhas. pode assinalar um momento de renovação genuína depois de um período difícil. pode convidar a examinar a relação com a esperança: motor de acção, ou substituto dela? pode apontar para a possibilidade de voltar a confiar, em si ou nos outros, depois de uma ruptura. depois do que vivi, o que ainda me permito esperar, sem garantias? onde é que a minha esperança precisa de se tornar acção, e não apenas sentimento? a. e. waite; aleister crowley; sallie nichols; rachel pollack; mariana louis; shannon knight."}, {"id": "the-moon", "guia": {"palavras": ["incerteza", "inconsciente", "medo", "imaginação", "intuição", "confusão"], "essencia": "Duas torres ladeiam um caminho que se perde ao longe; um cão e um lobo uivam à lua, e um caranguejo emerge de uma poça de água. É, na leitura de Nichols, \"o momento mais sombrio da viagem\" — nenhuma figura humana presente, apenas instinto, sombra e reflexo. A Lua não ilumina directamente, apenas reflecte uma luz que não é sua: tudo aqui é percebido de forma indirecta, distorcida, incerta.", "simbolismo": ["As duas torres marcam um limiar estreito — passar por ele exige avançar sem ver claramente o caminho.", "O cão (domesticado) e o lobo (selvagem) uivando à lua representam dois graus do mesmo instinto: o que já foi integrado e o que ainda não.", "O caranguejo, regressivo e primordial, emerge da mesma água de onde tudo o resto veio — memória antiga, não ameaça nova.", "A lua com um rosto humano (Waite-Smith) sublinha que mesmo o mistério mais opaco tem, nele, algo de reconhecível."], "psicologia": "Pollack lê a Lua como o trabalho da imaginação a traduzir de volta para a consciência aquilo que a Estrela apenas tocou em êxtase informe — necessariamente distorcendo-o em formas monstruosas ou míticas, porque \"os mitos só conseguem apelar ao que está profundamente dentro do eu\". Nichols partilha, sobre este capítulo em particular, ter escrito primeiro um poema em prosa quando a pesquisa intelectual falhou — confissão de que, por vezes, é a intuição que precede e gera a compreensão, não o contrário. Knight liga a sombra desta carta à negação e à distorção da verdade, quando essa verdade parece demasiado esmagadora para ser encarada directamente.", "sombra": ["A incerteza pode gerar pânico ou paralisia, em vez de tolerância à ambiguidade.", "A imaginação pode distorcer factos ao serviço de um medo, não de uma clareza real.", "Evitar olhar para algo perturbador pode ser confundido com prudência.", "Sombra dourada: transparência e honestidade consigo mesmo e com os outros sobre material ainda confuso ou inconsciente."], "leitura": ["Pode assinalar um período de confusão genuína, em que a clareza ainda não é possível nem deve ser forçada.", "Pode convidar a distinguir o que é medo real do que é medo projectado sobre uma situação ambígua.", "Pode apontar para material inconsciente — um sonho, uma sensação difusa — que pede atenção sem ainda pedir resposta."], "pensar": ["O que sinto que ainda não consigo nomear com clareza, mas que já sinto a mexer-se por dentro?", "Este medo que sinto, é sobre o que está de facto a acontecer, ou sobre o que imagino que possa acontecer?"], "fontes": "A. E. Waite; Aleister Crowley; Sallie Nichols; Rachel Pollack; Shannon Knight."}, "nome": "The Moon", "pt": "A Lua", "arcano": "maior", "num": 18, "naipe": null, "img": "18-TheMoon.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The distinction between this card and some of the conventional types is that the moon is increasing on what is called the side of mercy, to the right of the observer. It has sixteen chief and sixteen secondary rays. The card represents life of the imagination apart from life of the spirit. The path between the towers is the issue into the unknown. The dog and wolf are the fears of the natural mind in the presence of that place of exit, when there is only reflected light to guide it. The last reference is a key to another form of symbolism. The intellectual light is a reflection and beyond it is the unknown mystery which it cannot shew forth. It illuminates our animal nature, types of which are represented below-the dog, the wolf and that which comes up out of the deeps, the nameless and hideous tendency which is lower than the savage beast. It strives to attain manifestation, symbolized by crawling from the abyss of water to the land, but as a rule it sinks back whence it came. The face of the mind directs a calm gaze upon the unrest below; the dew of thought falls; the message is: Peace, be still; and it may be that there shall come a calm upon the animal nature, while the abyss beneath shall cease from giving up a form."]}, {"t": "Resumo", "f": "Waite", "p": ["Hidden enemies, danger, calumny, darkness, terror, deception, occult forces, error. Reversed: Instability, inconstancy, silence, lesser degrees of deception and error."]}], "busca": "the moon a lua the distinction between this card and some of the conventional types is that the moon is increasing on what is called the side of mercy, to the right of the observer. it has sixteen chief and sixteen secondary rays. the card represents life of the imagination apart from life of the spirit. the path between the towers is the issue into the unknown. the dog and wolf are the fears of the natural mind in the presence of that place of exit, when there is only reflected light to guide it. the last reference is a key to another form of symbolism. the intellectual light is a reflection and beyond it is the unknown mystery which it cannot shew forth. it illuminates our animal nature, types of which are represented below-the dog, the wolf and that which comes up out of the deeps, the nameless and hideous tendency which is lower than the savage beast. it strives to attain manifestation, symbolized by crawling from the abyss of water to the land, but as a rule it sinks back whence it came. the face of the mind directs a calm gaze upon the unrest below; the dew of thought falls; the message is: peace, be still; and it may be that there shall come a calm upon the animal nature, while the abyss beneath shall cease from giving up a form. hidden enemies, danger, calumny, darkness, terror, deception, occult forces, error. reversed: instability, inconstancy, silence, lesser degrees of deception and error. incerteza inconsciente medo imaginação intuição confusão duas torres ladeiam um caminho que se perde ao longe; um cão e um lobo uivam à lua, e um caranguejo emerge de uma poça de água. é, na leitura de nichols, \"o momento mais sombrio da viagem\" — nenhuma figura humana presente, apenas instinto, sombra e reflexo. a lua não ilumina directamente, apenas reflecte uma luz que não é sua: tudo aqui é percebido de forma indirecta, distorcida, incerta. as duas torres marcam um limiar estreito — passar por ele exige avançar sem ver claramente o caminho. o cão (domesticado) e o lobo (selvagem) uivando à lua representam dois graus do mesmo instinto: o que já foi integrado e o que ainda não. o caranguejo, regressivo e primordial, emerge da mesma água de onde tudo o resto veio — memória antiga, não ameaça nova. a lua com um rosto humano (waite-smith) sublinha que mesmo o mistério mais opaco tem, nele, algo de reconhecível. pollack lê a lua como o trabalho da imaginação a traduzir de volta para a consciência aquilo que a estrela apenas tocou em êxtase informe — necessariamente distorcendo-o em formas monstruosas ou míticas, porque \"os mitos só conseguem apelar ao que está profundamente dentro do eu\". nichols partilha, sobre este capítulo em particular, ter escrito primeiro um poema em prosa quando a pesquisa intelectual falhou — confissão de que, por vezes, é a intuição que precede e gera a compreensão, não o contrário. knight liga a sombra desta carta à negação e à distorção da verdade, quando essa verdade parece demasiado esmagadora para ser encarada directamente. a incerteza pode gerar pânico ou paralisia, em vez de tolerância à ambiguidade. a imaginação pode distorcer factos ao serviço de um medo, não de uma clareza real. evitar olhar para algo perturbador pode ser confundido com prudência. sombra dourada: transparência e honestidade consigo mesmo e com os outros sobre material ainda confuso ou inconsciente. pode assinalar um período de confusão genuína, em que a clareza ainda não é possível nem deve ser forçada. pode convidar a distinguir o que é medo real do que é medo projectado sobre uma situação ambígua. pode apontar para material inconsciente — um sonho, uma sensação difusa — que pede atenção sem ainda pedir resposta. o que sinto que ainda não consigo nomear com clareza, mas que já sinto a mexer-se por dentro? este medo que sinto, é sobre o que está de facto a acontecer, ou sobre o que imagino que possa acontecer? a. e. waite; aleister crowley; sallie nichols; rachel pollack; shannon knight."}, {"id": "the-sun", "guia": {"palavras": ["alegria", "vitalidade", "clareza", "autenticidade", "simplicidade", "celebração"], "essencia": "Uma criança nua, montada num cavalo branco, avança sob um sol radiante numa auréola de girassóis. Waite descreve-a como \"a transição da luz manifesta deste mundo... para a luz do mundo que há-de vir, tipificada pelo coração de uma criança\" — não regresso à infância literal, mas recuperação de uma simplicidade que Waite chama \"inocência no sentido da sabedoria\".", "simbolismo": ["A nudez da criança, depois da nudez vulnerável da Estrela e da opacidade da Lua, marca agora simplicidade sem nada a esconder nem a temer.", "O cavalo branco, sem sela nem rédeas, sugere vitalidade conduzida sem necessidade de controlo forçado.", "Os girassóis voltados para o sol simbolizam crescimento orientado naturalmente para aquilo que nutre.", "O estandarte vermelho na mão da criança (Waite-Smith) sugere que esta alegria não é passiva, mas activamente afirmada."], "psicologia": "Nichols cita longamente o ensaio de Jung sobre o arquétipo da criança, ligando-o à necessidade — defendida também por von Franz — de \"perder tempo\" para desenvolver aquilo que em nós ficou menos exercitado. É a primeira carta em que os opostos masculino e feminino, presentes desde o início do baralho, interagem directamente em corpos humanos, sem figura mediadora. Louis avisa, contudo, que esta \"consciência solar\" tem uma sombra específica: o complexo do Puer Aeternus de Jung — viver de forma provisória, sempre a adiar compromisso e responsabilidade em nome de uma leveza que se recusa a crescer.", "sombra": ["A busca de alegria pode tornar-se positividade forçada — negar dificuldades reais em nome de parecer bem.", "A simplicidade pode deslizar para evitamento de responsabilidade, recusando o peso que a vida adulta exige.", "A vitalidade pode confundir-se com impulsividade sem consideração pelas consequências.", "Sombra dourada: equilibrar felicidade e sucesso interiores com a aceitação do fracasso e da dificuldade, sem perder autenticidade."], "leitura": ["Pode assinalar um período de clareza e vitalidade genuínas, depois de uma fase mais confusa.", "Pode convidar a examinar se uma certa positividade é autêntica ou uma máscara sobre algo mais difícil.", "Pode apontar para a recuperação de uma simplicidade ou espontaneidade perdidas."], "pensar": ["Esta alegria que sinto ou procuro, é real, ou é uma forma de não olhar para algo mais difícil?", "O que faria hoje se não tivesse medo de parecer demasiado simples, demasiado feliz, ou demasiado sério?"], "fontes": "A. E. Waite; Sallie Nichols; Mariana Louis."}, "nome": "The Sun", "pt": "O Sol", "arcano": "maior", "num": 19, "naipe": null, "img": "19-TheSun.png", "secoes": [{"t": "Descrição e simbolismo", "f": "Waite", "p": ["The naked child mounted on a white horse and displaying a red standard has been mentioned already as the better symbolism connected with this card. It is the destiny of the Supernatural East and the great and holy light which goes before the endless procession of humanity, coming out from the walled garden of the sensitive life and passing on the journey home. The card signifies, therefore, the transit from the manifest light of this world, represented
